# ============================================
# Ansible Configuration
# ============================================
# Uses shared inventory from lab-02
# Run all commands from this lab directory

[defaults]
inventory = ../lab-02-inventory/inventory.yml
remote_user = nag
private_key_file = ~/.ssh/google_compute_engine
host_key_checking = False
retry_files_enabled = False
library = ./library

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
