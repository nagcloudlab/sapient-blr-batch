<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 24px;
            background: #f8fafc;
            color: #0f172a;
        }

        h1 {
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
        }

        th,
        td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }

        th {
            background: #e2e8f0;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty {
            margin-top: 12px;
            color: #475569;
        }
    </style>
</head>
<body>
    <h1>Todo List</h1>

    <table th:if="${todos != null and !todos.isEmpty()}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="todo : ${todos}">
                <td th:text="${todo.id}">1</td>
                <td th:text="${todo.title}">Sample title</td>
                <td th:text="${todo.description}">Sample description</td>
                <td th:text="${todo.status}">PENDING</td>
            </tr>
        </tbody>
    </table>

    <p class="empty" th:if="${todos == null or todos.isEmpty()}">No todos found.</p>
</body>
</html>
