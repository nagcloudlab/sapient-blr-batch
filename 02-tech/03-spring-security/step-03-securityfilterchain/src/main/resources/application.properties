# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:calendardb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schema and data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/h2/calendar-schema.sql
spring.sql.init.data-locations=classpath:database/h2/calendar-data.sql

# Thymeleaf
spring.thymeleaf.cache=false

# Step 02: Enable security debug logging to see the filter chain
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
