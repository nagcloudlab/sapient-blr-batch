<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="'Event - ' + ${event.summary}">Event Details</title>
    <!--/*/ <th:block th:insert="~{fragments/headerinc :: head}"></th:block> /*/-->
</head>
<body>
<div class="container">
    <!--/*/ <th:block th:insert="~{fragments/header :: header}"></th:block> /*/-->

    <h3 th:text="${event.summary}">Event Summary</h3>

    <dl class="row mt-4">
        <dt class="col-sm-3">Owner</dt>
        <dd class="col-sm-9" th:text="${event.owner.name}"></dd>

        <dt class="col-sm-3">Attendee</dt>
        <dd class="col-sm-9" th:text="${event.attendee.name}"></dd>

        <dt class="col-sm-3">When</dt>
        <dd class="col-sm-9" th:text="${#calendars.format(event.dateWhen, 'yyyy-MM-dd HH:mm')}"></dd>

        <dt class="col-sm-3">Description</dt>
        <dd class="col-sm-9" th:text="${event.description}"></dd>
    </dl>

    <a class="btn btn-secondary" th:href="@{/events/}">Back to All Events</a>

    <!--/*/ <th:block th:insert="~{fragments/footer :: foot}"></th:block> /*/-->
</div>
</body>
</html>
