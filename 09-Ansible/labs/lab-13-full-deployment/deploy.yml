---
# ============================================
# Full End-to-End Deployment Playbook
# ============================================

# ---- Play 1: Common Setup ----
- name: Base setup on all servers
  hosts: all
  become: yes
  tags: base

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name: [curl, wget, vim, htop, unzip, net-tools]
        state: present

# ---- Play 2: Deploy Spring Boot ----
- name: Deploy Spring Boot Application
  hosts: appservers
  become: yes
  serial: 1                         # Rolling deployment: one at a time
  max_fail_percentage: 0            # Stop if any host fails
  tags: app

  vars:
    app_dir: /opt/springboot
    app_user: springboot
    app_port: 8080
    jar_file: "hello-api-1.0.0.jar"
    local_jar: "../lab-06-springboot-playbook/app/target/hello-api-1.0.0.jar"

  pre_tasks:
    - name: "[Pre] Check current app status"
      command: systemctl is-active springboot
      register: app_status
      ignore_errors: yes
      changed_when: false

    - name: "[Pre] Display current status"
      debug:
        msg: "App is currently {{ app_status.stdout | default('not installed') }}"

  tasks:
    - name: Ensure Java is installed
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Create app user
      user:
        name: "{{ app_user }}"
        system: yes
        shell: /usr/sbin/nologin

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    - name: Copy application JAR to server
      copy:
        src: "{{ local_jar }}"
        dest: "{{ app_dir }}/{{ jar_file }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      notify: Restart Spring Boot

    - name: Deploy systemd service
      copy:
        content: |
          [Unit]
          Description=Spring Boot Application
          After=network.target
          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/java -Xms256m -Xmx512m -jar {{ app_dir }}/{{ jar_file }}
          Restart=always
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/springboot.service
      notify:
        - Reload systemd
        - Restart Spring Boot

    - name: Start Spring Boot
      service:
        name: springboot
        state: started
        enabled: yes

  post_tasks:
    - name: "[Post] Wait for app to be ready"
      wait_for:
        port: "{{ app_port }}"
        delay: 5
        timeout: 60

    - name: "[Post] Health check"
      uri:
        url: "http://localhost:{{ app_port }}"
        status_code: 200
      register: health
      retries: 5
      delay: 10
      until: health.status == 200

    - name: "[Post] App is healthy"
      debug:
        msg: "Spring Boot is UP and healthy on {{ inventory_hostname }}"

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Spring Boot
      service:
        name: springboot
        state: restarted

# ---- Play 3: Configure NGINX Reverse Proxy ----
- name: Configure NGINX Reverse Proxy
  hosts: webservers
  become: yes
  tags: web

  vars:
    backend_host: "<VM2_IP>"    # !!! REPLACE with VM2 external IP (gcloud compute instances list)
    backend_port: 8080

  tasks:
    - name: Install NGINX
      apt:
        name: nginx
        state: present

    - name: Deploy reverse proxy config
      copy:
        content: |
          upstream backend {
              server {{ backend_host }}:{{ backend_port }};
          }
          server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
              location /health {
                  return 200 'OK';
                  add_header Content-Type text/plain;
              }
          }
        dest: /etc/nginx/sites-available/default
      notify: Restart NGINX

    - name: Start NGINX
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: Restart NGINX
      service:
        name: nginx
        state: restarted

# ---- Play 4: Final Verification ----
- name: Final end-to-end verification
  hosts: webservers
  tags: verify

  tasks:
    - name: Test NGINX reverse proxy to Spring Boot
      uri:
        url: "http://localhost/health"
        return_content: yes
      register: final_check

    - name: Deployment complete
      debug:
        msg: |
          ====================================
          DEPLOYMENT SUCCESSFUL!
          NGINX: http://{{ ansible_host }}
          Backend: {{ ansible_host }} → Spring Boot
          Status: {{ final_check.status }}
          ====================================
