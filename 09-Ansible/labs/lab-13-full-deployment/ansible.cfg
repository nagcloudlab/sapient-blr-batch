# ============================================
# Optimized Ansible Configuration
# ============================================
# !!! Replace <YOUR_GCP_USERNAME> below !!!

[defaults]
inventory = ../lab-02-inventory/inventory.yml
remote_user = <YOUR_GCP_USERNAME>              # REPLACE (gcloud config get-value account, part before @)
private_key_file = ~/.ssh/google_compute_engine
host_key_checking = False
retry_files_enabled = False

# Performance optimizations
forks = 10                    # Parallel host connections (default: 5)
gathering = smart             # Cache facts, don't re-gather
fact_caching = jsonfile        # Cache facts to disk
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600   # Cache for 1 hour
pipelining = True             # Reduce SSH operations (faster!)
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True             # Major speed improvement
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
