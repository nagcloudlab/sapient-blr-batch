---
# ============================================
# First Playbook - Install Common Packages
# ============================================

- name: Setup base packages on all servers
  hosts: all
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name:
          - curl
          - wget
          - vim
          - htop
          - unzip
          - git
          - net-tools
        state: present

    - name: Set timezone to UTC
      timezone:
        name: UTC

    - name: Ensure /opt/apps directory exists
      file:
        path: /opt/apps
        state: directory
        mode: "0755"

    - name: Create a welcome file
      copy:
        content: |
          ================================
          Managed by Ansible
          Hostname: {{ inventory_hostname }}
          ================================
        dest: /etc/motd
        mode: "0644"
