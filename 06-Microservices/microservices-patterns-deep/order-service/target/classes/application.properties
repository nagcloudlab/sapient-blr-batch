spring.application.name=order-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Actuator - expose all endpoints for monitoring demo
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Distributed Tracing - export to Tempo via Zipkin protocol
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Logging - include traceId/spanId in logs
logging.pattern.correlation=[${spring.application.name},traceId=%mdc{traceId:-},spanId=%mdc{spanId:-}]
