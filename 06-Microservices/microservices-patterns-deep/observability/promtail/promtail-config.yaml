server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-boot-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-boot
          __path__: /var/log/spring/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            service: service
            traceId: traceId
            spanId: spanId
            message: message
      - labels:
          level:
          logger:
          service:
          traceId:
          spanId:
      - output:
          source: message
