<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickTicket — Event Booking</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    header h1 span {
      color: #e84c3d;
    }

    /* ── Layout ── */
    .page-wrapper {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto auto 1fr;
      gap: 1.5rem;
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
    }

    /* ── Search bar ── */
    .search-bar {
      grid-column: 1 / 2;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .search-bar label {
      font-size: 0.85rem;
      color: #666;
      white-space: nowrap;
    }

    #search {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #search:focus { border-color: #e84c3d; }

    /* ── Events list ── */
    #events {
      grid-column: 1 / 2;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .event-card {
      background: #fff;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      transition: box-shadow 0.2s;
    }

    .event-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.12); }

    .event-info h3 { font-size: 1rem; margin-bottom: 0.25rem; }

    .venue {
      font-size: 0.82rem;
      color: #777;
      margin-bottom: 0.4rem;
    }

    .category-tag {
      font-size: 0.72rem;
      background: #f0f0f0;
      color: #444;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .event-price {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    /* ── Cart sidebar ── */
    #cart {
      grid-column: 2 / 3;
      grid-row: 1 / 4;
      background: #fff;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      align-self: start;
      position: sticky;
      top: 1.5rem;
    }

    #cart h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid #eee;
    }

    #cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 80px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      padding: 0.4rem 0;
      border-bottom: 1px dashed #f0f0f0;
    }

    .cart-item-info {
      display: flex;
      flex-direction: column;
    }

    .cart-item-name { font-weight: 600; }

    .cart-item-qty {
      font-size: 0.78rem;
      color: #888;
    }

    .cart-item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .cart-item-price { font-weight: 700; }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 2px solid #1a1a2e;
      font-weight: 700;
    }

    #cart-total { font-size: 1.1rem; color: #e84c3d; }

    /* ── Featured section ── */
    #featured {
      grid-column: 1 / 2;
    }

    #featured h2 { font-size: 1rem; margin-bottom: 0.75rem; }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
    }

    .featured-card {
      background: #1a1a2e;
      color: #fff;
      border-radius: 8px;
      padding: 1rem;
    }

    .featured-card h4 { font-size: 0.9rem; margin-bottom: 0.3rem; }
    .featured-card p  { font-size: 0.78rem; color: #aaa; margin-bottom: 0.5rem; }
    .featured-card strong { color: #e84c3d; }

    /* ── Buttons ── */
    .btn-add {
      background: #e84c3d;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover { background: #c0392b; }

    .btn-remove {
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      font-size: 0.72rem;
      cursor: pointer;
      color: #888;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-remove:hover { border-color: #e84c3d; color: #e84c3d; }

    /* ── Spinner ── */
    #spinner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      color: #666;
      font-size: 0.9rem;
      grid-column: 1 / 2;
    }

    .spinner-ring {
      width: 20px;
      height: 20px;
      border: 3px solid #eee;
      border-top-color: #e84c3d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error banner ── */
    #error {
      display: none;
      background: #fff0ef;
      border: 1px solid #e84c3d;
      color: #c0392b;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      grid-column: 1 / 2;
    }

    /* ── Empty state ── */
    .empty-state {
      color: #aaa;
      font-size: 0.88rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Quick<span>Ticket</span></h1>
    <span style="font-size:0.8rem;color:#aaa;">Assessment 2 — JavaScript Fundamentals</span>
  </header>

  <div class="page-wrapper">

    <!-- Search -->
    <div class="search-bar">
      <label for="search">Search events:</label>
      <input
        id="search"
        type="text"
        placeholder="e.g. Jazz, Comedy, Tech..."
        autocomplete="off"
      />
    </div>

    <!-- Events list -->
    <section id="events" aria-label="Event listings">
      <!-- Populated by renderEvents() -->
    </section>

    <!-- Spinner -->
    <div id="spinner" role="status" aria-live="polite">
      <div class="spinner-ring"></div>
      <span>Loading featured events...</span>
    </div>

    <!-- Error -->
    <div id="error" role="alert" aria-live="assertive"></div>

    <!-- Featured events (loaded via API) -->
    <section id="featured" aria-label="Featured events">
      <!-- Populated by renderFeatured() -->
    </section>

    <!-- Cart sidebar -->
    <aside id="cart" aria-label="Booking cart">
      <h2>Your Cart</h2>
      <div id="cart-items">
        <!-- Populated by renderCart() -->
      </div>
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>
    </aside>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
