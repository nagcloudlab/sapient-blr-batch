openapi: "3.0.3"
info:
  title: QuickTicket API
  version: "1.0.0"
  description: Event booking API for QuickTicket platform

paths:

  /api/events:
    get:
      summary: Create a new event
      tags:
        - Events
      requestBody:
        content:
          text/plain:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                date:
                  type: string
                  format: date-time
                price:
                  type: number
                capacity:
                  type: integer
      responses:
        "201":
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Validation error

  /api/events/{id}:
    get:
      summary: Get event by ID
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "200":
          description: Event not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        date:
          type: string
          format: date-time
        price:
          type: number
        capacity:
          type: integer
        availableSeats:
          type: integer
