<VirtualHost *:443>
    ServerName quickticket.example.com

    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName quickticket.example.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/quickticket.crt
    SSLCertificateKeyFile /etc/ssl/private/quickticket.key

    DocumentRoot /var/www/quickticket/public

    <Directory /var/www/quickticket/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api http://localhost:3000/api
    ProxyPassReverse /api http://localhost:3000/api

    ErrorLog  /var/log/apache2/quickticket-error.log
    CustomLog /var/log/apache2/quickticket-access.log combined
</VirtualHost>
