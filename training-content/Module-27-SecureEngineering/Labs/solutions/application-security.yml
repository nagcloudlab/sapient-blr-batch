# FoodExpress Production Security Configuration
# FIX: All security misconfigurations resolved

spring:
  application:
    name: foodexpress-api

  # FIX: Debug mode DISABLED in production
  debug: false

  # FIX: Actuator endpoints restricted to only health and info
  management:
    endpoints:
      web:
        exposure:
          include: health,info    # FIX: Only expose safe endpoints
    endpoint:
      env:
        enabled: false            # FIX: Environment variables not exposed
      shutdown:
        enabled: false            # FIX: Remote shutdown disabled

server:
  error:
    # FIX: Minimal error information shown to users
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: INFO                    # FIX: INFO level in production
    org.springframework.security: WARN  # FIX: Only warnings and errors for security
