# FoodExpress Problem Record Template -- FIXED VERSION

problem:
  number: PRB-2026-0025
  title: "Recurring payment timeout errors every Tuesday evening"
  description: "Payment service returns timeout errors between 18:00-19:00 every Tuesday"

  # Fix 1: Status should be "Known Error" (root cause found, fix pending)
  status: "Known Error"

  # Fix 2: List all 5 related incidents
  related_incidents:
    - INC-2026-0440  # 2026-08-15 Tuesday
    - INC-2026-0445  # 2026-08-22 Tuesday
    - INC-2026-0449  # 2026-08-29 Tuesday
    - INC-2026-0453  # 2026-09-02 Tuesday
    - INC-2026-0460  # 2026-09-09 Tuesday

  # Fix 3: Complete 5 Whys analysis
  root_cause_analysis:
    method: "5 Whys"
    analysis:
      why_1: "Payment service times out when processing requests"
      why_2: "Database queries for payment verification take > 30 seconds"
      why_3: "Table lock contention on the orders table blocks payment queries"
      why_4: "Weekly analytics report runs a full table scan every Tuesday at 18:00"
      why_5: "The report query has no index on the orders.created_at column, causing a full scan of 10M+ rows"
    root_cause: "Missing index on orders.created_at column causes full table scans during the weekly analytics report, creating lock contention that blocks payment service queries"

  # Fix 4: Actionable workaround
  known_error:
    status: "Documented"
    workaround: "If payment timeouts occur on Tuesday evening, temporarily kill the analytics report process: SELECT id FROM information_schema.processlist WHERE info LIKE '%weekly_report%'; then KILL <id>. Notify the analytics team. This provides immediate relief while the permanent fix is implemented."
    workaround_effectiveness: "Tested on 2026-09-02 -- payment latency returned to normal within 30 seconds of killing the report query"

  # Fix 5: Permanent fix with change request and timeline
  permanent_fix:
    description: "1. Add index on orders.created_at column. 2. Move analytics report to read replica. 3. Schedule report during low-traffic window (03:00-05:00)."
    change_request: "CHG-2026-0092"
    target_date: "2026-09-10"

  # Fix 6: Accurate trend data matching incidents
  trend_data:
    first_detected: "2026-08-15"
    occurrence_pattern: "Every Tuesday between 18:00-19:00 IST, coinciding with weekly analytics report"
    related_incident_count: 5

  category: "Application > Payment > Gateway"
  priority: P2
  owner: "Platform Engineering"
