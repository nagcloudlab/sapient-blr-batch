# FoodExpress Priority Matrix Reference
# Use this as a reference when fixing the incident and SLA templates

priority_matrix:
  description: "Priority is determined by Impact x Urgency"

  impact_levels:
    high: "Affects > 500 users or critical business function"
    medium: "Affects 50-500 users or important business function"
    low: "Affects < 50 users or non-critical function"

  urgency_levels:
    high: "No workaround available, business severely impacted NOW"
    medium: "Workaround available but degraded service"
    low: "Impact is minimal, can be scheduled"

  matrix:
    high_high: P1
    high_medium: P2
    high_low: P3
    medium_high: P2
    medium_medium: P3
    medium_low: P4
    low_high: P3
    low_medium: P4
    low_low: P5

  response_targets:
    P1: { response: "15 min", resolution: "4 hours", escalation: "15 min" }
    P2: { response: "30 min", resolution: "8 hours", escalation: "4 hours" }
    P3: { response: "2 hours", resolution: "24 hours", escalation: "8 hours" }
    P4: { response: "4 hours", resolution: "48 hours", escalation: "24 hours" }
    P5: { response: "1 day", resolution: "5 days", escalation: "48 hours" }
