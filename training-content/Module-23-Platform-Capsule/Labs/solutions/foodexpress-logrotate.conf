# FoodExpress Log Rotation Configuration
# Place in /etc/logrotate.d/foodexpress

# FIX: Corrected path from /var/logs/ to /var/log/
/var/log/foodexpress/*.log {
    daily
    rotate 7
    missingok
    notifempty
    # FIX: Added compress and delaycompress to save disk space
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    create 0644 foodexpress foodexpress
    postrotate
        # Notify application to reopen log files
        systemctl reload order-service 2>/dev/null || true
        systemctl reload payment-service 2>/dev/null || true
    endscript
}
