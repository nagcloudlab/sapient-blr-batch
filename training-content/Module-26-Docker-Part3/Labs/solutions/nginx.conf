# FoodExpress NGINX Reverse Proxy Configuration (Fixed)

events {
    worker_connections 1024;
}

http {
    upstream order_backend {
        # FIX: Corrected port from 8080 to 8081
        server order-service:8081;
    }

    upstream restaurant_backend {
        server restaurant-service:3000;
    }

    upstream payment_backend {
        server payment-service:8082;
    }

    server {
        listen 80;

        location /api/orders {
            proxy_pass http://order_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/restaurants {
            proxy_pass http://restaurant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payments {
            proxy_pass http://payment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        error_page 502 /502.html;
        error_page 504 /504.html;
    }
}
