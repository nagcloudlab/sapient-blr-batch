# FoodExpress Full Stack -- Docker Compose
# BUG: Multiple issues prevent this stack from starting correctly

version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - order-service
      - restaurant-service
    networks:
      - foodexpress-net

  order-service:
    image: foodexpress/order-service:1.0
    # BUG: Port 8082 on host conflicts with payment-service (should be 8081)
    ports:
      - "8082:8081"
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: mysql-db
      DB_PORT: 3306
      REDIS_HOST: redis
    # BUG: Missing depends_on for mysql-db and redis
    # BUG: References wrong network name -- 'app-network' doesn't exist
    networks:
      - app-network

  payment-service:
    image: foodexpress/payment-service:1.0
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: production
      # BUG: DB_HOST points to localhost instead of mysql-db
      DB_HOST: localhost
      DB_PORT: 3306
    depends_on:
      - mysql-db
    networks:
      - foodexpress-net

  restaurant-service:
    image: foodexpress/restaurant-service:1.0
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql-db
      NODE_ENV: production
    depends_on:
      - mysql-db
    # BUG: Not connected to any network (missing networks section)

  mysql-db:
    image: mysql:8.0
    # BUG: Wrong volume mount path -- /data is not where MySQL stores data
    volumes:
      - mysql-data:/data
    # BUG: Missing MYSQL_ROOT_PASSWORD -- MySQL won't start
    environment:
      MYSQL_DATABASE: foodexpress
    networks:
      - foodexpress-net

  redis:
    image: redis:7-alpine
    volumes:
      # BUG: redis-data volume used but not declared in top-level volumes
      - redis-data:/data
    # BUG: No restart policy
    networks:
      - foodexpress-net

volumes:
  mysql-data:
  # BUG: redis-data not declared here

networks:
  foodexpress-net:
    driver: bridge
