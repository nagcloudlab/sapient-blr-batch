# FoodExpress NGINX Reverse Proxy Configuration
# BUG: Order Service upstream port is wrong (8080 instead of 8081)

events {
    worker_connections 1024;
}

http {
    upstream order_backend {
        # BUG: Wrong port -- Order Service listens on 8081, not 8080
        server order-service:8080;
    }

    upstream restaurant_backend {
        server restaurant-service:3000;
    }

    upstream payment_backend {
        server payment-service:8082;
    }

    server {
        listen 80;

        location /api/orders {
            proxy_pass http://order_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/restaurants {
            proxy_pass http://restaurant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payments {
            proxy_pass http://payment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
