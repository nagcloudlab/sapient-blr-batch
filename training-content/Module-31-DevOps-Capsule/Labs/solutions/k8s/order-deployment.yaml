apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foodexpress-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          # FIX: Use specific version tag
          image: registry.foodexpress.in/order-service:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # FIX: Added resource limits
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # FIX: Added liveness and readiness probes
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
