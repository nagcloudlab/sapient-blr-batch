apiVersion: v1
kind: Namespace
metadata:
  name: foodexpress-prod
  labels:
    environment: production
    team: foodexpress

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: foodexpress-quota
  namespace: foodexpress-prod
spec:
  hard:
    # FIX 1: Realistic CPU/memory limits for 6 microservices
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "8"
    limits.memory: "8Gi"
    pods: "20"

---

apiVersion: v1
kind: LimitRange
metadata:
  name: foodexpress-limits
  namespace: foodexpress-prod
spec:
  limits:
    - type: Container
      # FIX 2: default (limits) must be >= defaultRequest
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
