apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: foodexpress-prod
spec:
  # FIX 1: Selector matches pod label "app: order-service"
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 80
      # FIX 2: targetPort corrected to 8080 (matches containerPort)
      targetPort: 8080
      # FIX 3: nodePort corrected to valid range (30000-32767)
      nodePort: 30080
  type: NodePort
