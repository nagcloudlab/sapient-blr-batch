apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foodexpress-prod
  labels:
    app: order-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: foodexpress/order-service:1.2.0
          # FIX 2: Corrected container port to 8080 (matches Spring Boot default)
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: foodexpress-config
                  key: DATABASE_HOST
          # FIX 3: Added resource requests and limits
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              # FIX 1: Corrected health endpoint path to /actuator/health
              path: /actuator/health
              port: 8080
            # FIX 4: Increased initialDelaySeconds to 30 for Spring Boot startup
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
