apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: foodexpress-prod
spec:
  # BUG 1: Selector label "app: orders" does not match pod label "app: order-service"
  selector:
    app: orders
  ports:
    - protocol: TCP
      port: 80
      # BUG 2: targetPort 3000 does not match container port (should be 8080)
      targetPort: 3000
      # BUG 3: nodePort 29000 is outside the valid range (30000-32767)
      nodePort: 29000
  type: NodePort
