apiVersion: v1
kind: Namespace
metadata:
  name: foodexpress-prod
  labels:
    environment: production
    team: foodexpress

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: foodexpress-quota
  namespace: foodexpress-prod
spec:
  hard:
    # BUG 1: CPU limit of 100m is far too low for 6 microservices
    # 6 services x 250m minimum = 1500m needed; 100m blocks all scheduling
    requests.cpu: "100m"
    requests.memory: "128Mi"
    limits.cpu: "200m"
    limits.memory: "256Mi"
    pods: "20"

---

apiVersion: v1
kind: LimitRange
metadata:
  name: foodexpress-limits
  namespace: foodexpress-prod
spec:
  limits:
    - type: Container
      # BUG 2: default (limits) is LOWER than defaultRequest -- this is invalid
      # Limits must be >= requests; K8s will reject pod creation
      default:
        cpu: "100m"
        memory: "128Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
