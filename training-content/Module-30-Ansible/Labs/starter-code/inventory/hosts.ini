[webservers]
web1.foodexpress.in
web2.foodexpress.in

[appservers]
app1.foodexpress.in ansible_ssh_user=deploy
# BUG 1: db1 is a database host, not an app server -- wrong group
db1.foodexpress.in ansible_ssh_user=deploy

[dbservers]
# BUG 1: app2 is an app server, not a database server -- wrong group
app2.foodexpress.in ansible_ssh_user=dbadmin
# BUG 2: ansible_ssh_user is 'root' but root SSH is disabled; should be 'deploy'
db2.foodexpress.in ansible_ssh_user=root

[foodexpress:children]
webservers
appservers
dbservers

[webservers:vars]
nginx_port=80
server_name=foodexpress.in

[appservers:vars]
app_port=8080

[dbservers:vars]
mysql_port=3306
