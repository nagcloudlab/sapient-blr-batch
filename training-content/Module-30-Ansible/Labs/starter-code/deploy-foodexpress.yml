---
# deploy-foodexpress.yml
# BUG 2: Missing 'become: yes' -- tasks requiring sudo will fail with Permission denied
- name: Deploy FoodExpress Application
  hosts: appservers

  vars:
    app_version: "1.2.0"
    app_port: 8080
    java_package: "openjdk-17-jdk"
    deploy_dir: /opt/foodexpress

  tasks:
    - name: Install Java 17
      # BUG 1: Module name 'atp' is misspelled -- should be 'apt'
      atp:
        name: "{{ java_package }}"
        state: present
        update_cache: yes

    - name: Create application directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: foodexpress
        group: foodexpress
        mode: '0755'

    - name: Copy application JAR
      copy:
        src: "foodexpress-order-service-{{ app_version }}.jar"
        dest: "{{ deploy_dir }}/order-service.jar"
        owner: foodexpress
        group: foodexpress
        mode: '0644'

    - name: Deploy systemd service file
      template:
        src: templates/foodexpress.service.j2
        # BUG 3: Using shell syntax $app_port instead of Jinja2 {{ app_port }}
        dest: /etc/systemd/system/foodexpress-order.service
      vars:
        service_port: $app_port
      # BUG 4: Handler name 'Restart FoodExpress' does not match 'restart foodexpress'
      notify: Restart FoodExpress

    - name: Ensure FoodExpress service is running
      service:
        name: foodexpress-order
        state: started
        enabled: yes

  handlers:
    - name: restart foodexpress
      service:
        name: foodexpress-order
        state: restarted
        daemon_reload: yes
