[webservers]
web1.foodexpress.in
web2.foodexpress.in

[appservers]
app1.foodexpress.in ansible_ssh_user=deploy
# FIX 1: Moved app2 to appservers (was incorrectly in dbservers)
app2.foodexpress.in ansible_ssh_user=deploy

[dbservers]
# FIX 1: Moved db1 to dbservers (was incorrectly in appservers)
db1.foodexpress.in ansible_ssh_user=dbadmin
# FIX 2: Changed ansible_ssh_user from 'root' to 'dbadmin'
db2.foodexpress.in ansible_ssh_user=dbadmin

[foodexpress:children]
webservers
appservers
dbservers

[webservers:vars]
nginx_port=80
server_name=foodexpress.in

[appservers:vars]
app_port=8080

[dbservers:vars]
mysql_port=3306
