# FoodExpress Docker Compose Configuration
#
# CONTAINS BUGS - Find and fix them!
#
# BUG 1: Services can't communicate - wrong network configuration
#         (services are on different networks that can't reach each other)
# BUG 2: Missing health checks - no way to know if services are actually ready

version: '3.8'

services:
  # API Gateway
  api-gateway:
    image: foodexpress/api-gateway:latest
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    # BUG 1: Gateway is on 'frontend' network but backend services
    # are on 'backend' network. They cannot communicate!
    networks:
      - frontend
    depends_on:
      - restaurant-service
      - order-service

  # Restaurant Service
  restaurant-service:
    image: foodexpress/restaurant-service:latest
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=restaurant-db
      - DB_PORT=3306
    # BUG 1: On 'backend' network, can't reach gateway on 'frontend'
    networks:
      - backend
    depends_on:
      - restaurant-db
    # BUG 2: No health check!
    # Without healthcheck, depends_on only waits for container start,
    # not for the application to be ready.

  # Order Service
  order-service:
    image: foodexpress/order-service:latest
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=order-db
      - DB_PORT=3306
      - RESTAURANT_SERVICE_URL=http://restaurant-service:8081
    networks:
      - backend
    depends_on:
      - order-db
    # BUG 2: No health check!

  # Restaurant Database
  restaurant-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=restaurants
      - MYSQL_USER=foodexpress
      - MYSQL_PASSWORD=secret123
    volumes:
      - restaurant-data:/var/lib/mysql
    networks:
      - backend
    # BUG 2: No health check for database!
    # Services depend on this but don't know when MySQL is ready.

  # Order Database
  order-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=orders
      - MYSQL_USER=foodexpress
      - MYSQL_PASSWORD=secret123
    volumes:
      - order-data:/var/lib/mysql
    networks:
      - backend
    # BUG 2: No health check for database!

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend

# BUG 1: Two separate networks prevent inter-service communication
# The gateway needs to reach backend services, but they're on different networks.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  restaurant-data:
  order-data:
