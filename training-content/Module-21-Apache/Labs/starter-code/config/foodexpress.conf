# FoodExpress Apache Virtual Host Configuration
#
# CONTAINS BUGS - Find and fix them!
#
# BUG 1: VirtualHost port mismatch - listening on 80 but VirtualHost says *:8080
# BUG 2: Wrong DocumentRoot - directory path doesn't match actual deployment
# BUG 3: ProxyPass uses wrong backend port - app runs on 8080, not 3000

# Apache listens on port 80
Listen 80

# BUG 1: VirtualHost says *:8080 but Apache listens on port 80
# This means the VirtualHost will never match incoming requests on port 80
<VirtualHost *:8080>
    ServerName foodexpress.local
    ServerAlias www.foodexpress.local
    ServerAdmin admin@foodexpress.local

    # BUG 2: Wrong DocumentRoot path
    # The actual web files are in /var/www/foodexpress/public
    # but this points to /var/www/html/foodexpress (doesn't exist)
    DocumentRoot /var/www/html/foodexpress

    <Directory /var/www/html/foodexpress>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # BUG 3: ProxyPass to wrong port
    # The Java backend runs on port 8080, not port 3000
    # Port 3000 is typically for Node.js, but FoodExpress backend is Java/Spring
    ProxyPreserveHost On
    ProxyPass /api http://localhost:3000/api
    ProxyPassReverse /api http://localhost:3000/api

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/foodexpress-error.log
    CustomLog ${APACHE_LOG_DIR}/foodexpress-access.log combined

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>

    # Cache static assets
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>
</VirtualHost>
