global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'order-service'
    # FIX 3: Corrected metrics_path to Spring Boot Actuator endpoint
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-service:8080']
    scrape_interval: 10s

  - job_name: 'payment-service'
    metrics_path: /actuator/prometheus
    static_configs:
      # FIX 1: Corrected target from localhost:9090 to payment-service:8080
      - targets: ['payment-service:8080']
    scrape_interval: 10s

  # FIX 2: Added missing menu-service scrape configuration
  - job_name: 'menu-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['menu-service:8080']
    scrape_interval: 10s
