# FoodExpress ServiceNow Email Notification Configuration -- FIXED VERSION

notifications:

  # Fix 1: Subject line populated with meaningful content
  # Fix 2: Variables use correct ${} syntax
  # Fix 3: Recipients include assignment group and management
  - name: "P1 Incident Created"
    table: incident
    event: incident.created
    condition: "priority = 1"
    subject: "[P1 CRITICAL] ${number}: ${short_description}"
    body: |
      A Priority 1 incident has been created.

      Number: ${number}
      Description: ${short_description}
      Affected Service: ${cmdb_ci}
      Assignment Group: ${assignment_group}
      Created: ${sys_created_on}

      Please investigate immediately.

      [View Incident: ${instance_url}/incident.do?sys_id=${sys_id}]
    recipients:
      users:
        - "${assigned_to}"
      groups:
        - "${assignment_group}"
        - "VP Engineering"
        - "On-Call Management"
      additional_emails:
        - "oncall@foodexpress.in"

  # Fix 4: Condition fires for all priorities (removed priority = 5 filter)
  - name: "SLA Breach Warning"
    table: incident
    event: sla.breached
    condition: "active = true"
    subject: "[SLA BREACH] ${number}: ${short_description}"
    body: |
      SLA has been breached for the following incident:

      Number: ${number}
      Priority: ${priority}
      SLA Elapsed: ${sla_elapsed}
      Assignment Group: ${assignment_group}

      Immediate action required.
    recipients:
      users: []
      groups:
        - "${assignment_group}"
        - "management"

  # Fix 5: Sent to approvers (CAB members), not the requester
  - name: "Change Approval Required"
    table: change_request
    event: change.approval.requested
    condition: "type = Normal"
    subject: "[APPROVAL] ${number}: ${short_description}"
    body: |
      A change request requires your approval.

      Number: ${number}
      Description: ${short_description}
      Risk: ${risk}
      Implementation Date: ${start_date}
      Requested By: ${requested_by}

      [Approve] [Reject]
    recipients:
      users:
        - "${approver}"
      groups:
        - "Change Advisory Board"

  # Fix 6: Reply action adds work notes (not delete incident)
  - name: "Incident Update Notification"
    table: incident
    event: incident.updated
    condition: "state changes"
    subject: "[UPDATE] ${number}: ${short_description}"
    body: |
      Incident ${number} has been updated.

      New State: ${state}
      Work Notes: ${work_notes}
      Updated By: ${sys_updated_by}
    recipients:
      users:
        - "${caller_id}"
      groups:
        - "${assignment_group}"
    reply_action: "Add to work notes"
