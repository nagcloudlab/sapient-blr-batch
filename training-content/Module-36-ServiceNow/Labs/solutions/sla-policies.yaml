# FoodExpress ServiceNow SLA Policy Configuration -- FIXED VERSION

sla_definitions:

  # Fix 1: Start condition checks Priority = 1 (P1)
  # Fix 2: Duration is 4 hours
  # Fix 7: Name correctly identifies this as P1 Incident Resolution SLA
  - name: "P1 Critical Incident Resolution SLA"
    table: incident
    duration: 4h
    schedule: "24x7"
    start_condition:
      field: priority
      operator: equals
      value: 1
    # Fix 3: Stop condition triggers on "Resolved"
    stop_condition:
      field: state
      operator: in
      value: "Resolved,Closed"
    # Fix 4: Pauses during "Pending" (waiting for customer)
    pause_condition:
      field: state
      operator: equals
      value: "Pending"
    # Fix 6: Notifications at 50%, 75%, and 100%
    notifications:
      - percentage: 50
        action: "Send warning to assignment group"
      - percentage: 75
        action: "Send escalation to assignment group manager and VP Engineering"
      - percentage: 100
        action: "Send breach notification to VP Engineering and Service Owner"

  - name: "P2 High Priority SLA"
    table: incident
    duration: 8h
    # Fix 5: P2 uses 24x7 schedule (critical service)
    schedule: "24x7"
    start_condition:
      field: priority
      operator: equals
      value: 2
    stop_condition:
      field: state
      operator: in
      value: "Resolved,Closed"
    pause_condition:
      field: state
      operator: equals
      value: "Pending"
    notifications:
      - percentage: 50
        action: "Send warning to assignment group"
      - percentage: 75
        action: "Send warning to assignment group manager"
      - percentage: 100
        action: "Send breach notification to VP Engineering"

  - name: "P3 Medium Priority SLA"
    table: incident
    duration: 24h
    schedule: "Business Hours (Mon-Fri 09:00-17:00)"
    start_condition:
      field: priority
      operator: equals
      value: 3
    stop_condition:
      field: state
      operator: in
      value: "Resolved,Closed"
    pause_condition:
      field: state
      operator: equals
      value: "Pending"
    notifications:
      - percentage: 75
        action: "Send warning to assignment group"
      - percentage: 100
        action: "Send breach notification to manager"
