# FoodExpress AI Trust and Usage Guidelines
# THIS FILE CONTAINS 5 BUGS -- Find and fix them all!

ai_trust_levels:

  # Bug 1: Security code should be LOW trust, not HIGH
  security_code:
    trust_level: "High"
    review_required: false
    description: "AI-generated security code can be used directly"

  # Bug 2: Test generation should be HIGH trust, not LOW
  test_generation:
    trust_level: "Low"
    review_required: true
    description: "AI-generated tests should not be used"

  boilerplate_code:
    trust_level: "High"
    review_required: false
    description: "CRUD endpoints, models, DTOs -- safe to use after quick review"

  business_logic:
    trust_level: "Medium"
    review_required: true
    description: "Always verify business rules against requirements"

  documentation:
    trust_level: "High"
    review_required: false
    description: "API docs, README files, comments -- generally safe"

# Bug 3: AI code should REQUIRE review before production deploy
deployment_policy:
  ai_generated_code:
    production_deploy_without_review: true
    staging_deploy_without_review: true
    description: "AI code can go straight to production"

# Bug 4: Should restrict PII and sensitive data
data_sharing_policy:
  allowed_data: "All data can be shared with external AI models"
  pii_handling: "No restrictions"
  api_keys: "Can include in prompts if needed"

# Bug 5: Hallucination handling should require verification
hallucination_policy:
  detection: "If AI output looks correct, trust it"
  verification: "Not required"
  action_on_doubt: "Proceed anyway"
