# FoodExpress ITSM Process Flow Configuration -- FIXED VERSION

service_categories:
  - name: Application
    subcategories:
      - Order
      - Menu
      - Delivery
      - Notification
      - Payment            # Fix 1: Moved Payment from Infrastructure to Application
  - name: Infrastructure
    subcategories:
      - Network
      - Server
      - Database
      - Storage

# Fix 2: high_high is now P1 (was P3)
priority_matrix:
  high_high: P1
  high_medium: P2
  high_low: P3
  medium_high: P2
  medium_medium: P3
  medium_low: P4
  low_high: P3
  low_medium: P4
  low_low: P5

# Fix 3: P1 escalation is now 15 minutes (was 24 hours)
escalation_timers:
  P1:
    first_escalation: 15m
    management_notification: 30m
  P2:
    first_escalation: 4h
    management_notification: 8h
  P3:
    first_escalation: 8h
    management_notification: 24h

# Fix 4: P1 resolution is 4h, P5 resolution is 120h (were swapped)
sla_targets:
  P1:
    response_time: 15m
    resolution_time: 4h
  P2:
    response_time: 30m
    resolution_time: 8h
  P3:
    response_time: 2h
    resolution_time: 24h
  P4:
    response_time: 4h
    resolution_time: 48h
  P5:
    response_time: 1d
    resolution_time: 120h

# Fix 5: P1 now uses pagerduty, phone, slack, AND email
notification_rules:
  P1:
    channels:
      - pagerduty
      - phone
      - slack
      - email
    frequency: every_15m
  P2:
    channels:
      - email
      - slack
    frequency: every_2h
  P3:
    channels:
      - email
    frequency: every_8h
