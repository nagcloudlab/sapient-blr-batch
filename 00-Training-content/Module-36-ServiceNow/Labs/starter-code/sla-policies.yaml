# FoodExpress ServiceNow SLA Policy Configuration
# THIS FILE CONTAINS 7 BUGS -- Find and fix them all!

sla_definitions:

  # Bug 1: Start condition checks Priority = 5 (should be 1 for P1)
  # Bug 2: Duration is 240 hours (should be 4 hours for P1)
  # Bug 7: Name says "Email Service SLA" (should be incident-related)
  - name: "Email Service SLA"
    table: incident
    duration: 240h
    schedule: "24x7"
    start_condition:
      field: priority
      operator: equals
      value: 5
    # Bug 3: Stop condition triggers on "New" (should be "Resolved" or "Closed")
    stop_condition:
      field: state
      operator: equals
      value: "New"
    # Bug 4: Pauses during "In Progress" (should pause during "Pending")
    pause_condition:
      field: state
      operator: equals
      value: "In Progress"
    # Bug 6: Notification only at 100% (should warn at 50% and 75%)
    notifications:
      - percentage: 100
        action: "Send email to assignment group"

  - name: "P2 High Priority SLA"
    table: incident
    duration: 8h
    # Bug 5: P2 should use 24x7, not Business Hours
    schedule: "Business Hours (Mon-Fri 09:00-17:00)"
    start_condition:
      field: priority
      operator: equals
      value: 2
    stop_condition:
      field: state
      operator: equals
      value: "Resolved"
    pause_condition:
      field: state
      operator: equals
      value: "Pending"
    notifications:
      - percentage: 50
        action: "Send warning to assignment group"
      - percentage: 75
        action: "Send warning to assignment group manager"
      - percentage: 100
        action: "Send breach notification to VP Engineering"

  - name: "P3 Medium Priority SLA"
    table: incident
    duration: 24h
    schedule: "Business Hours (Mon-Fri 09:00-17:00)"
    start_condition:
      field: priority
      operator: equals
      value: 3
    stop_condition:
      field: state
      operator: equals
      value: "Resolved"
    pause_condition:
      field: state
      operator: equals
      value: "Pending"
    notifications:
      - percentage: 75
        action: "Send warning to assignment group"
      - percentage: 100
        action: "Send breach notification to manager"
