# FoodExpress ServiceNow Instance Configuration -- FIXED VERSION

instance:
  name: "foodexpress-prod"
  url: "https://foodexpress.service-now.com"

  # Fix 1: Strong password (in practice, use SSO/MFA, not local auth)
  admin:
    username: "admin"
    password: "USE_SSO_AND_MFA -- local password stored in CyberArk vault"
    authentication: "SSO via Okta + MFA required"

  security:
    # Fix 2: ACLs enabled for proper access control
    acl_enabled: true
    # Fix 3: Session timeout set to 30 minutes
    session_timeout_minutes: 30
    password_policy:
      min_length: 12
      require_uppercase: true
      require_number: true
      require_special_char: true
      max_age_days: 90

  # Fix 4: Named update set (not "Default")
  development:
    current_update_set: "FE-2026-09-foodexpress-itsm-config"
    update_set_naming: "FE-YYYY-MM-description"

  cmdb:
    # Fix 5: Correct data center IP range
    auto_discovery:
      enabled: true
      ip_ranges:
        - "10.0.0.0/16"          # Data center primary subnet
        - "10.1.0.0/16"          # Data center secondary subnet
      excluded_ranges:
        - "10.0.255.0/24"        # Management network (excluded)
      schedule: "Daily 02:00 IST"

  integrations:
    # Fix 6: Credentials reference secrets manager, not plain text
    pagerduty:
      api_key: "${vault:pagerduty/api_key}"
      integration_url: "https://events.pagerduty.com/v2/enqueue"
    prometheus:
      url: "http://prometheus.foodexpress.internal:9090"
      api_token: "${vault:prometheus/api_token}"
    slack:
      webhook_url: "${vault:slack/webhook_url}"
      bot_token: "${vault:slack/bot_token}"
    note: "All secrets managed via CyberArk/HashiCorp Vault. Never store credentials in config files."

  email:
    inbound:
      enabled: true
      address: "support@foodexpress.service-now.com"
    outbound:
      enabled: true
      smtp_server: "smtp.service-now.com"
      from_address: "noreply@foodexpress.service-now.com"
