apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foodexpress-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          # BUG: Using latest tag
          image: registry.foodexpress.in/order-service:latest
          ports:
            - containerPort: 8080
          # BUG: No resource limits
          # BUG: No probes
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
