# FoodExpress SSL Configuration (FIXED)
#
# ALL BUGS FIXED:
# FIX 1: Certificate path corrected to current valid cert (foodexpress.pem)
# FIX 2: Key file reference corrected to .pem extension

Listen 443

<VirtualHost *:443>
    ServerName foodexpress.local
    ServerAlias www.foodexpress.local

    DocumentRoot /var/www/foodexpress/public

    # Enable SSL
    SSLEngine on

    # FIX 1: Corrected to current valid certificate
    SSLCertificateFile /etc/ssl/certs/foodexpress.pem

    # FIX 2: Corrected key file extension to .pem
    SSLCertificateKeyFile /etc/ssl/private/foodexpress.pem

    # Certificate chain (intermediate CA)
    SSLCertificateChainFile /etc/ssl/certs/ca-chain.pem

    # SSL Protocol - disable old versions
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Strong cipher suite
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

    SSLHonorCipherOrder on

    # HSTS - force HTTPS for 1 year
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # OCSP Stapling
    SSLUseStapling on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    # Proxy to backend
    ProxyPreserveHost On
    ProxyPass /api http://localhost:8080/api
    ProxyPassReverse /api http://localhost:8080/api

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/foodexpress-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/foodexpress-ssl-access.log combined
</VirtualHost>

# OCSP Stapling Cache
SSLStaplingCache shmcb:/var/run/ocsp(128000)
