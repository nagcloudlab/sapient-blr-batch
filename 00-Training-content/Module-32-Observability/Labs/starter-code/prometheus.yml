global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'order-service'
    # BUG 3: metrics_path is '/metrics' but Spring Boot Actuator uses '/actuator/prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['order-service:8080']
    scrape_interval: 10s

  - job_name: 'payment-service'
    metrics_path: /actuator/prometheus
    static_configs:
      # BUG 1: Target points to localhost:9090 (Prometheus itself) instead of payment-service:8080
      - targets: ['localhost:9090']
    scrape_interval: 10s

  # BUG 2: menu-service scrape config is completely missing
  # No job_name entry for menu-service
