# FoodExpress Incident Record Template
# THIS FILE CONTAINS 7 BUGS -- Find and fix them all!

incident:
  number: INC-2026-0460
  title: "Order Service returning HTTP 500 errors"
  description: "Multiple customers reporting order failures since 14:00"

  # Bug 1: Impact=High, Urgency=High should be P1, not P4
  impact: High
  urgency: High
  priority: P4

  # Bug 2: Category path is backwards (should be Application > Order > API)
  category: "Infrastructure > Application > Order"

  # Bug 3: P1 response time should be 15 minutes, not 24 hours
  sla:
    response_time: "24 hours"
    resolution_time: "4 hours"

  # Bug 4: Should be assigned to "Platform Engineering" not "Marketing Team"
  assignment:
    group: "Marketing Team"
    assigned_to: "Unassigned"

  # Bug 5: Status should flow: New > In Progress > Resolved > Closed
  status_flow:
    - "New"
    - "Closed"

  # Bug 6: Related CI should be "order-service" not "email-server"
  related_ci: "email-server"

  affected_service: "Order Platform"
  affected_users: "~2,000 customers"

  # Bug 7: No communication plan defined
  communication:
    stakeholder_notifications: []
    status_page_update: false
    customer_message: ""

  timeline:
    - time: "14:00"
      event: "First customer complaint received"
    - time: "14:05"
      event: "Prometheus alert fired: HighErrorRate on order-service"
    - time: "14:10"
      event: "On-call engineer investigating"
