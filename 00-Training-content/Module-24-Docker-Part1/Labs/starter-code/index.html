<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress - Delicious Food, Delivered Fast</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f5f5f5; }
        .header { background: #e84c3d; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 2.5em; }
        .content { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; padding: 30px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .cta { background: #27ae60; color: white; border: none; padding: 15px 40px; font-size: 1.2em; border-radius: 5px; cursor: pointer; }
        .footer { background: #2c3e50; color: white; text-align: center; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FoodExpress</h1>
        <p>Delicious Food, Delivered Fast</p>
    </div>
    <div class="content">
        <div class="card">
            <h2>Order from 500+ restaurants</h2>
            <p>Your favorite meals from the best local restaurants, delivered to your door in 30 minutes or less.</p>
            <button class="cta">Order Now</button>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2026 FoodExpress. Running in Docker.</p>
    </div>
</body>
</html>
