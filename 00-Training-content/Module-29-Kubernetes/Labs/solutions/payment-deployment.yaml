apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: foodexpress-prod
  labels:
    app: payment-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          # FIX 1: Use specific version tag and proper imagePullPolicy
          image: foodexpress/payment-service:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # FIX 3: Reference Secret instead of hardcoding password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodexpress-secrets
                  key: DB_PASSWORD
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: foodexpress-config
                  key: DATABASE_HOST
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          # FIX 2: Added readiness probe
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
