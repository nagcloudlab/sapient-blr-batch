# Canary Phase 4: Full rollout - 100% to v2
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: sample-app
spec:
  hosts:
    - "*"
  gateways:
    - app-gateway
  http:
    - route:
        - destination:
            host: sample-app
            subset: v1
            port:
              number: 80
          weight: 0
        - destination:
            host: sample-app
            subset: v2
            port:
              number: 80
          weight: 100
