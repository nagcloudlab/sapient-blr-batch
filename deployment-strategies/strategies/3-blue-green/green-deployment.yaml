apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-green
  labels:
    app: sample-app
    slot: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
      slot: green
  template:
    metadata:
      labels:
        app: sample-app
        slot: green
        version: v2
    spec:
      containers:
        - name: sample-app
          image: sample-app:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-green
spec:
  selector:
    app: sample-app
    slot: green
  ports:
    - port: 80
      targetPort: 8080
