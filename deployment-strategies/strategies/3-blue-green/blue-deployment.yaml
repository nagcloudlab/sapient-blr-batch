apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-blue
  labels:
    app: sample-app
    slot: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
      slot: blue
  template:
    metadata:
      labels:
        app: sample-app
        slot: blue
        version: v1
    spec:
      containers:
        - name: sample-app
          image: sample-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-blue
spec:
  selector:
    app: sample-app
    slot: blue
  ports:
    - port: 80
      targetPort: 8080
