<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITIL 4 Expert Scenarios -- Real-World Assessment</title>
<style>
:root{--primary:#1b2a4a;--primary-light:#2c3e6b;--accent:#e65100;--accent-light:#ff8f00;--success:#1b5e20;--success-bg:#e8f5e9;--error:#b71c1c;--error-bg:#ffebee;--warn-bg:#fff8e1;--bg:#eef0f2;--card:#fff;--text:#1a1a2e;--text-light:#5f6b7a;--border:#d5dbe3;--dark:#0f1923;--scenario-bg:#f4f6f8;--scenario-border:#90a4ae}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh}

.header{background:linear-gradient(135deg,var(--dark),var(--primary));color:#fff;padding:1.1rem 1.5rem;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 3px 16px rgba(0,0,0,0.3)}
.header h1{font-size:1.15rem;font-weight:700;letter-spacing:0.3px}
.header-sub{font-size:0.65rem;opacity:0.55;margin-top:0.1rem;letter-spacing:1.5px;text-transform:uppercase}
.header-row{display:flex;justify-content:center;gap:1.5rem;margin-top:0.4rem;font-size:0.8rem;opacity:0.85}
.progress-wrap{background:rgba(255,255,255,0.12);border-radius:10px;height:4px;margin-top:0.5rem;max-width:560px;margin-left:auto;margin-right:auto}
.progress-fill{background:var(--accent);height:100%;border-radius:10px;transition:width 0.4s}

.container{max-width:760px;margin:0 auto;padding:1.25rem}

/* Welcome */
.welcome{text-align:center;padding:2.5rem 2rem;background:var(--card);border-radius:14px;margin-top:1.5rem;box-shadow:0 2px 14px rgba(0,0,0,0.06)}
.welcome h2{color:var(--primary);font-size:1.55rem;margin-bottom:0.3rem}
.welcome .sub{color:var(--text-light);margin-bottom:1.5rem;font-size:0.92rem}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:0.65rem;margin:1.25rem 0}
.sg .s{background:var(--bg);padding:0.75rem;border-radius:8px}
.sg .s .n{font-size:1.5rem;font-weight:700;color:var(--primary)}
.sg .s .l{font-size:0.65rem;color:var(--text-light);text-transform:uppercase;letter-spacing:0.5px}
.dtag{display:inline-block;padding:0.15rem 0.55rem;border-radius:14px;font-size:0.6rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
.d-expert{background:#fce4ec;color:#c62828}
.d-critical{background:#f3e5f5;color:#6a1b9a}

/* Question Card */
.qcard{background:var(--card);border-radius:14px;padding:1.75rem;margin-top:1.25rem;box-shadow:0 3px 18px rgba(0,0,0,0.06);position:relative;overflow:hidden}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.qcard.d-expert::before{background:linear-gradient(90deg,#c62828,#ef5350)}
.qcard.d-critical::before{background:linear-gradient(90deg,#6a1b9a,#ab47bc)}

.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.85rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:0.4rem}
.qsec{background:#eceff1;color:var(--dark);padding:0.15rem 0.55rem;border-radius:14px;font-size:0.65rem;font-weight:600}
.qnum{color:var(--text-light);font-size:0.78rem;font-weight:600}

/* Scenario */
.scenario{background:var(--scenario-bg);border-left:4px solid var(--scenario-border);border-radius:0 10px 10px 0;padding:1rem 1.15rem;margin-bottom:1.15rem;font-size:0.88rem;color:#37474f;line-height:1.6}
.scenario .stitle{font-weight:700;color:var(--dark);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.4rem;display:flex;align-items:center;gap:0.4rem}
.scenario .stitle::before{content:'';display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%}
.scenario ul{margin:0.5rem 0 0 1.2rem;font-size:0.85rem}
.scenario li{margin-bottom:0.2rem}
.scenario .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.5rem;margin-top:0.65rem}
.scenario .metric{background:#fff;border:1px solid var(--border);border-radius:6px;padding:0.4rem 0.6rem;text-align:center}
.scenario .metric .mv{font-weight:700;color:var(--primary);font-size:0.95rem}
.scenario .metric .ml{font-size:0.6rem;color:var(--text-light);text-transform:uppercase}

.qtext{font-weight:600;font-size:1.05rem;margin-bottom:1.15rem;line-height:1.5;color:var(--text)}

/* Options */
.opts{display:flex;flex-direction:column;gap:0.45rem}
.opt{display:flex;align-items:flex-start;padding:0.8rem 1rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.2s;font-size:0.9rem}
.opt:hover:not(.dis){border-color:var(--primary-light);background:#e8eaf6;transform:translateX(3px)}
.opt .ol{width:28px;height:28px;border:2px solid #b0bec5;border-radius:50%;margin-right:0.8rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:#90a4ae;transition:all 0.2s;margin-top:1px}
.opt .ot{flex:1;line-height:1.5}
.opt .oi{font-size:1.15rem;margin-left:0.5rem;opacity:0;transition:opacity 0.25s;flex-shrink:0;margin-top:2px}
.opt.cor{border-color:var(--success)!important;background:var(--success-bg)!important;transform:none}
.opt.cor .ol{border-color:var(--success);background:var(--success);color:#fff}
.opt.cor .oi{opacity:1}
.opt.wrn{border-color:var(--error)!important;background:var(--error-bg)!important;transform:none}
.opt.wrn .ol{border-color:var(--error);background:var(--error);color:#fff}
.opt.wrn .oi{opacity:1}
.opt.dis{pointer-events:none;cursor:default}
.opt.dis:not(.cor):not(.wrn){opacity:0.4}

/* Explanation */
.exp{margin-top:1rem;padding:1rem 1.1rem;border-radius:10px;font-size:0.86rem;line-height:1.6;animation:su 0.3s ease}
.exp.ce{background:var(--success-bg);border-left:4px solid var(--success);color:#1b5e20}
.exp.we{background:var(--warn-bg);border-left:4px solid var(--accent);color:#bf360c}
.exp strong{display:block;margin-bottom:0.15rem;font-size:0.9rem}
.exp .practices{margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.3rem}
.exp .ptag{background:rgba(0,0,0,0.06);padding:0.15rem 0.5rem;border-radius:10px;font-size:0.7rem;font-weight:600;color:var(--primary)}
@keyframes su{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.15rem;gap:0.6rem}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:all 0.2s}
.dot:hover{border-color:var(--primary);transform:scale(1.3)}
.dot.cur{border-color:var(--primary);background:var(--primary);transform:scale(1.3)}
.dot.ac{border-color:var(--success);background:var(--success)}
.dot.aw{border-color:var(--error);background:var(--error)}

/* Buttons */
.btn{padding:0.6rem 1.4rem;border:none;border-radius:8px;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:0.35rem;white-space:nowrap}
.bp{background:var(--primary);color:#fff}.bp:hover{background:var(--primary-light);transform:translateY(-1px);box-shadow:0 4px 12px rgba(27,42,74,0.3)}
.ba{background:var(--accent);color:#fff}.ba:hover{background:#bf360c}
.bo{background:transparent;border:2px solid var(--primary);color:var(--primary)}.bo:hover{background:var(--primary);color:#fff}
.bg{background:transparent;color:var(--text-light);border:2px solid var(--border)}.bg:hover{border-color:var(--primary);color:var(--primary)}
.btn:disabled{opacity:0.3;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.bc{display:flex;gap:0.75rem;justify-content:center;margin-top:1.25rem;flex-wrap:wrap}

/* Results */
.res{background:var(--card);border-radius:14px;padding:2.25rem;margin-top:1.5rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.res h2{color:var(--primary);margin-bottom:0.35rem}
.sc{width:140px;height:140px;border-radius:50%;margin:1.15rem auto;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.sc .p{font-size:2.2rem;font-weight:800;line-height:1}.sc .ps{font-size:0.85rem}.sc .lb{font-size:0.65rem;opacity:0.85;margin-top:0.15rem}
.ge{background:linear-gradient(135deg,#1b5e20,#43a047)}.gg{background:linear-gradient(135deg,#1565c0,#1e88e5)}.ga{background:linear-gradient(135deg,#e65100,#fb8c00)}.gp{background:linear-gradient(135deg,#c62828,#e53935)}
.ss{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0.65rem;margin:1rem 0;text-align:left}
.ssc{background:var(--bg);padding:0.75rem;border-radius:8px;border-left:4px solid var(--primary)}
.ssc h4{font-size:0.7rem;color:var(--text-light);margin-bottom:0.25rem}
.ssc .sv{font-size:1.1rem;font-weight:700;color:var(--primary)}
.ssc .bb{height:4px;background:var(--border);border-radius:2px;margin-top:0.35rem}
.ssc .bf{height:100%;border-radius:2px;transition:width 0.8s}

.timer{font-weight:600;font-variant-numeric:tabular-nums}
.timer.tw{color:#ffab00}.timer.td{color:#ff1744;animation:pu 1s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:0.5}}
@media(max-width:600px){.header h1{font-size:0.95rem}.container{padding:0.75rem}.qcard{padding:1.15rem}.qtext{font-size:0.95rem}.opt{padding:0.65rem 0.8rem;font-size:0.85rem}.welcome{padding:1.5rem 1rem}.res{padding:1.5rem}.nav{flex-direction:column}.dot{width:8px;height:8px}}
.fi{animation:fi 0.3s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="header">
<h1>ITIL 4 Expert Scenarios -- Real-World Assessment</h1>
<div class="header-sub">Industry Incidents, Outages & Transformations</div>
<div class="header-row"><span id="hs">--</span><span id="hp">--/--</span><span class="timer" id="ht">--:--</span></div>
<div class="progress-wrap"><div class="progress-fill" id="pb"></div></div>
</div>
<div class="container" id="app"></div>
<script>
const S=[
{id:"major-incidents",title:"Major Incident & Crisis Management",difficulty:"expert",questions:[
{scenario:'<div class="stitle">AWS us-east-1 Outage -- Real Event Pattern</div>Your organization runs its entire customer-facing platform on a single AWS region (us-east-1). At 10:47 AM, AWS reports degraded API connectivity. Your monitoring shows:<div class="metrics"><div class="metric"><div class="mv">0%</div><div class="ml">API Success Rate</div></div><div class="metric"><div class="mv">45,000</div><div class="ml">Users Affected</div></div><div class="metric"><div class="mv">$12K/hr</div><div class="ml">Revenue Loss</div></div><div class="metric"><div class="mv">P1</div><div class="ml">Severity</div></div></div>The incident commander declares a Major Incident. 90 minutes in, AWS has no ETA for resolution.',
q:"What is the correct ITIL-aligned Major Incident Management response at the 90-minute mark?",options:["Wait for AWS to fix it -- it's their infrastructure","Activate the Business Continuity plan: fail over to DR region, invoke Supplier Management to escalate with AWS, communicate status to all stakeholders via established communication plan, and begin post-incident Problem Management prep","Switch to a different cloud provider immediately","Close the incident since it's a third-party issue"],answer:1,explanation:"Multiple practices activate simultaneously: Service Continuity Management (DR failover), Supplier Management (escalate with AWS per contract), Incident Management (major incident process with commander), and Relationship Management (stakeholder communications). Waiting is not acceptable when revenue is impacted.",tags:["Incident Mgmt","Service Continuity","Supplier Mgmt","Relationship Mgmt"]},

{scenario:'<div class="stitle">Cascading Failure -- Microservices Chain</div>Your e-commerce platform uses microservices. The Payment Service goes down at 2:15 PM. Within 8 minutes, the cascading failure hits:<ul><li>2:15 PM -- Payment Service DOWN (circuit breaker fails open)</li><li>2:17 PM -- Cart Service starts timing out (depends on Payment)</li><li>2:19 PM -- Product Service degrades (shared database connection pool with Cart)</li><li>2:23 PM -- Frontend returns 503 for all users</li></ul>The NOC opened 4 separate P1 incidents, one per service.',
q:"What is wrong with the NOC's approach, and what should they do instead?",options:["The approach is correct -- each service needs its own incident","Open a single Parent/Major Incident for the cascading failure, create child incidents per service. Use the CMDB dependency map to identify the root service (Payment). Focus resolution on the root cause, not the symptoms. The 4 separate P1s cause confusion, duplicated effort, and conflicting priorities.","Ignore the downstream services and only fix Payment","Escalate all 4 incidents to the CTO simultaneously"],answer:1,explanation:"Cascading failures require a Major Incident with child incidents. The CMDB dependency map (Service Configuration Management) reveals Payment is the root. Fixing Payment resolves the cascade. 4 separate P1s with different assignment groups creates chaos -- nobody sees the full picture.",tags:["Incident Mgmt","CMDB","Problem Mgmt","Monitoring & Event Mgmt"]},

{scenario:'<div class="stitle">Ransomware Attack -- Hospital IT</div>At 3 AM, a hospital\'s IT monitoring detects unusual encryption activity on file servers. By 3:30 AM, 40% of clinical workstations display a ransom note. Affected systems:<ul><li>Electronic Health Records (EHR) -- partially encrypted</li><li>Lab Results system -- inaccessible</li><li>Pharmacy ordering system -- down</li><li>Patient monitoring (bedside) -- UNAFFECTED (separate network)</li></ul>The hospital has 200 patients currently admitted. Paper-based fallback procedures exist but haven\'t been tested in 2 years.',
q:"Which ITIL practices must activate SIMULTANEOUSLY in the first 60 minutes?",options:["Only Incident Management and Information Security Management","Incident Management (restore critical services), Information Security Management (contain the attack, forensics), Service Continuity Management (activate paper-based fallback), Supplier Management (contact security vendor/insurer), Relationship Management (notify regulators, patients), and Knowledge Management (check if playbook exists for ransomware)","Only call law enforcement and wait","Problem Management to find root cause first, then fix"],answer:1,explanation:"This is a crisis requiring 6+ practices simultaneously. You can't wait for root cause (that's Problem Management AFTER containment). Patient safety demands immediate Service Continuity activation. Information Security contains the spread. Regulatory notification (Relationship Management) may be legally required within hours. This is the reality of multi-practice integration.",tags:["Incident Mgmt","Info Security Mgmt","Service Continuity","Supplier Mgmt","Relationship Mgmt","Knowledge Mgmt"]},

{scenario:'<div class="stitle">Black Friday Load Failure</div>An online retailer prepared for Black Friday by scaling to 3x normal capacity. Actual traffic hit 7x at 9:01 AM. The site went down within 4 minutes. Post-mortem reveals:<ul><li>Capacity planning used last year\'s data (3x) without accounting for a viral marketing campaign</li><li>Auto-scaling was configured but had a 15-minute cooldown (too slow)</li><li>No load testing was done above 4x capacity</li><li>The CDN provider had a rate limit that was hit at 5x</li></ul><div class="metrics"><div class="metric"><div class="mv">$2.3M</div><div class="ml">Revenue Lost (4hrs)</div></div><div class="metric"><div class="mv">7x</div><div class="ml">Actual vs Planned</div></div><div class="metric"><div class="mv">89%</div><div class="ml">Cart Abandonment</div></div></div>',
q:"Which ITIL practices failed BEFORE the incident, and what should the post-incident review recommend?",options:["Only Capacity Management failed","Multiple practices failed: Capacity & Performance Management (wrong projections), Service Validation & Testing (no load test above 4x), Supplier Management (CDN rate limit unknown), Relationship Management (marketing campaign not communicated to IT). Recommend: integrated capacity planning with business teams, load testing at 10x minimum, supplier capacity review, and mandatory cross-team communication for marketing events.","The incident was unforeseeable -- no changes needed","Only the CDN provider is at fault"],answer:1,explanation:"This is a failure of holistic thinking (principle 5). Four practices failed before the incident even happened. The root cause isn't technical -- it's organizational: marketing and IT didn't communicate. The CDN limit was a known constraint that nobody checked. Post-incident review must address all four dimensions, not just technology.",tags:["Capacity & Performance Mgmt","Service Validation & Testing","Supplier Mgmt","Relationship Mgmt","Continual Improvement"]},

{scenario:'<div class="stitle">SLA Gaming -- Metrics vs Reality</div>Your IT department reports 99.9% uptime to the board. However, customer satisfaction has dropped 30% this quarter. Investigation reveals:<ul><li>SLA measures "service availability" -- defined as "at least one server responding"</li><li>During degraded performance (3 of 4 servers down), service is technically "available"</li><li>Response times during degraded state: 12 seconds (normal: 0.8 seconds)</li><li>The SLA has no performance thresholds, only availability</li><li>Monthly SLA reports show green across the board</li></ul>',
q:"What ITIL concept explains this disconnect, and how should it be fixed?",options:["The SLA is fine -- 99.9% is excellent","The SLA measures warranty (availability) but not utility (fitness for purpose). The service is 'up' but unusable. Fix: redefine SLAs using meaningful SLIs that include response time percentiles (P95 < 2s), error rates (< 0.1%), and user experience metrics -- not just server heartbeat. Apply 'Focus on value': value is what the CUSTOMER perceives, not what the dashboard shows.","Customer expectations are too high","Change the SLA to 99.5% so it's easier to meet"],answer:1,explanation:"This is a classic utility vs warranty gap. The Watermelon Effect: green on the outside (dashboard), red on the inside (user experience). Service Level Management must define SLIs that reflect real user experience. The 'Focus on value' principle demands metrics that matter to consumers, not just metrics that look good in reports.",tags:["Service Level Mgmt","Continual Improvement","Measurement & Reporting"]},
]},

{id:"transformation",title:"ITSM Transformation & Organizational Change",difficulty:"expert",questions:[
{scenario:'<div class="stitle">DevOps vs ITIL Culture Clash</div>A company\'s development team practices DevOps -- they deploy 15 times per day using CI/CD. The operations team follows strict ITIL Change Enablement -- every change needs a Change Request, risk assessment, and CAB approval. Result:<ul><li>Developers wait 3-5 days for change approval on each deploy</li><li>Developers start deploying without Change Requests ("shadow changes")</li><li>30% of production incidents are now caused by untracked changes</li><li>Operations blames developers for "cowboy deployments"</li><li>Developers blame operations for "bureaucratic gatekeeping"</li></ul>',
q:"How should this be resolved using ITIL 4 principles?",options:["Force all deploys through the full CAB process","Eliminate Change Enablement entirely for developers","Create a Standard Change model for CI/CD pipeline deploys: pre-approved, automated risk assessment via pipeline quality gates (tests pass, security scan clean, canary metrics green). The pipeline itself becomes the change control. This applies 'Optimize and automate' (automate the governance) and 'Keep it simple' (right-size the process to the risk).","Separate dev and ops into independent organizations"],answer:2,explanation:"ITIL 4 explicitly supports DevOps integration. The key is right-sizing governance to risk. Low-risk, high-frequency deploys through a tested CI/CD pipeline = Standard Change (pre-approved). The pipeline's quality gates (tests, scans, canary checks) ARE the risk assessment. High-risk deploys (database schema changes, infrastructure) still go through Normal Change. This isn't removing governance -- it's embedding it into the pipeline.",tags:["Change Enablement","Continual Improvement","Value Streams & Processes"]},

{scenario:'<div class="stitle">Mergers & Acquisitions -- IT Integration</div>Company A (2,000 employees, mature ITIL, ServiceNow) acquires Company B (500 employees, no ITSM, uses email and spreadsheets for IT support). The CIO mandates full integration within 6 months. Current state of Company B:<ul><li>No incident tracking (issues reported via email/Slack)</li><li>No change process (developers deploy directly to production)</li><li>No CMDB (nobody knows what\'s in production)</li><li>Average incident resolution: unknown (not measured)</li><li>Staff morale: high (they like their informal culture)</li></ul>',
q:"What is the ITIL 4-aligned approach to integrating Company B?",options:["Force Company B onto ServiceNow with all ITIL processes immediately","Apply 'Start where you are': assess Company B's current strengths. Apply 'Progress iteratively': Phase 1 (Month 1-2): Service Desk + basic Incident logging. Phase 2 (Month 3-4): add Change Enablement for production changes + CMDB discovery. Phase 3 (Month 5-6): SLAs, Problem Management, Knowledge. Apply 'Collaborate': involve Company B staff in designing THEIR processes, don't impose.","Let Company B continue with their current approach","Outsource Company B's IT entirely"],answer:1,explanation:"Forcing 100% ITIL on an organization with zero maturity guarantees failure and destroys morale. ITIL 4's principles guide the approach: 'Start where you are' (assess), 'Progress iteratively' (phased), 'Collaborate' (involve them), 'Keep it simple' (don't overload). Company B's informal culture has VALUE -- fast decisions, low bureaucracy. Preserve what works while adding necessary governance.",tags:["Org Change Mgmt","Continual Improvement","All 7 Guiding Principles"]},

{scenario:'<div class="stitle">Shadow IT Discovery</div>An enterprise IT audit discovers:<ul><li>47 unauthorized SaaS applications in use across departments</li><li>Marketing runs its own AWS account ($8K/month) unknown to IT</li><li>Finance uses an unapproved file-sharing service for sensitive data</li><li>HR stores employee data in a personal Google Drive</li><li>Total shadow IT spend: ~$340K/year</li></ul>The CISO wants to shut everything down immediately. Department heads say "IT is too slow, that\'s why we found our own solutions."',
q:"What is the balanced ITIL 4 response?",options:["Shut down all shadow IT immediately -- security is paramount","Block all unapproved services and discipline the departments","Apply 'Focus on value': understand WHY departments went to shadow IT (unmet needs). Apply 'Start where you are': some shadow IT may be solving real problems. Balanced approach: (1) Immediate: secure sensitive data in HR/Finance, (2) Short-term: catalog all shadow IT and assess risk vs value, (3) Medium-term: onboard valuable tools officially or provide approved alternatives, (4) Long-term: improve IT service catalog responsiveness so shadow IT isn't needed.","Shadow IT is fine -- let departments manage their own tools"],answer:2,explanation:"Shadow IT is a symptom of IT not meeting business needs fast enough. Shutting it down without alternatives causes business disruption. The ITIL 4 response: (1) Secure immediate risks (data protection), (2) Understand the demand (Engage), (3) Assess which tools provide value (Portfolio Management), (4) Improve the Service Catalog so departments don't NEED shadow IT. Multiple dimensions involved: People (culture), Technology (approved alternatives), Processes (faster service request fulfillment).",tags:["Service Catalog Mgmt","Info Security Mgmt","Portfolio Mgmt","Relationship Mgmt","Service Request Mgmt"]},

{scenario:'<div class="stitle">AI/ML Model Deployment Governance</div>A data science team wants to deploy ML models to production that make real-time decisions (fraud detection, credit scoring). Current ITIL change process treats all changes the same. Challenges:<ul><li>ML models are retrained weekly with new data -- each retrain is technically a "change"</li><li>Model behavior can drift without any code changes</li><li>Traditional testing (unit tests) doesn\'t work for ML (probabilistic outputs)</li><li>Regulatory requirement: every model decision must be explainable</li><li>Current CAB has no ML expertise</li></ul>',
q:"How should ITIL practices adapt for ML/AI governance?",options:["Treat every model retrain as a Normal Change with full CAB review","ML doesn't need governance -- data scientists know best","Create a specialized change model: model retrains are Standard Changes with automated validation gates (accuracy thresholds, bias checks, drift detection). Model architecture changes are Normal Changes with an ML-expert review board (not traditional CAB). Add monitoring for model performance drift as a new event type. Service Validation & Testing practice must include ML-specific testing (A/B testing, shadow scoring, fairness audits).","Ban ML models from production until ITIL creates official guidance"],answer:2,explanation:"ITIL 4 is technology-agnostic but principle-driven. 'Optimize and automate': automated validation gates for routine retrains. 'Keep it simple': right-size governance to risk (routine retrain vs architecture change). New capabilities needed: ML-specific monitoring (drift detection), ML-aware change review, and compliance documentation for explainability. This extends existing practices rather than creating entirely new ones.",tags:["Change Enablement","Monitoring & Event Mgmt","Service Validation & Testing","Risk Mgmt"]},

{scenario:'<div class="stitle">Zero-Trust Security Transformation</div>An organization adopts a Zero-Trust security model. This impacts virtually every IT service:<ul><li>No more implicit trust for internal network traffic</li><li>Every service-to-service call must be authenticated</li><li>User access changes from VPN-based to identity-based</li><li>250+ internal applications need modification</li><li>Expected timeline: 18 months</li><li>Impact: every team, every service, every CI in the CMDB</li></ul>',
q:"Which ITIL 4 value chain activities and practices are critical for this transformation?",options:["Only Change Enablement and Deployment Management","Only Information Security Management","All 6 value chain activities are needed. Plan (strategy and resource allocation), Engage (stakeholder buy-in from 250+ app owners), Design & Transition (architecture changes), Obtain/Build (implement per application), Deliver & Support (maintain services during transition), Improve (learn from each phase). Key practices: Information Security, Change Enablement, Service Configuration (CMDB for tracking), Organizational Change Management (people/culture), Release Management (phased rollout), and Service Validation & Testing.","This is a security project, not an ITSM concern"],answer:2,explanation:"Zero-Trust touches all four dimensions (people, technology, partners, processes) and all six value chain activities. It's not just a security project -- it's a service transformation. Organizational Change Management is critical: developers must change how they build services. The CMDB must track which apps have been migrated. Release Management coordinates the phased rollout across 250+ apps. This is a textbook case of 'Think and work holistically'.",tags:["All Value Chain Activities","Info Security Mgmt","Change Enablement","Org Change Mgmt","CMDB","Release Mgmt"]},
]},

{id:"complex-multi",title:"Complex Multi-Practice Integration",difficulty:"critical",questions:[
{scenario:'<div class="stitle">Payment System Migration -- Real Bank Scenario</div>A bank is migrating its core payment system from a 30-year-old mainframe (COBOL) to a modern cloud-native platform. The mainframe currently processes:<div class="metrics"><div class="metric"><div class="mv">2.1M</div><div class="ml">Daily Transactions</div></div><div class="metric"><div class="mv">99.997%</div><div class="ml">Current Uptime</div></div><div class="metric"><div class="mv">12ms</div><div class="ml">Avg Response Time</div></div><div class="metric"><div class="mv">$4.2B</div><div class="ml">Daily Value Processed</div></div></div>The migration must happen with zero downtime and zero data loss. Regulatory requirement: fallback to mainframe must be possible for 6 months post-migration.',
q:"Map this to ITIL 4 practices -- which practices are involved and in what sequence?",options:["Change Enablement and Deployment Management only","All three Technical Management practices only","Virtually ALL practices engage across a multi-year timeline: Strategy Management (business case), Portfolio Management (service investment), Architecture Management (target architecture), Risk Management (financial risk of $4.2B/day), Capacity & Performance Management (cloud must match 12ms latency), Service Validation & Testing (parallel-run with production traffic), Change Enablement (phased migration changes), Release Management (cutover releases), Service Continuity (6-month fallback), CMDB (dual-state CI tracking), Service Level Management (maintain 99.997%), Monitoring & Event Management (real-time comparison), Knowledge Management (new runbooks), and Organizational Change Management (retrain mainframe staff for cloud).","Only the vendor managing the new platform handles this"],answer:2,explanation:"A core banking migration is the most complex ITSM scenario possible. 14+ practices integrate over multiple years. The key insight: this isn't just a technology project. People (mainframe experts must learn cloud), processes (every operational procedure changes), suppliers (cloud vendor SLAs must match mainframe reliability), and technology (must meet or exceed current performance) -- all four dimensions, all six value chain activities.",tags:["Strategy Mgmt","Architecture Mgmt","Risk Mgmt","Capacity Mgmt","Service Validation","Change Enablement","Release Mgmt","Service Continuity","CMDB","SLM","Monitoring","Knowledge Mgmt","Org Change Mgmt","Deployment Mgmt"]},

{scenario:'<div class="stitle">Multi-Cloud Outage -- Cascading Vendor Failure</div>Your organization uses a multi-cloud strategy:<ul><li>AWS: customer-facing web application</li><li>Azure: authentication and identity (SSO)</li><li>GCP: data analytics and ML inference</li></ul>At 9:15 AM, Azure Active Directory experiences a global authentication outage. Impact on YOUR services:<ul><li>9:15 -- Users can\'t log in (Azure SSO down)</li><li>9:18 -- Internal tools become inaccessible (SSO-dependent)</li><li>9:22 -- Customer-facing app (AWS) returns 401 for all authenticated requests</li><li>9:25 -- ML inference pipeline (GCP) fails because data APIs require auth</li><li>All three clouds are individually "up" but your services are DOWN</li></ul>',
q:"What does this scenario reveal about ITIL practice gaps, and what should the organization have done?",options:["This is purely Microsoft's fault -- nothing could have been done","The CMDB didn't model cross-cloud authentication dependencies. Service Configuration Management should map SSO as a critical CI that ALL services depend on. Availability Management should have identified Azure AD as a Single Point of Failure (SPOF) and implemented fallback auth (cached tokens, local auth degraded mode). Supplier Management should have defined cross-cloud dependency SLAs. The post-incident Problem Management must recommend: authentication redundancy, CMDB dependency mapping for cross-cloud services, and updated Business Impact Analysis.","Switch to a single cloud provider to avoid this","Only Service Continuity Management is relevant here"],answer:1,explanation:"Multi-cloud doesn't mean multi-resilient. The hidden dependency (Azure AD as universal auth) created a SPOF across all three clouds. This is a failure of 'Think and work holistically' -- nobody mapped the cross-cloud dependency graph. CMDB, Availability Management (SPOF analysis), and Supplier Management all had gaps. The fix isn't technical alone -- it's about practices identifying and managing hidden dependencies.",tags:["CMDB","Availability Mgmt","Supplier Mgmt","Problem Mgmt","Risk Mgmt","Service Continuity"]},

{scenario:'<div class="stitle">Compliance-Driven Change Freeze vs Business Urgency</div>A financial institution has a mandatory 4-week change freeze before year-end regulatory reporting (Dec 1 - Dec 31). During the freeze:<ul><li>Dec 5: A critical security vulnerability (CVE score 9.8) is disclosed affecting the customer portal</li><li>Dec 12: A competitor launches a feature that\'s causing customer churn at 500 accounts/day</li><li>Dec 18: A performance degradation is detected that will breach SLA within 48 hours if not patched</li></ul>All three situations require production changes during the change freeze.',
q:"How does ITIL 4 handle the tension between compliance (change freeze) and business urgency?",options:["No exceptions -- the freeze is absolute for compliance reasons","Every change freeze must have an exception process. Dec 5 (security CVE 9.8): Emergency Change -- security risk outweighs freeze risk, fast-track approval with CISO sign-off. Dec 12 (competitor feature): NOT an emergency -- document the business impact, defer to January with a clear business case. Dec 18 (SLA breach): Emergency Change with limited scope -- minimal patch to prevent breach, full fix in January. Each exception requires documented risk assessment comparing 'risk of change' vs 'risk of not changing'. The freeze policy itself should be reviewed during Continual Improvement.","Lift the entire freeze since there are multiple urgent items","Handle all three as Normal Changes through the standard CAB"],answer:1,explanation:"Change freezes are governance controls, not absolute walls. ITIL 4's Risk Management practice requires comparing risks: a CVE 9.8 vulnerability DURING freeze is riskier than a controlled emergency patch. But a competitive feature, while painful, doesn't warrant breaking compliance. Each situation has a different risk profile. The emergency change process exists precisely for these cases. The freeze policy itself should include pre-defined exception criteria.",tags:["Change Enablement","Risk Mgmt","Info Security Mgmt","Governance","Continual Improvement"]},

{scenario:'<div class="stitle">Post-Incident Review -- The Blame Game</div>A major P1 outage lasted 4 hours. During the post-incident review, the following emerges:<ul><li>Engineer A deployed a config change at 5:55 PM on Friday without a Change Request</li><li>The monitoring system didn\'t alert for 45 minutes because the threshold was set too high</li><li>The on-call engineer didn\'t respond for 20 minutes because the paging system sent to the wrong number</li><li>The runbook for this service was 18 months out of date</li><li>The rollback took 90 minutes because the process wasn\'t documented</li></ul>Management wants to discipline Engineer A. The VP of Engineering wants a "blameless post-mortem."',
q:"What is the ITIL 4 / modern best practice approach to this review?",options:["Discipline Engineer A -- they broke the rules","Focus only on the technical fix -- update the monitoring threshold","Conduct a blameless post-mortem focused on SYSTEMIC failures, not individual blame. Five systemic failures occurred: (1) Change process too friction-heavy (why did the engineer skip it?), (2) Monitoring thresholds not reviewed regularly, (3) On-call contact info outdated (process gap), (4) Knowledge Management failure (stale runbook), (5) No documented rollback procedure. Fix the SYSTEMS that allowed the failure, not the person. If the change process is too slow for legitimate urgent changes, create a fast-track option so people don't bypass it.","Only update the runbook and move on"],answer:2,explanation:"Blame fixes nothing. Engineer A bypassed the process -- but WHY? If the process is too slow for legitimate needs, people will bypass it. That's a systemic problem. All five failures are PRACTICE failures: Change Enablement (process too rigid), Monitoring & Event Management (thresholds), Incident Management (on-call), Knowledge Management (stale runbook), Deployment Management (no rollback docs). Fix the system, not the person. This is 'Think and work holistically' in action.",tags:["Continual Improvement","Change Enablement","Knowledge Mgmt","Monitoring & Event Mgmt","Incident Mgmt","Org Change Mgmt"]},

{scenario:'<div class="stitle">Observability-Driven Incident Management</div>An SRE team proposes replacing traditional monitoring (threshold-based alerts) with full observability (distributed tracing, log aggregation, metric correlation). Their argument:<ul><li>Current monitoring generates 2,000+ alerts/day, 94% are noise</li><li>Mean Time to Detect (MTTD) is 23 minutes -- they want < 2 minutes</li><li>Current approach: alert fires > human investigates > maybe it\'s real</li><li>Proposed approach: correlated signals auto-identify root cause before humans are paged</li><li>Cost: $180K/year for observability platform</li><li>Expected savings: 60% reduction in MTTR, 80% reduction in alert noise</li></ul>',
q:"How does this map to ITIL 4 practices and principles, and should the investment be approved?",options:["Reject it -- ITIL doesn't cover observability tools","Approve it -- any tool improvement is good","This maps directly to multiple ITIL 4 concepts: 'Optimize and automate' (reduce noise, auto-correlate), Monitoring & Event Management practice (better event classification -- reduce 94% noise), Incident Management (faster detection = lower MTTR), 'Focus on value' (justify $180K against MTTR savings and reduced toil). The investment should be evaluated using Service Financial Management: if 60% MTTR reduction prevents even one 4-hour outage per quarter, the ROI is positive. Approve with measurable success criteria and iterative rollout.","This is a technology decision, not an ITSM decision"],answer:2,explanation:"Observability is the evolution of Monitoring & Event Management. ITIL 4's 'Information and Technology' dimension explicitly covers technology choices. The 'Optimize and automate' principle supports this. But ITIL also requires justification ('Focus on value') and measurement (Measurement & Reporting). Don't just buy the tool -- define success criteria, measure baseline, implement iteratively, and verify improvement.",tags:["Monitoring & Event Mgmt","Incident Mgmt","Continual Improvement","Service Financial Mgmt","Measurement & Reporting"]},
]},

{id:"governance-strategy",title:"Governance, Strategy & Enterprise ITSM",difficulty:"critical",questions:[
{scenario:'<div class="stitle">Board-Level IT Governance Failure</div>A publicly traded company suffers a data breach exposing 3.4 million customer records. The board investigation reveals:<ul><li>IT reported "green" on all security dashboards for 18 months</li><li>The CISO had raised concerns about legacy systems 8 months ago -- it was deprioritized</li><li>No formal risk register existed for IT services</li><li>IT governance meetings happened quarterly but had no decision-making authority</li><li>The breach occurred through a known vulnerability that had a patch available for 6 months</li></ul>',
q:"Which ITIL 4 governance and practice failures contributed to this breach?",options:["Only Information Security Management failed","Governance structure failed (no decision authority), Risk Management failed (no formal risk register), Information Security Management failed (known vulnerability unpatched for 6 months), Measurement & Reporting failed (dashboards showed 'green' but reality was 'red' -- Watermelon Effect), and Continual Improvement failed (CISO concern deprioritized without proper assessment). The governing body failed its EVALUATE-DIRECT-MONITOR responsibility.","This was unavoidable -- breaches happen","Only the CISO is responsible"],answer:1,explanation:"This is a cascading governance failure. The governing body's three responsibilities -- Evaluate (assess risks), Direct (set policies), Monitor (verify compliance) -- all failed. Risk Management had no register. Measurement & Reporting showed false positives. The CISO escalated but governance had no authority to act. The 6-month unpatched vulnerability is a Change Enablement failure (security patches should be priority changes). Every layer of defense failed.",tags:["Governance","Risk Mgmt","Info Security Mgmt","Measurement & Reporting","Continual Improvement","Change Enablement"]},

{scenario:'<div class="stitle">IT Cost Optimization Under Pressure</div>The CFO mandates a 25% IT budget cut within 6 months. Current IT spend breakdown:<ul><li>Infrastructure (cloud + on-prem): 40% ($4.8M)</li><li>Licensing (software): 20% ($2.4M)</li><li>Staff (internal IT): 25% ($3.0M)</li><li>Vendors/contractors: 10% ($1.2M)</li><li>Tools & tooling: 5% ($0.6M)</li></ul>The CIO must cut $3M without significantly degrading service quality.',
q:"Which ITIL 4 practices guide this cost optimization, and what's the recommended approach?",options:["Cut staff by 25% -- it's the fastest way to reduce costs","Cancel all vendor contracts immediately","Use Service Financial Management to analyze cost-per-service (which services cost most vs value delivered). Use Portfolio Management to identify services for rationalization (retire low-value services). Use IT Asset Management to find unused licenses ($2.4M likely has waste). Use Capacity & Performance Management to right-size cloud infrastructure (40% is often overprovisioned). Use Supplier Management to renegotiate contracts. Apply 'Focus on value': cut what doesn't deliver value, not across-the-board.","Cut the tools budget entirely -- tools are optional"],answer:2,explanation:"Across-the-board cuts destroy value. Targeted cuts preserve it. Service Financial Management reveals cost-per-service. Portfolio Management identifies candidates for retirement. ITAM typically finds 20-30% license waste. Cloud right-sizing often saves 30-40%. Supplier renegotiation can yield 10-15% savings. This approach can achieve 25% cuts while maintaining or even improving service quality. 'Focus on value' is the guiding principle: cut waste, not capability.",tags:["Service Financial Mgmt","Portfolio Mgmt","IT Asset Mgmt","Capacity & Performance Mgmt","Supplier Mgmt"]},

{scenario:'<div class="stitle">ITSM for Product-Centric Organization</div>A company transitions from project-based to product-based delivery. Previously:<ul><li>IT organized by function: Infrastructure team, Application team, DBA team, Network team</li><li>ITSM processes were centralized and function-based</li></ul>Now:<ul><li>Cross-functional product teams own services end-to-end (you build it, you run it)</li><li>Each product team has its own developers, SREs, and product owners</li><li>12 product teams, each responsible for their services 24/7</li></ul>Question: how do ITSM practices adapt when there\'s no centralized operations team?',
q:"How should ITIL practices be structured in a product-centric model?",options:["Keep centralized ITSM -- product teams shouldn't do operations","Each product team does whatever they want -- no standards needed","Federated model: each product team owns Incident, Problem, and Change for THEIR services (embedded practices). Centralized functions remain for cross-cutting practices: CMDB (enterprise-wide dependencies), Service Level Management (enterprise SLA framework), Information Security (compliance standards), and Continual Improvement (share learnings across teams). A lightweight 'Platform team' provides shared tooling, observability, and practice templates that product teams adopt and adapt.","Outsource all operations to a managed service provider"],answer:2,explanation:"Product-centric ITSM requires a federated model. Product teams need autonomy (they know their services best) but the enterprise needs consistency (CMDB must be complete, security standards must be uniform). The 'Platform team' concept enables this: shared tools and practice templates that product teams can customize. This maps to ITIL 4's 'Organizations and People' dimension -- restructuring how people are organized while maintaining enterprise governance.",tags:["All Practices","Org Change Mgmt","Governance","Value Streams & Processes","Organizations & People dimension"]},

{scenario:'<div class="stitle">Measuring ITSM Maturity -- Beyond Metrics</div>An organization measures ITSM success using these KPIs:<ul><li>Number of incidents closed per month: 1,247 (target: >1,000) -- GREEN</li><li>Average resolution time: 4.2 hours (target: <8 hours) -- GREEN</li><li>Change success rate: 96% (target: >90%) -- GREEN</li><li>SLA compliance: 98.5% (target: >95%) -- GREEN</li></ul>All metrics are green. But:<ul><li>Customer satisfaction survey: 42% (down from 67% last year)</li><li>Employee IT satisfaction: 3.1/10</li><li>Repeat incidents: 38% of incidents are repeats of previous incidents</li><li>Mean time between failures: decreasing quarter over quarter</li></ul>',
q:"What is fundamentally wrong with how this organization measures ITSM success?",options:["Nothing -- all KPIs are green, so ITSM is successful","The metrics measure ACTIVITY (volume, speed) not VALUE (customer satisfaction, service stability). They're optimizing the wrong things. Closing 1,247 incidents fast is meaningless if 38% are repeats that should have been prevented by Problem Management. Meeting SLA targets means nothing if customers are unhappy (Watermelon Effect). Better metrics: customer/employee satisfaction, repeat incident rate, MTBF trend, Problem Management effectiveness (% incidents with known root cause), and services improved per quarter.","They need more KPIs -- add 20 more metrics","The targets are set too low"],answer:1,explanation:"This is the Watermelon Effect at the organizational level. Activity metrics ('how many', 'how fast') are green, but outcome metrics ('did we create value') are red. ITIL 4's 'Focus on value' principle demands outcome-based measurement. Measurement & Reporting practice should track: value delivered (satisfaction), problems prevented (not just incidents closed), and service stability trends (MTBF) -- not just volume and speed.",tags:["Measurement & Reporting","Continual Improvement","Service Level Mgmt","Problem Mgmt","Focus on Value principle"]},

{scenario:'<div class="stitle">Regulatory Compliance vs Agility -- GDPR/DPDP Scenario</div>Your organization operates in India and Europe. You must comply with:<ul><li>India: Digital Personal Data Protection Act (DPDP) 2023</li><li>Europe: GDPR</li><li>Industry: PCI-DSS for payment processing</li></ul>The compliance team wants: full change documentation, data impact assessments for every change, 30-day data retention audits, and quarterly compliance reviews. The engineering team wants: fast deployments, automated everything, minimal paperwork. Both are right.',
q:"How does ITIL 4 reconcile compliance requirements with engineering agility?",options:["Compliance always wins -- slow everything down","Engineering speed always wins -- compliance will catch up","Embed compliance into automated workflows: (1) Change Enablement: auto-generate change documentation from CI/CD pipeline metadata (commit messages, test results, approvals in code), (2) Information Security: automated data impact classification using tags and policies-as-code, (3) Service Configuration Management: CMDB auto-updated by infrastructure-as-code, creating audit trails without manual effort, (4) Continual Improvement: quarterly compliance reviews automated via dashboards pulling real-time data. Compliance becomes a byproduct of good engineering practices, not a separate burden.","Hire a separate compliance team that works independently from engineering"],answer:2,explanation:"ITIL 4's 'Optimize and automate' principle resolves this tension. Compliance and agility aren't opposites -- they're both achievable when governance is embedded in automation. Policy-as-code, automated documentation from pipelines, CMDB auto-discovery, and real-time compliance dashboards give auditors what they need without slowing engineers down. This is the 'Value Streams and Processes' dimension meeting the 'Information and Technology' dimension.",tags:["Change Enablement","Info Security Mgmt","CMDB","Continual Improvement","Governance","Optimize & Automate principle"]},
]},
];

const F=[];S.forEach((s,si)=>s.questions.forEach((_,qi)=>F.push({si,qi,t:s.title,d:s.difficulty})));
const T=F.length;
let I=0,A={},QS=false,QF=false,TI=null,TS=0;
const K=(a,b)=>a+'-'+b,cK=()=>{const f=F[I];return K(f.si,f.qi)},cQ=()=>{const f=F[I];return S[f.si].questions[f.qi]},nA=()=>Object.keys(A).length;

function R(){if(!QS)return RW();if(QF)return RR();RQ()}
function RW(){
$('hs').textContent='--';$('hp').textContent='--/--';$('ht').textContent='--:--';$('pb').style.width='0%';
$('app').innerHTML=`<div class="welcome fi"><h2>ITIL 4 Expert Scenarios</h2><p class="sub">Real-world industry incidents, outages, transformations, and governance dilemmas. Every question is a scenario drawn from actual enterprise IT situations.</p>
<div class="sg"><div class="s"><div class="n">${T}</div><div class="l">Scenarios</div></div><div class="s"><div class="n">${S.length}</div><div class="l">Sections</div></div><div class="s"><div class="n">75</div><div class="l">Minutes</div></div><div class="s"><div class="n">70%</div><div class="l">Pass Mark</div></div></div>
<h3 style="text-align:left;margin:1.25rem 0 0.5rem;color:var(--primary)">Sections:</h3><div style="text-align:left">${S.map((s,i)=>`<div style="padding:0.5rem 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span><strong>${i+1}.</strong> ${s.title}</span><span><span class="dtag d-${s.difficulty}">${s.difficulty}</span> <span style="color:var(--text-light);font-size:0.75rem;margin-left:0.4rem">${s.questions.length} Qs</span></span></div>`).join('')}</div>
<div class="bc" style="margin-top:1.75rem"><button class="btn bp" onclick="ST()" style="padding:0.85rem 2.5rem;font-size:1rem">Begin Assessment</button></div>
<p style="margin-top:0.85rem;font-size:0.72rem;color:var(--text-light)">Each scenario presents a real-world situation. Select your answer -- feedback is instant.<br>Keyboard: A/B/C/D to answer, arrow keys to navigate.</p></div>`}

function RQ(){
const f=F[I],q=cQ(),k=cK(),s=A[k],dn=s!==undefined,ok=s===q.answer,L=['A','B','C','D'];
$('hs').textContent=f.t;$('hp').textContent=`${I+1} / ${T}`;$('pb').style.width=`${(nA()/T)*100}%`;
const sc=q.scenario?`<div class="scenario">${q.scenario}</div>`:'';
const opts=q.options.map((o,i)=>{let c='opt',ic='';if(dn){c+=' dis';if(i===q.answer){c+=' cor';ic='<span class="oi">&#10004;</span>'}else if(i===s&&i!==q.answer){c+=' wrn';ic='<span class="oi">&#10008;</span>'}}return`<div class="${c}" onclick="PK(${i})"><div class="ol">${L[i]}</div><div class="ot">${o}</div>${ic}</div>`}).join('');
let ex='';if(dn){const tags=q.tags?`<div class="practices">${q.tags.map(t=>`<span class="ptag">${t}</span>`).join('')}</div>`:'';ex=`<div class="exp ${ok?'ce':'we'}"><strong>${ok?'&#10004; Correct!':'&#10008; Incorrect'}</strong>${!ok?'The correct answer is: <strong>'+L[q.answer]+'. '+q.options[q.answer]+'</strong><br><br>':''}${q.explanation}${tags}</div>`}
const dots=F.map((x,i)=>{let c='dot';const dk=K(x.si,x.qi);if(i===I)c+=' cur';else if(A[dk]!==undefined)c+=A[dk]===S[x.si].questions[x.qi].answer?' ac':' aw';return`<div class="${c}" onclick="GO(${i})" title="Q${i+1}"></div>`}).join('');
$('app').innerHTML=`<div class="qcard d-${f.d} fi"><div class="qmeta"><span><span class="qsec">${f.t}</span> <span class="dtag d-${f.d}" style="margin-left:0.3rem">${f.d}</span></span><span class="qnum">Q${I+1} of ${T}</span></div>${sc}<div class="qtext">${q.q}</div><div class="opts">${opts}</div>${ex}</div>
<div class="nav"><button class="btn bg" onclick="GO(${I-1})" ${I===0?'disabled':''}>&#8592; Prev</button><div class="dots">${dots}</div>${dn&&I<T-1?'<button class="btn bp" onclick="GO('+(I+1)+')">Next &#8594;</button>':dn&&I===T-1?'<button class="btn ba" onclick="FN()">See Results</button>':'<button class="btn bg" onclick="GO('+(I+1)+')" '+(I>=T-1?'disabled':'')+'>Skip &#8594;</button>'}</div>
<div style="text-align:center;margin-top:0.6rem;color:var(--text-light);font-size:0.72rem">${nA()} of ${T} answered${nA()===T?' &mdash; <a href="#" onclick="FN();return false" style="color:var(--accent);font-weight:600">See Results</a>':''}</div>`}

function RR(){
clearInterval(TI);let tc=0;
const sr=S.map((s,si)=>{let c=0;s.questions.forEach((q,qi)=>{if(A[K(si,qi)]===q.answer)c++});tc+=c;return{title:s.title,diff:s.difficulty,c,t:s.questions.length}});
const p=Math.round((tc/T)*100);let gc,gt;if(p>=90){gc='ge';gt='Outstanding -- True ITIL Expert'}else if(p>=70){gc='gg';gt='Strong -- Advanced Practitioner'}else if(p>=50){gc='ga';gt='Developing -- Review Weak Scenarios'}else{gc='gp';gt='Needs Significant Study'}
const m=Math.floor(TS/60),se=TS%60;$('hs').textContent='Complete';$('hp').textContent=`${tc}/${T}`;$('ht').textContent=`${m}m ${se}s`;$('pb').style.width='100%';
function bc(r){return r>=0.9?'var(--success)':r>=0.7?'#1565c0':r>=0.5?'var(--accent)':'var(--error)'}
$('app').innerHTML=`<div class="res fi"><h2>Assessment Complete</h2><p style="color:var(--text-light)">${gt}</p>
<div class="sc ${gc}"><div class="p">${p}<span class="ps">%</span></div><div class="lb">${tc} of ${T}</div></div>
<div style="display:flex;justify-content:center;gap:1.5rem;margin:0.85rem 0;flex-wrap:wrap;font-size:0.88rem"><div><strong>Time:</strong> ${m}m ${se}s</div><div><strong>Correct:</strong> ${tc}</div><div><strong>Wrong:</strong> ${T-tc}</div><div><strong>Result:</strong> <span style="color:${p>=70?'var(--success)':'var(--error)'};font-weight:700">${p>=70?'PASS':'FAIL'}</span></div></div>
<h3 style="text-align:left;margin:1rem 0 0.4rem;color:var(--primary)">Section Breakdown</h3>
<div class="ss">${sr.map((x,i)=>{const r=x.c/x.t;return`<div class="ssc"><h4>S${i+1}: ${x.title} <span class="dtag d-${x.diff}" style="font-size:0.55rem;margin-left:0.2rem">${x.diff}</span></h4><div class="sv">${x.c}/${x.t} <span style="font-size:0.78rem;color:var(--text-light)">(${Math.round(r*100)}%)</span></div><div class="bb"><div class="bf" style="width:${r*100}%;background:${bc(r)}"></div></div></div>`}).join('')}</div>
<h3 style="text-align:left;margin:1rem 0 0.4rem;color:var(--primary)">Study Focus Areas</h3>
<div style="text-align:left;font-size:0.88rem">${sr.map((x,i)=>{const r=x.c/x.t;return r<0.7?'<p style="padding:0.35rem 0;border-bottom:1px solid var(--border)"><span style="color:var(--error);font-weight:600">Review:</span> S'+(i+1)+' -- '+x.title+' ('+Math.round(r*100)+'%)</p>':''}).join('')||'<p style="color:var(--success);font-weight:600">Excellent across all sections!</p>'}</div>
