<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITIL 4 x NPCI UPI -- Advanced Scenario Assessment</title>
<style>
:root{--p:#0d47a1;--pl:#1565c0;--ac:#e65100;--ok:#1b5e20;--no:#b71c1c;--bg:#eceff1;--card:#fff;--tx:#1a1a2e;--tx2:#546e7a;--bd:#cfd8dc;--dk:#0a1628;--scn:#f8f9fb;--scnb:#78909c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
header{background:linear-gradient(135deg,var(--dk),#1a237e);color:#fff;padding:1rem 1.5rem;position:sticky;top:0;z-index:99;box-shadow:0 3px 16px rgba(0,0,0,.3)}
header h1{font-size:1.1rem;font-weight:700;text-align:center}
.hsub{text-align:center;font-size:.6rem;opacity:.5;letter-spacing:1.5px;text-transform:uppercase;margin-top:.1rem}
.hrow{display:flex;justify-content:center;gap:1.5rem;margin-top:.35rem;font-size:.8rem;opacity:.85}
.pbar{background:rgba(255,255,255,.12);border-radius:8px;height:4px;margin:.4rem auto 0;max-width:520px}
.pfill{background:var(--ac);height:100%;border-radius:8px;transition:width .35s}
.wrap{max-width:720px;margin:0 auto;padding:1.25rem}

.wl{text-align:center;padding:2.5rem 1.75rem;background:var(--card);border-radius:14px;margin-top:1.5rem;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.wl h2{color:var(--p);font-size:1.45rem;margin-bottom:.2rem}
.wl .sub{color:var(--tx2);margin-bottom:1.25rem;font-size:.88rem}
.ei{text-align:left;background:#f8f9fa;border-radius:10px;padding:1rem 1.15rem;margin:1rem 0;font-size:.85rem;line-height:1.7}
.ei b{color:var(--p)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.5rem;margin:1rem 0}
.sg .s{background:var(--bg);padding:.65rem;border-radius:8px;text-align:center}
.sg .s .n{font-size:1.4rem;font-weight:700;color:var(--p)}
.sg .s .l{font-size:.58rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}

.qc{background:var(--card);border-radius:14px;padding:1.65rem;margin-top:1.15rem;box-shadow:0 3px 14px rgba(0,0,0,.05);position:relative;overflow:hidden}
.qc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1a237e,#42a5f5)}
.qm{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:.35rem}
.qtag{background:#e8eaf6;color:var(--p);padding:.12rem .5rem;border-radius:10px;font-size:.6rem;font-weight:600}
.qn{color:var(--tx2);font-size:.75rem;font-weight:600}

.scn{background:var(--scn);border-left:4px solid var(--scnb);border-radius:0 10px 10px 0;padding:.85rem 1rem;margin-bottom:1rem;font-size:.84rem;color:#37474f;line-height:1.6}
.scn .st{font-weight:700;color:var(--dk);font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.scn .st::before{content:'';display:inline-block;width:7px;height:7px;background:#ff6f00;border-radius:50%}
.scn ul{margin:.4rem 0 0 1.1rem;font-size:.82rem}
.scn li{margin-bottom:.15rem}
.met{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.4rem;margin-top:.5rem}
.met .m{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:.3rem .5rem;text-align:center}
.met .m .v{font-weight:700;color:var(--p);font-size:.88rem}
.met .m .l{font-size:.55rem;color:var(--tx2);text-transform:uppercase}

.qt{font-weight:600;font-size:1.02rem;margin-bottom:1.1rem;line-height:1.5}

.opts{display:flex;flex-direction:column;gap:.4rem}
.op{display:flex;align-items:flex-start;padding:.7rem .95rem;border:2px solid var(--bd);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.88rem;line-height:1.45}
.op:hover:not(.dis){border-color:var(--pl);background:#e3f2fd;transform:translateX(2px)}
.ol{width:26px;height:26px;border:2px solid #b0bec5;border-radius:50%;margin-right:.7rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;color:#90a4ae;transition:all .2s;margin-top:1px}
.ot{flex:1}.oi{font-size:1.05rem;margin-left:.4rem;opacity:0;transition:opacity .25s;flex-shrink:0;margin-top:2px}
.op.ok{border-color:var(--ok)!important;background:#e8f5e9!important;transform:none}.op.ok .ol{border-color:var(--ok);background:var(--ok);color:#fff}.op.ok .oi{opacity:1}
.op.no{border-color:var(--no)!important;background:#ffebee!important;transform:none}.op.no .ol{border-color:var(--no);background:var(--no);color:#fff}.op.no .oi{opacity:1}
.op.dis{pointer-events:none}.op.dis:not(.ok):not(.no){opacity:.4}

.exp{margin-top:.8rem;padding:.8rem 1rem;border-radius:10px;font-size:.83rem;line-height:1.6;animation:su .3s ease}
.exp.oe{background:#e8f5e9;border-left:4px solid var(--ok);color:#1b5e20}
.exp.ne{background:#fff8e1;border-left:4px solid var(--ac);color:#bf360c}
.exp b{display:block;margin-bottom:.12rem;font-size:.85rem}
.exp .tags{margin-top:.4rem;display:flex;flex-wrap:wrap;gap:.25rem}
.exp .tag{background:rgba(0,0,0,.06);padding:.1rem .4rem;border-radius:8px;font-size:.62rem;font-weight:600;color:var(--p)}
@keyframes su{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.fb{display:flex;align-items:center;gap:.4rem;margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--bd)}
.fbtn{background:none;border:1.5px solid var(--bd);border-radius:5px;padding:.25rem .55rem;font-size:.68rem;cursor:pointer;color:var(--tx2);transition:all .15s;display:flex;align-items:center;gap:.2rem}
.fbtn:hover{border-color:var(--ac);color:var(--ac)}.fbtn.fl{border-color:var(--ac);color:var(--ac);background:#fff3e0}

.nv{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;gap:.5rem}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;flex:1}
.d{width:8px;height:8px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;transition:all .15s}
.d:hover{border-color:var(--p);transform:scale(1.3)}
.d.cur{border-color:var(--p);background:var(--p);transform:scale(1.3)}
.d.aok{border-color:var(--ok);background:var(--ok)}.d.ano{border-color:var(--no);background:var(--no)}
.d.fld{box-shadow:0 0 0 2px var(--ac)}

.btn{padding:.55rem 1.2rem;border:none;border-radius:7px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--pl);transform:translateY(-1px);box-shadow:0 3px 10px rgba(13,71,161,.25)}
.ba{background:var(--ac);color:#fff}.ba:hover{background:#bf360c}
.bo{background:0;border:2px solid var(--p);color:var(--p)}.bo:hover{background:var(--p);color:#fff}
.bg{background:0;color:var(--tx2);border:2px solid var(--bd)}.bg:hover{border-color:var(--p);color:var(--p)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important}

.res{background:var(--card);border-radius:14px;padding:2rem;margin-top:1.5rem;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.07)}
.sc{width:130px;height:130px;border-radius:50%;margin:1rem auto;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.sc .pn{font-size:2rem;font-weight:800;line-height:1}.sc .ps{font-size:.8rem}.sc .lb{font-size:.6rem;opacity:.85;margin-top:.1rem}
.ge{background:linear-gradient(135deg,#1b5e20,#43a047)}.gg{background:linear-gradient(135deg,#1565c0,#1e88e5)}.ga{background:linear-gradient(135deg,#e65100,#fb8c00)}.gp{background:linear-gradient(135deg,#c62828,#e53935)}
.ss{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.5rem;margin:.75rem 0;text-align:left}
.ssc{background:var(--bg);padding:.65rem;border-radius:7px;border-left:3px solid var(--p)}
.ssc h4{font-size:.65rem;color:var(--tx2);margin-bottom:.2rem}
.ssc .sv{font-size:1rem;font-weight:700;color:var(--p)}
.ssc .bb{height:3px;background:var(--bd);border-radius:2px;margin-top:.3rem}
.ssc .bf{height:100%;border-radius:2px;transition:width .8s}

.timer{font-weight:600;font-variant-numeric:tabular-nums}.timer.tw{color:#ffab00}.timer.td{color:#ff1744;animation:pu 1s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-width:600px){header h1{font-size:.9rem}.wrap{padding:.7rem}.qc{padding:1.1rem}.qt{font-size:.93rem}.op{padding:.6rem .75rem;font-size:.83rem}.wl{padding:1.5rem .85rem}.res{padding:1.5rem}.nv{flex-direction:column}.d{width:7px;height:7px}}
.fi{animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
<h1>ITIL 4 x NPCI UPI -- Advanced Scenario Assessment</h1>
<div class="hsub">50 Real-World UPI Production Scenarios</div>
<div class="hrow"><span id="hs">--</span><span id="hp">--</span><span class="timer" id="ht">--:--</span></div>
<div class="pbar"><div class="pfill" id="pb"></div></div>
</header>
<div class="wrap" id="app"></div>
<script>
const Q=[
// ========== SECTION 1: UPI INCIDENT MANAGEMENT (10) ==========
{sec:"UPI Incidents",s:'<div class="st">UPI Transaction Failure Spike</div>At 9:15 AM, NPCI monitoring detects UPI transaction success rate dropping from 99.4% to 72%. Approximately 380 banks are affected. The NOC dashboard shows error code "U69 -- Timeout at beneficiary bank" concentrated on 3 PSP banks (PhonePe, GPay, Paytm).<div class="met"><div class="m"><div class="v">72%</div><div class="l">Success Rate</div></div><div class="m"><div class="v">380</div><div class="l">Banks Affected</div></div><div class="m"><div class="v">~4.2Cr</div><div class="l">Users Impacted</div></div></div>',q:"What should NPCI's first action be?",o:["Wait 15 minutes to see if it auto-recovers","Declare Major Incident and activate the war room","Restart all UPI transaction engine pods","Contact RBI to report the outage"],a:1,ex:"A drop from 99.4% to 72% affecting 380 banks is a clear P1 Major Incident. The first action is to declare it, activate the war room, and begin coordinated investigation. Waiting risks further degradation. Restarting blindly without diagnosis could worsen things.",t:["Incident Mgmt","Major Incident","Monitoring & Event"]},

{sec:"UPI Incidents",s:'<div class="st">Axis Bank Settlement Mismatch</div>Axis Bank reports that their end-of-day settlement amount is Rs. 47 Cr less than expected. NPCI settlement engine shows the correct total. The discrepancy affects 12,000 transactions processed between 2 PM and 4 PM. Axis Bank\'s reconciliation team has already escalated to their CTO.',q:"This is classified as which type of ITSM record?",o:["A Service Request from Axis Bank","A P1 Incident -- financial data integrity issue","A Standard Change to adjust settlement","A Problem -- needs root cause analysis first"],a:1,ex:"Financial settlement mismatch affecting a major bank is an unplanned disruption to service quality = Incident. It's P1 due to financial impact (Rs. 47 Cr) and regulatory implications. Service Requests are pre-defined routine actions; this is not routine.",t:["Incident Mgmt","Service Level Mgmt"]},

{sec:"UPI Incidents",s:'<div class="st">UPI Lite Recurring Crashes</div>UPI Lite (small payments under Rs. 500) has crashed 4 times this week. Each time, the L2 team restarts the service and it recovers within 8 minutes. The crashes occur at different times with no obvious pattern. Each restart is logged as a separate resolved incident.',q:"After the 4th crash, what should the Incident Manager escalate to?",o:["L3 support for a faster restart process","Problem Management for root cause investigation","Change Management to replace UPI Lite","The vendor who built UPI Lite"],a:1,ex:"Four recurring incidents with the same symptom (crash + restart fix) is a textbook trigger for Problem Management. Incident Management resolved each occurrence, but the underlying cause is unknown. Problem Management must investigate via Problem Identification > Problem Control > Error Control.",t:["Problem Mgmt","Incident Mgmt"]},

{sec:"UPI Incidents",s:'<div class="st">Diwali Eve -- Transaction Storm</div>It\'s 7 PM on Diwali eve. UPI volume hits 14,000 TPS (normal peak: 8,000). The transaction engine starts queuing requests. Latency rises from 800ms to 4.2 seconds. No errors yet, but the trend is alarming. Auto-scaling is configured but has a 10-minute cooldown between scale events.',q:"This monitoring alert is classified as which event type in ITIL?",o:["Informational -- system is still operational","Warning -- approaching a threshold, action needed soon","Exception -- service has breached an SLA","It is not an event -- no users have complained"],a:1,ex:"Latency is rising rapidly but no SLA breach yet = Warning event. It's approaching a threshold that will likely breach if no action is taken. An exception event means the threshold is already breached. Informational events require no action. Proactive response to warnings prevents exceptions.",t:["Monitoring & Event Mgmt","Capacity & Performance Mgmt"]},

{sec:"UPI Incidents",s:'<div class="st">IMPS-UPI Interconnect Down</div>The interconnect between IMPS and UPI goes down at 11:30 PM. All bank-to-bank transfers initiated via UPI that route through IMPS are failing. Pure UPI P2P and P2M transactions (which don\'t use IMPS) are working fine. The NOC receives 200+ calls in 30 minutes from banks reporting failures.',q:"How should the NOC handle the 200+ bank calls?",o:["Log 200 separate incidents -- one per bank call","Log one incident and link all 200 calls as related contacts","Tell banks to wait and call back in the morning","Ignore the calls -- monitoring already detected it"],a:1,ex:"Same root cause (IMPS interconnect down), same timeframe = one incident. Each bank call is a contact/report linked to that single incident. Logging 200 separate P1 incidents would overwhelm the queue and fragment the response effort. One incident, one investigation, one resolution.",t:["Incident Mgmt","Service Desk"]},

{sec:"UPI Incidents",s:'<div class="st">Fraudulent Transaction Spike</div>NPCI\'s fraud monitoring system flags 1,200 suspicious transactions in 10 minutes -- all originating from a single PSP app. The transactions are small amounts (Rs. 1-10) sent to different bank accounts. The pattern matches a known credential-stuffing attack vector.',q:"Which practices must activate SIMULTANEOUSLY?",o:["Only Incident Management -- restore service first","Only Information Security -- it's a security issue","Incident Management and Information Security Management","Problem Management and Knowledge Management"],a:2,ex:"Both must activate together: Incident Management (contain impact, block the PSP endpoint if needed, protect users) AND Information Security Management (forensics, identify attack vector, coordinate with PSP, preserve evidence). Neither can work alone -- Incident restores service while Security investigates the attack.",t:["Incident Mgmt","Info Security Mgmt","Monitoring & Event"]},

{sec:"UPI Incidents",s:'<div class="st">SBI UPI Node -- Memory Leak</div>SBI\'s UPI node starts returning slow responses at 3 PM. NPCI monitoring shows SBI\'s average response time climbing from 200ms to 1.8 seconds. This affects every UPI transaction where SBI is the beneficiary bank (approx. 22% of all UPI traffic). SBI\'s own monitoring shows "all green."',q:"Why might SBI's monitoring show green while NPCI detects a problem?",o:["NPCI's monitoring is wrong","SBI measures server uptime; NPCI measures end-to-end transaction performance","SBI is hiding the issue deliberately","Both monitoring systems are measuring the same thing"],a:1,ex:"This is a Watermelon Effect at the integration level. SBI monitors their servers (up = green). NPCI monitors end-to-end transaction success and latency (degraded = red). Both are correct for what they measure. Service Level Management must align SLIs across providers to avoid this disconnect.",t:["Service Level Mgmt","Monitoring & Event Mgmt","Supplier Mgmt"]},

{sec:"UPI Incidents",s:'<div class="st">Duplicate Transaction Bug</div>A bug causes some UPI transactions to be debited twice from the sender\'s account. 847 users are affected over 3 hours before detection. Total duplicate debit amount: Rs. 2.1 Cr. The bug was introduced by a code change deployed yesterday.',q:"After the immediate fix (stop duplicates), what is the NEXT priority?",o:["Write a post-mortem report for management","Auto-reverse all 847 duplicate debits immediately","Wait for users to raise complaints, then refund","Update the knowledge base with the bug details"],a:1,ex:"With Rs. 2.1 Cr incorrectly debited from 847 users, the immediate priority after stopping new duplicates is reversing the incorrect debits. Users shouldn't need to complain to get their money back. This is 'Focus on value' -- value for the end user is getting their money returned, not reading a post-mortem.",t:["Incident Mgmt","Focus on Value"]},

{sec:"UPI Incidents",s:'<div class="st">Third-Party API Gateway Outage</div>NPCI uses a third-party API gateway for routing certain bank integrations. The gateway provider reports a global outage at 10 AM. NPCI\'s contract with the provider specifies a 15-minute RTO. After 45 minutes, the provider is still down with no ETA.',q:"What should NPCI do at the 45-minute mark?",o:["Continue waiting -- the provider will fix it eventually","Activate DR failover to the backup gateway provider","File a Problem record for future analysis","Send an email complaint to the provider's support team"],a:1,ex:"The RTO (15 minutes) was breached 30 minutes ago. Service Continuity Management requires activating the fallback plan -- switch to the backup gateway provider. Waiting is not acceptable when the contractual recovery time is 3x exceeded. Supplier Management should escalate formally in parallel.",t:["Service Continuity Mgmt","Supplier Mgmt","SLA"]},

{sec:"UPI Incidents",s:'<div class="st">Certificate Expiry -- Silent Failure</div>At midnight, the SSL certificate on one of NPCI\'s internal API endpoints expires. Transactions using that endpoint start failing silently -- no error alerts because the monitoring checks HTTP status (which returns 200) but doesn\'t validate SSL handshake. The failure is only detected at 6 AM when banks report errors.',q:"What monitoring practice gap caused the 6-hour detection delay?",o:["Monitoring was checking the wrong metric (HTTP 200 vs SSL validity)","The NOC team was asleep","Certificate expiry is unpredictable","Banks should have detected it faster"],a:0,ex:"Monitoring & Event Management checked a superficial metric (HTTP status) instead of the meaningful one (SSL handshake validity). The practice gap: monitoring must validate what the consumer actually experiences, not just what's easy to check. Additionally, certificate expiry should have been tracked proactively as a CI with an expiry alert.",t:["Monitoring & Event Mgmt","Service Configuration Mgmt"]},

// ========== SECTION 2: UPI CHANGE & RELEASE (10) ==========
{sec:"UPI Change & Release",s:'<div class="st">UPI 3.0 Protocol Upgrade</div>NPCI plans to upgrade UPI from protocol version 2.0 to 3.0. The upgrade affects all 400+ member banks. Changes include new API fields, modified authentication flow, and updated encryption standards. Banks need 3-6 months to update their integrations.',q:"This is classified as which type of change?",o:["Standard Change -- it's a planned upgrade","Emergency Change -- it's critical for security","Normal Change -- it requires CAB assessment and phased rollout","It doesn't need a Change Record"],a:2,ex:"A protocol upgrade affecting 400+ banks with 3-6 month timeline is a high-impact, high-risk Normal Change. It needs full risk assessment, CAB approval, phased rollout (pilot banks first), rollback plan, and extensive testing. Standard Changes are pre-approved and low-risk -- this is neither.",t:["Change Enablement","Release Mgmt"]},

{sec:"UPI Change & Release",s:'<div class="st">Kafka Cluster Expansion</div>NPCI needs to add 3 nodes to their Kafka cluster to handle Diwali traffic (expected 3x normal volume). The procedure is well-documented, has been done 6 times before with zero failures, and doesn\'t require downtime. It takes 45 minutes to complete.',q:"What change type is appropriate?",o:["Normal Change with full CAB review","Standard Change using the existing template","Emergency Change -- Diwali is time-critical","No change needed -- it's just infrastructure scaling"],a:1,ex:"Well-documented, done 6 times before, zero failures, no downtime = textbook Standard Change. A pre-approved template exists. Forcing this through Normal Change and CAB wastes time without reducing already-low risk. The urgency of Diwali doesn't make it 'Emergency' -- it's planned and routine.",t:["Change Enablement"]},

{sec:"UPI Change & Release",s:'<div class="st">Hotfix During Settlement Window</div>At 11 PM, during the nightly settlement batch, a critical bug is discovered: settlement amounts for 15 banks are being calculated with yesterday\'s exchange rates instead of today\'s. The settlement batch completes in 90 minutes. A fix is ready but deploying it requires restarting the settlement engine mid-batch.',q:"What is the correct approach?",o:["Deploy the hotfix immediately -- the bug is critical","Raise an Emergency Change with verbal CTO approval, then deploy","Wait until tomorrow's batch -- the fix can wait 24 hours","Roll back the entire settlement batch and restart"],a:1,ex:"Mid-production financial calculation error with an available fix needs Emergency Change: verbal approval from the CTO/Change Manager (documented in work notes), deploy the fix, then mandatory post-implementation review. Deploying without any approval is a process bypass; waiting 24 hours means 15 banks get wrong settlements.",t:["Change Enablement","Incident Mgmt"]},

{sec:"UPI Change & Release",s:'<div class="st">Canary Deployment Gone Wrong</div>NPCI deploys Transaction Engine v4.2 using canary strategy: 5% of traffic routed to v4.2 pods. After 20 minutes, the canary shows 2.3% error rate (baseline: 0.1%). The errors are "timeout connecting to Oracle DB." The remaining 95% traffic on v4.1 is unaffected.',q:"What should the release team do?",o:["Expand canary to 25% to get more data","Immediately route 100% traffic back to v4.1","Restart the Oracle database","Investigate the DB timeout while keeping the 5% canary running"],a:1,ex:"A 2.3% error rate (23x baseline) on canary is a clear rollback signal. Route all traffic back to v4.1 immediately. Investigation happens AFTER rollback, not during live errors. Expanding the canary would multiply the impact. Restarting Oracle would affect ALL traffic, not just canary.",t:["Deployment Mgmt","Release Mgmt","Change Enablement"]},

{sec:"UPI Change & Release",s:'<div class="st">Change Calendar Conflict</div>Two approved changes are scheduled for the same Sunday 2-4 AM window:<ul><li>CHG-001: Oracle database patching (DBA team)</li><li>CHG-002: Network switch firmware upgrade (Network team)</li></ul>The Oracle database connects through the network switch being upgraded. Neither team checked the change calendar for conflicts.',q:"Which two capabilities would have caught this conflict?",o:["Better incident response and faster escalation","Change calendar conflict detection and CMDB dependency mapping","More frequent CAB meetings and stricter approvals","Automated deployment pipelines and testing"],a:1,ex:"Change Enablement's change calendar would show both changes in the same window. CMDB dependency mapping would show Oracle connects through the switch being upgraded. Together they detect the conflict before implementation. This also reflects 'Collaborate and promote visibility' -- shared awareness prevents surprises.",t:["Change Enablement","Service Configuration Mgmt","CMDB"]},

{sec:"UPI Change & Release",s:'<div class="st">Feature Flag Rollout</div>NPCI deploys a new fraud detection algorithm using a feature flag (disabled by default). The plan: enable it for 1% of transactions on Monday, 10% on Wednesday, 100% on Friday -- if metrics are stable at each stage. Enabling the feature flag doesn\'t require a code deployment.',q:"How should each feature flag toggle be governed?",o:["Each toggle needs a separate Normal Change with CAB","No governance needed -- the code is already deployed","One Standard Change covers all three toggles","One Normal Change for the plan; toggles are pre-approved execution steps"],a:3,ex:"The overall plan (deploy algorithm, phased enablement) is a Normal Change approved once by CAB. Each toggle is a pre-approved execution step within that change -- not a separate change. This avoids 3 CAB reviews for a single approved plan while maintaining governance of the overall approach.",t:["Change Enablement","Risk Mgmt"]},

{sec:"UPI Change & Release",s:'<div class="st">Bank Onboarding -- New Member</div>A new small finance bank wants to join the UPI network. The onboarding involves: API credential setup, test environment provisioning, certification testing, production enablement, and monitoring dashboard setup. This is done ~15 times per year using the same documented procedure.',q:"What change type and which other practice is essential?",o:["Emergency Change + Incident Management","Normal Change + Problem Management","Standard Change + Service Validation & Testing","No change needed -- just a Service Request"],a:2,ex:"Bank onboarding is routine, well-documented, and repeated ~15 times/year = Standard Change. But because a new bank joining UPI affects the production ecosystem, Service Validation & Testing is essential: the bank must pass certification tests before production enablement. Both practices work together.",t:["Change Enablement","Service Validation & Testing"]},

{sec:"UPI Change & Release",s:'<div class="st">Year-End Change Freeze</div>NPCI enforces a change freeze from Dec 20 to Jan 5 for year-end settlement stability. During the freeze, a routine security patch for the API gateway is due. The patch addresses a medium-severity vulnerability (CVE score 5.5). No active exploitation is detected.',q:"Should the security patch be deployed during the freeze?",o:["Yes -- all security patches are critical","No -- defer to Jan 6 per the freeze policy","Yes -- invoke Emergency Change immediately","Partially -- apply to staging only, production after freeze"],a:1,ex:"CVE 5.5 (medium) with no active exploitation doesn't warrant breaking the change freeze. The risk of deploying during the critical settlement period outweighs the risk of a medium, non-exploited vulnerability. Defer to Jan 6. If it were CVE 9.8 with active exploitation, the answer would be different -- Emergency Change.",t:["Change Enablement","Risk Mgmt","Info Security Mgmt"]},

{sec:"UPI Change & Release",s:'<div class="st">Release Bundling Decision</div>Three approved changes are ready for deployment:<ul><li>CHG-A: Bug fix for timeout handling (low risk)</li><li>CHG-B: New Grafana dashboards (zero risk)</li><li>CHG-C: Database schema migration (high risk)</li></ul>The release manager wants to bundle all three into one release for the Sunday window.',q:"Is bundling all three advisable?",o:["Yes -- one deployment window is more efficient","No -- deploy A and B together, but C separately","No -- deploy all three separately on different weekends","Yes -- but only if CAB re-approves the bundle"],a:1,ex:"Low-risk (A) and zero-risk (B) can safely bundle. But high-risk schema migration (C) should deploy separately: if C fails, rolling back would also roll back A and B unnecessarily. Release Management principle: don't let high-risk changes drag low-risk ones into a rollback. Isolate risk.",t:["Release Mgmt","Change Enablement","Risk Mgmt"]},

{sec:"UPI Change & Release",s:'<div class="st">Blue-Green Deployment of Settlement Engine</div>NPCI deploys Settlement Engine v3.0 using blue-green strategy. Green (v2.9) handles live traffic. Blue (v3.0) is deployed and tested with synthetic load. At cutover time (2 AM), traffic switches from Green to Blue. After 15 minutes on Blue, settlement totals show a Rs. 12 Cr discrepancy in test reconciliation.',q:"What is the correct action?",o:["Investigate the discrepancy while keeping traffic on Blue","Immediately switch traffic back to Green (v2.9)","Shut down both Green and Blue and halt settlement","Contact the banks to manually verify amounts"],a:1,ex:"A Rs. 12 Cr settlement discrepancy is unacceptable. Blue-green deployment's key advantage is instant rollback -- switch traffic back to Green immediately. This is why you keep Green warm. Investigating while Blue processes real settlements risks compounding the financial error.",t:["Deployment Mgmt","Service Continuity Mgmt"]},

// ========== SECTION 3: UPI PROBLEM & KNOWLEDGE (10) ==========
{sec:"UPI Problem & Knowledge",s:'<div class="st">Recurring HDFC Timeout Pattern</div>Problem Management analysis shows HDFC Bank UPI transactions timeout every Tuesday and Thursday between 2-3 PM. This has happened for 6 consecutive weeks. Each time, transactions auto-recover after ~45 minutes. HDFC claims their systems are fine.',q:"What is the Problem Management phase for this investigation?",o:["Error Control -- document the workaround","Problem Identification -- detecting the pattern is the first step","Problem Control -- analyzing root cause of the Tuesday/Thursday pattern","The problem is already resolved since it auto-recovers"],a:2,ex:"The problem is already identified (6-week pattern detected = Problem Identification done). Now we're in Problem Control: analyzing WHY it happens specifically Tue/Thu 2-3 PM. Likely cause: a scheduled batch job at HDFC. Error Control comes after root cause is confirmed. Auto-recovery doesn't mean the problem is solved.",t:["Problem Mgmt"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">Known Error: PSP App Crash on Android 14</div>A Known Error is documented: "UPI transactions fail on PSP apps running Android 14 when device battery is below 5%. Root cause: Android 14 kills background payment processes aggressively in battery saver mode." A workaround exists: disable battery saver before transacting.',q:"The Known Error exists. What is the NEXT step in Error Control?",o:["Close the Problem -- the workaround is sufficient","Evaluate permanent fix options and submit a Change Request","Wait for Android to fix their OS","Remove the workaround from the knowledge base"],a:1,ex:"Error Control's job after documenting a Known Error: evaluate fix options (PSP app code change to handle Android 14 battery saver gracefully), assess cost vs impact, and if justified, submit a Change Request for the permanent fix. A workaround is temporary, not final.",t:["Problem Mgmt","Change Enablement","Knowledge Mgmt"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">Post-Mortem: P1 Outage Root Cause</div>After a 90-minute P1 outage, the post-mortem reveals 5 contributing factors:<ul><li>A config change had no Change Request</li><li>Monitoring alert threshold was set too high</li><li>On-call engineer\'s phone number was outdated</li><li>Runbook for this service was 14 months stale</li><li>Rollback procedure was undocumented</li></ul>',q:"This post-mortem reveals failures in how many ITIL practices?",o:["Two -- Change and Incident","Three -- Change, Incident, and Knowledge","Four -- Change, Monitoring, Incident, and Knowledge","Five -- Change, Monitoring, Incident, Knowledge, and Deployment"],a:3,ex:"(1) Change Enablement: no CR for config change. (2) Monitoring & Event Mgmt: threshold too high. (3) Incident Mgmt: wrong on-call number. (4) Knowledge Mgmt: stale runbook. (5) Deployment Mgmt: no rollback docs. But the question says 'four' because Deployment's rollback gaps often fall under Knowledge. Accept 4 as the best fit.",t:["Change Enablement","Monitoring & Event Mgmt","Incident Mgmt","Knowledge Mgmt"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">Knowledge Gap: New L1 Engineers</div>NPCI onboards 8 new L1 NOC engineers. In their first week, average incident resolution time doubles because they don\'t know the standard operating procedures for common UPI alerts. Senior engineers are spending 3 hours/day mentoring instead of working on P1/P2 incidents.',q:"Which ITIL practice addresses this most directly?",o:["Incident Management -- train them on the incident process","Problem Management -- investigate why resolution is slow","Knowledge Management -- SOPs should be in the knowledge base","Workforce & Talent Management -- improve the hiring process"],a:2,ex:"If SOPs for common alerts existed in the Knowledge Base, new L1 engineers could self-serve instead of relying on senior staff. Knowledge Management's purpose: ensure the right knowledge is available to the right people at the right time. This also enables 'shift-left' -- L1 resolving what previously needed L2.",t:["Knowledge Mgmt","Continual Improvement"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">Proactive Problem Management</div>NPCI analyzes 6 months of incident data and finds: 34% of all P2 incidents are related to "bank node connectivity issues." The incidents span 40+ different banks, but the error patterns are similar. No Problem record exists for this category.',q:"What type of Problem Management is this?",o:["Reactive Problem Management -- responding to incidents","Proactive Problem Management -- identifying trends before a major outage","Error Control -- managing known errors","This is Continual Improvement, not Problem Management"],a:1,ex:"Analyzing historical incident data to identify patterns and potential causes BEFORE a major outage = Proactive Problem Management. Reactive would be investigating after a specific incident. This proactive analysis can prevent the next P1 caused by bank connectivity issues.",t:["Problem Mgmt","Measurement & Reporting"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">Knowledge Article Lifecycle</div>An L2 engineer writes a knowledge article: "How to resolve UPI Collect timeout errors." It contains a 12-step resolution procedure. After 6 months, NPCI upgrades the transaction engine and 4 of the 12 steps are now obsolete. An L1 engineer follows the article and makes the problem worse.',q:"What Knowledge Management process failed?",o:["Article creation -- it shouldn't have been written","Article approval -- L2 shouldn't write articles","Article review/retirement -- stale articles must be updated or retired","Incident Management -- L1 should have known the article was old"],a:2,ex:"Knowledge articles have a lifecycle: Draft > Review > Published > Retired. After the transaction engine upgrade, the article should have been reviewed and updated (or retired). A scheduled review cycle or change-triggered review would prevent stale knowledge. The failure is in the review/retirement process.",t:["Knowledge Mgmt","Continual Improvement"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">Cross-Bank Problem Investigation</div>Problem Management discovers that 3 different banks (HDFC, ICICI, SBI) all experience UPI failures when their batch processing jobs run. Each bank raised separate incidents. The root cause is the same: batch jobs consume all database connections, starving the UPI service.',q:"What should the Problem record capture?",o:["Only the HDFC incident -- it was reported first","Root cause, all three bank incidents linked, and a workaround","The names of the DBAs at each bank","A Change Request to fix all three banks"],a:1,ex:"The Problem record links all three incidents (showing impact), documents the shared root cause (batch jobs exhaust DB connections), and provides a workaround (connection pool reservation for UPI). This is the core of Problem Control: one root cause, multiple manifestations, one coordinated fix path.",t:["Problem Mgmt","CMDB"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">RCA: 5 Whys for Transaction Failure</div>Incident: UPI QR code payments failed for 20 minutes. RCA using 5 Whys:<ul><li>Why did QR payments fail? -- QR service couldn\'t reach the auth service</li><li>Why couldn\'t it reach auth? -- DNS resolution failed</li><li>Why did DNS fail? -- DNS cache expired and the primary DNS server was down</li><li>Why was DNS server down? -- A storage disk filled up</li><li>Why did the disk fill up? -- Log rotation was disabled 3 months ago during a change</li></ul>',q:"The root cause is at which level?",o:["Level 1 -- QR service couldn't reach auth","Level 3 -- DNS server was down","Level 5 -- log rotation was disabled during a change","All 5 levels are equally the root cause"],a:2,ex:"The 5 Whys technique drills to the deepest actionable root cause. Level 5 reveals that a change 3 months ago disabled log rotation and nobody restored it. This is the root cause: an incomplete change (Change Enablement gap) + no monitoring for disk usage (Monitoring gap). Fixing Level 5 prevents recurrence.",t:["Problem Mgmt","Change Enablement","Monitoring & Event Mgmt"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">KEDB Usage in Live Incident</div>During a P1 incident, the L2 engineer searches the Known Error Database and finds a matching entry: "Oracle connection pool exhaustion under high load -- Known Error KE-0042." The workaround says: restart the connection pool manager service.',q:"What is the value of the KEDB in this scenario?",o:["It eliminates the need for Problem Management","It provides a faster incident resolution path","It means the incident shouldn't have been logged","It replaces the need for a permanent fix"],a:1,ex:"The KEDB enables faster incident resolution: instead of investigating from scratch, the L2 engineer applies a known workaround immediately. Resolution time drops from potentially hours to minutes. The KEDB doesn't replace the need for a permanent fix -- it bridges the gap until one is implemented.",t:["Problem Mgmt","Knowledge Mgmt","Incident Mgmt"]},

{sec:"UPI Problem & Knowledge",s:'<div class="st">Trend Analysis: Weekend P1s</div>Data shows 73% of P1 incidents at NPCI occur between Friday 5 PM and Monday 9 AM. Root causes: 68% are related to changes deployed on Fridays, 22% are due to skeleton weekend NOC staffing, 10% are random.',q:"Which Continual Improvement action has the highest impact?",o:["Ban all Friday deployments permanently","Improve pre-deployment testing and Friday change review rigor","Add more L1 staff to the weekend NOC","Move all deployments to Monday morning"],a:1,ex:"68% of weekend P1s come from Friday changes -- but banning Friday deploys treats the symptom. The root cause is inadequate testing/review before deployment. Strengthening pre-deployment validation (Service Validation & Testing) addresses the actual gap. 'Optimize and automate' -- fix the process, don't just avoid the day.",t:["Continual Improvement","Service Validation & Testing","Change Enablement"]},

// ========== SECTION 4: UPI SLA, CMDB & SERVICE CATALOG (10) ==========
{sec:"UPI SLA & CMDB",s:'<div class="st">SLA Calculation Dispute</div>NPCI\'s SLA with PhonePe states: "99.95% UPI transaction success rate measured monthly." In September, NPCI reports 99.96% (SLA met). PhonePe disputes: "You excluded 2 hours of planned maintenance downtime from the calculation. Including it, the rate is 99.91% -- SLA breached."',q:"Who is correct, and what should have been done?",o:["NPCI is correct -- planned downtime is always excluded","PhonePe is correct -- all downtime should count","The SLA definition should explicitly state whether planned maintenance is excluded or included","Neither is correct -- SLA should measure availability, not success rate"],a:2,ex:"The real failure is ambiguous SLA definition. Service Level Management must explicitly state: what's measured, how it's calculated, what's excluded, and what's included. Ambiguity leads to disputes. The SLA document should have a clear 'Exclusions' section agreed by both parties.",t:["Service Level Mgmt"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">CMDB: Discovering Shadow Infrastructure</div>During a security audit, NPCI discovers 12 EC2 instances running in their AWS account that are not registered in the CMDB. Three of these instances are running production UPI services. Nobody knows who launched them or what they do.',q:"This reveals a failure in which practice?",o:["Incident Management -- incidents should have caught this","Service Configuration Management -- all CIs must be tracked","Change Enablement -- changes should update the CMDB","Both Service Configuration Management and Change Enablement"],a:3,ex:"Two practices failed: Service Configuration Management (should have auto-discovery scanning for new CIs) AND Change Enablement (launching production instances should require a Change Request that updates the CMDB). If either had worked, the shadow infrastructure would have been caught.",t:["Service Configuration Mgmt","Change Enablement","CMDB"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">Impact Analysis: Database Server Failure</div>The Oracle RAC primary node serving UPI transaction data shows hardware pre-failure warnings. NPCI has 48 hours before expected failure. They need to understand the blast radius. The CMDB shows this server has 14 dependent CIs.',q:"What CMDB capability enables the 48-hour preparation?",o:["CI attribute tracking (server specs and warranty)","CI relationship/dependency mapping (what depends on this server)","CI lifecycle status (operational vs retired)","CI financial information (replacement cost)"],a:1,ex:"Dependency mapping shows the 14 CIs (applications, services, databases) that will be affected when this server fails. This enables targeted preparation: fail over dependent services, notify affected teams, stage the replacement. Without dependency mapping, you'd discover the blast radius AFTER the failure.",t:["CMDB","Service Configuration Mgmt","Availability Mgmt"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">SLA Breach Escalation Chain</div>A P1 SLA has the following escalation triggers:<ul><li>50% elapsed: email to assignment group manager</li><li>75% elapsed: reassign to L3 + email VP Engineering</li><li>100% breached: email CTO + create executive escalation task</li></ul>The P1 SLA target is 30 minutes. At the 22-minute mark, the incident is still unresolved.',q:"What should the system automatically do at 22 minutes?",o:["Nothing -- only trigger at 50% (15 min) and 100% (30 min)","Trigger the 75% escalation: reassign to L3, notify VP","Close the incident to avoid SLA breach","Extend the SLA target to 60 minutes"],a:1,ex:"22 minutes = 73% of 30 minutes, which rounds to the 75% threshold. The system should auto-escalate: reassign to L3 for expertise and notify VP Engineering for visibility. SLA triggers at percentage thresholds are automated actions -- no human should need to manually escalate at 22 minutes.",t:["Service Level Mgmt","Incident Mgmt"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">Service Catalog: Bank TPS Limit Increase</div>Kotak Bank requests a TPS (transactions per second) limit increase from 500 to 1,000. This is a routine, well-documented request that NPCI processes about 10 times per month.',q:"How should this be handled in ITSM?",o:["As a P2 Incident -- the current limit is blocking the bank","As a Normal Change Request with CAB approval","As a Service Request via the Service Catalog","As a Problem -- investigate why the limit is too low"],a:2,ex:"A TPS limit increase is a pre-defined, routine request with known fulfillment steps. It goes through the Service Catalog as a Service Request: the bank submits it, it gets manager approval, the platform team fulfills it. It's not an incident (nothing is broken) or a full change (it's routine and low-risk).",t:["Service Request Mgmt","Service Catalog Mgmt"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">CMDB Relationship: UPI Payment Flow</div>A UPI payment traverses: Mobile App > PSP Server > NPCI Switch > Beneficiary Bank > NPCI Settlement > Clearing System. Each component is a CI in the CMDB.',q:"What type of CI relationship best models this transaction flow?",o:["Contains/Contained by (parent-child)","Depends on/Used by (dependency chain)","Connected to (network connectivity)","Runs on/Hosted on (infrastructure)"],a:1,ex:"The UPI payment flow is a dependency chain: Mobile App depends on PSP Server, which depends on NPCI Switch, which depends on Beneficiary Bank, etc. 'Depends on/Used by' correctly models this. 'Contains' is for parent-child (rack contains server). 'Runs on' is for platform (app runs on server).",t:["Service Configuration Mgmt","CMDB"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">SLA: Business Hours vs 24x7</div>NPCI has two SLA schedules:<ul><li>P1 incidents: 24x7 (UPI never sleeps)</li><li>Service Requests: Business Hours (Mon-Fri 9-6)</li></ul>A bank submits a service request (new API credentials) at 6 PM Friday. The SLA target is 4 business hours.',q:"When does the SLA for this service request expire?",o:["10 PM Friday (4 hours later)","11 AM Monday (4 business hours later)","6 PM Monday (next full business day)","Immediately -- it was submitted after hours"],a:1,ex:"Submitted at 6 PM Friday = 0 business hours counted (outside 9-6 window). Saturday/Sunday = 0 hours. Monday 9 AM-1 PM = 4 business hours. SLA expires at 1 PM Monday. This is why SLA schedules matter -- a '4-hour' SLA doesn't mean 4 clock hours when business hours apply.",t:["Service Level Mgmt"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">Service Catalog: Self-Service Portal Adoption</div>NPCI builds a self-service portal for member banks. Available catalog items: API credential requests, TPS limit changes, test environment provisioning, settlement report access. After 3 months, only 12% of banks use the portal. The rest still email or call the NPCI service desk.',q:"Applying ITIL 4 principles, what should NPCI investigate first?",o:["Force banks to use the portal by disabling email/phone","Add more catalog items to make the portal more useful","Investigate why banks prefer calling -- the portal may not meet their needs","Hire more service desk staff to handle the call volume"],a:2,ex:"'Focus on value': if banks don't use the portal, it's not delivering value FROM THEIR PERSPECTIVE. Before forcing adoption or adding features, understand the gap: Is it hard to use? Missing key items? Slower than calling? Trust issues? 'Start where you are' -- understand the current behavior before changing it.",t:["Service Catalog Mgmt","Focus on Value","Start Where You Are"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">DR Drill: RTO Breach</div>NPCI conducts a quarterly DR drill. Scenario: Mumbai data center complete failure, failover to Chennai DR site. Results:<ul><li>RTO target: 15 minutes</li><li>Actual failover time: 38 minutes</li><li>RPO target: 0 (zero data loss)</li><li>Actual data loss: 0 transactions lost</li></ul>',q:"RPO was met but RTO was breached. What should happen?",o:["The drill passed -- RPO is more important","Log a Problem to investigate and improve failover to meet RTO","Change the RTO target to 45 minutes since that's realistic","Report the DR drill as successful to management"],a:1,ex:"Meeting RPO but failing RTO means data integrity is fine but service restoration is too slow. A Problem record investigates: why 38 minutes instead of 15? What can be automated or parallelized? Changing the RTO to 45 minutes requires business agreement and RBI approval -- you can't just lower the bar.",t:["Service Continuity Mgmt","Problem Mgmt","Continual Improvement"]},

{sec:"UPI SLA & CMDB",s:'<div class="st">Multi-Layer SLA Architecture</div>NPCI has an SLA with PhonePe promising 99.95% success rate. To deliver this, NPCI has internal OLAs:<ul><li>Platform team: 99.97% transaction engine uptime</li><li>DBA team: 99.99% database availability</li><li>Network team: 99.99% network availability</li></ul>And an external UC with AWS promising 99.99% compute uptime.',q:"Why are the OLA/UC targets higher than the customer SLA?",o:["It's a mistake -- they should all be the same","Internal targets must be higher because failures at any layer compound into the customer SLA","Higher targets motivate internal teams to work harder","RBI requires internal targets to exceed external SLAs"],a:1,ex:"If each internal layer has only 99.95% uptime, the combined probability of ALL layers being up is 99.95% x 99.95% x 99.95% = ~99.85% -- below the customer SLA. Internal OLAs must be higher so that the compounded end-to-end availability meets or exceeds the customer-facing SLA.",t:["Service Level Mgmt","Availability Mgmt"]},

// ========== SECTION 5: UPI GOVERNANCE, DIMENSIONS & CSI (10) ==========
{sec:"UPI Governance & CSI",s:'<div class="st">RBI Audit: Compliance Gap</div>RBI conducts an audit of NPCI\'s UPI operations. Findings:<ul><li>23% of production changes in the last quarter had no Change Request</li><li>CMDB accuracy: 64% (below 95% target)</li><li>P1 incident post-mortem completion: 45% (target: 100%)</li><li>Knowledge base article review rate: 12% within SLA</li></ul>',q:"Which ITIL 4 governance function failed?",o:["The Service Desk","The CAB","The governing body's Evaluate-Direct-Monitor cycle","The Continual Improvement Register"],a:2,ex:"The governing body's three functions all failed: Evaluate (should have assessed these metrics quarterly), Direct (should have mandated compliance targets), Monitor (should have caught 23% unauthorized changes and 64% CMDB accuracy before the auditor did). This is systemic governance failure, not individual practice failure.",t:["Governance","Continual Improvement"]},

{sec:"UPI Governance & CSI",s:'<div class="st">Four Dimensions: UPI International Launch</div>NPCI is launching UPI for international remittances (UPI-Global). This requires:<ul><li>New staff trained in forex regulations and SWIFT integration</li><li>New technology: multi-currency transaction engine + SWIFT connector</li><li>New partners: correspondent banks in 5 countries</li><li>New processes: cross-border settlement, FX rate management, compliance checks</li></ul>',q:"This initiative touches how many of ITIL 4's four dimensions?",o:["One -- Information and Technology (new tech)","Two -- Technology and Partners","Three -- all except Organizations and People","All four dimensions"],a:3,ex:"Organizations & People (new skills: forex, SWIFT), Information & Technology (multi-currency engine, SWIFT connector), Partners & Suppliers (correspondent banks in 5 countries), Value Streams & Processes (cross-border settlement, FX management). Any new service initiative touches all four dimensions.",t:["Four Dimensions"]},

{sec:"UPI Governance & CSI",s:'<div class="st">Continual Improvement: MTTR Reduction</div>NPCI\'s P1 MTTR (Mean Time To Resolve) is 28 minutes. Industry benchmark for payment systems is 12 minutes. The VP Engineering wants to reach 15 minutes within 6 months.',q:"Using the Continual Improvement model, what is the correct FIRST step?",o:["Jump straight to action -- start automating incident response","Where are we now? -- baseline the current 28-minute MTTR","How do we get there? -- plan the improvement actions","Where do we want to be? -- define the 15-minute target"],a:0,ex:"Trick question: 'What is the vision?' is always step 1 -- but the vision (reliable payment infrastructure) is already established. In practice, the FIRST actionable step for this specific improvement is 'Where are we now?' -- baseline the 28-minute MTTR, break it down by phase (detection, triage, diagnosis, fix, verify), and identify the biggest bottleneck.",t:["Continual Improvement"]},

{sec:"UPI Governance & CSI",s:'<div class="st">DevOps vs ITIL at NPCI</div>NPCI\'s development team wants to deploy 10 times per day using CI/CD. The operations team insists every deployment goes through a full Change Request with CAB approval (2-day turnaround). Developers start deploying without Change Requests, causing 3 untracked outages.',q:"How should this be resolved using ITIL 4?",o:["Enforce full CAB for every deployment -- rules are rules","Eliminate Change Enablement for developers entirely","Create a pipeline-integrated Standard Change model with automated quality gates","Let developers and operations figure it out themselves"],a:2,ex:"ITIL 4 supports DevOps: 'Optimize and automate'. Create a Standard Change template for CI/CD deployments where the pipeline itself IS the change control: automated tests, security scans, and canary metrics serve as risk assessment. High-risk changes (DB schema, infra) still go through Normal Change. Right-size governance to risk.",t:["Change Enablement","Optimize & Automate"]},

{sec:"UPI Governance & CSI",s:'<div class="st">Shift-Left at NPCI NOC</div>Analysis shows NPCI\'s L1 NOC escalates 78% of incidents to L2 because L1 lacks resolution procedures. L2 resolves 60% of escalated incidents using the same 15 procedures every time. Average L1 > L2 escalation adds 12 minutes to resolution.',q:"What Continual Improvement action would reduce MTTR the most?",o:["Hire more L2 engineers to handle the volume","Document the 15 L2 procedures as L1 knowledge articles","Replace L1 with an AI chatbot","Eliminate the L1 tier entirely"],a:1,ex:"Shift-left: document L2's 15 recurring procedures as Knowledge Base articles for L1. If L1 can resolve 60% of what they currently escalate, escalation drops from 78% to ~31%, and each of those incidents saves 12 minutes. This is 'Optimize and automate' + Knowledge Management working together.",t:["Knowledge Mgmt","Continual Improvement","Incident Mgmt"]},

{sec:"UPI Governance & CSI",s:'<div class="st">Measuring Value: UPI Service Metrics</div>NPCI\'s ITSM dashboard shows:<ul><li>Incidents closed/month: 1,847 (target: >1,500) -- GREEN</li><li>Change success rate: 97.2% (target: >95%) -- GREEN</li><li>SLA compliance: 99.1% (target: >98%) -- GREEN</li></ul>But:<ul><li>Customer satisfaction (banks): 52% (down from 71%)</li><li>Repeat incident rate: 41%</li><li>Mean time between failures: decreasing trend</li></ul>',q:"What is fundamentally wrong with how NPCI measures ITSM success?",o:["Nothing -- all KPIs are green, ITSM is successful","Metrics measure activity (volume, speed) not value (satisfaction, stability)","They need to add more KPIs to the dashboard","The targets are set too low"],a:1,ex:"Watermelon Effect: green dashboards hide red reality. Closing 1,847 incidents is meaningless if 41% are repeats (Problem Management failing). 97.2% change success looks great but MTBF is decreasing (changes are degrading service). 'Focus on value' demands outcome metrics: customer satisfaction, repeat rate, service stability trend -- not just activity counters.",t:["Measurement & Reporting","Focus on Value","Continual Improvement"]},

{sec:"UPI Governance & CSI",s:'<div class="st">Supplier Management: Cloud Provider SLA Miss</div>NPCI\'s cloud provider (AWS) reports 99.95% compute uptime for the month -- meeting their UC target of 99.95%. However, NPCI experienced 3 micro-outages (each 2-3 minutes) that don\'t breach the monthly percentage but caused 45,000 failed UPI transactions.',q:"What does this reveal about the UC with the cloud provider?",o:["The UC is adequate -- AWS met their target","The UC measures the wrong thing -- monthly % misses micro-outages","NPCI should switch cloud providers immediately","Micro-outages are acceptable in any cloud environment"],a:1,ex:"Monthly uptime percentage hides micro-outages that cause significant transaction failures. The UC should include: maximum individual outage duration (e.g., no single outage >30 seconds), maximum outage frequency (e.g., <2 per month), and transaction impact thresholds -- not just monthly aggregate availability.",t:["Supplier Mgmt","Service Level Mgmt"]},

{sec:"UPI Governance & CSI",s:'<div class="st">Organizational Change: NOC Restructuring</div>NPCI reorganizes their NOC from function-based teams (Network, Database, Application) to service-based teams (UPI Payments, Settlement, Dispute Resolution). The restructuring causes: confusion about responsibilities, incidents falling through cracks, and a 40% increase in MTTR for the first month.',q:"Which practice should have been applied BEFORE the restructuring?",o:["Incident Management -- to handle the expected increase","Problem Management -- to prevent the confusion","Organizational Change Management -- to manage the people side","Change Enablement -- to approve the restructuring as a change"],a:2,ex:"Organizational Change Management addresses the people/culture side of change: communication, training, role clarity, phased transition, and support during adjustment. The restructuring is a good idea, but without OCM, people don't know their new responsibilities, causing the very chaos the restructuring aimed to fix.",t:["Org Change Mgmt","Workforce & Talent Mgmt"]},

{sec:"UPI Governance & CSI",s:'<div class="st">CIR Prioritization</div>NPCI\'s Continual Improvement Register has 34 improvement items. The top 5 by estimated impact:<ul><li>CI-01: Automate incident categorization (saves 200 hrs/month)</li><li>CI-02: Implement auto-scaling for transaction engine (prevents Diwali-type overloads)</li><li>CI-03: Add real-time fraud ML model (reduces fraud by 60%)</li><li>CI-04: Redesign the bank onboarding portal (reduces onboarding from 30 to 7 days)</li><li>CI-05: Update all stale knowledge articles (180 articles overdue)</li></ul>Budget allows only 2 initiatives this quarter.',q:"Applying 'Focus on value', which TWO should be prioritized?",o:["CI-01 and CI-05 -- operational efficiency","CI-02 and CI-03 -- risk reduction and prevention","CI-03 and CI-04 -- customer-facing improvements","CI-01 and CI-04 -- highest time savings"],a:1,ex:"CI-02 prevents a predictable, high-impact event (Diwali overload = potential P1 for 400+ banks). CI-03 reduces fraud by 60% (financial and reputational impact). Both address risk prevention with the highest value-to-cost ratio. CI-01/CI-05 improve efficiency but don't prevent major incidents. 'Focus on value' means prioritizing outcomes over activities.",t:["Continual Improvement","Focus on Value","Risk Mgmt"]},

{sec:"UPI Governance & CSI",s:'<div class="st">End-to-End Value Stream: UPI Dispute Resolution</div>Current dispute resolution process at NPCI takes 15 business days. Steps: bank reports dispute (Day 1) > NPCI logs ticket (Day 2) > manual investigation (Day 3-8) > request info from counterparty bank (Day 9-11) > decision (Day 12-13) > refund processing (Day 14-15). RBI mandate: resolve within 5 business days by next quarter.',q:"Applying the guiding principles, how should NPCI approach this?",o:["Hire 3x more dispute resolution staff","Automate the entire process end-to-end immediately","Optimize the process first (remove waste), then automate the optimized steps","Replace the manual process with AI-only decisions"],a:2,ex:"'Optimize and automate': first map the value stream and remove waste (why does logging take a full day? Can investigation and counterparty request happen in parallel instead of sequentially?). Optimize from 15 to ~7 days by removing delays. THEN automate the optimized steps (auto-log, auto-request counterparty data, auto-decision for simple disputes) to reach 5 days. Automating the current broken 15-day process just gives you broken results faster.",t:["Continual Improvement","Optimize & Automate","Value Streams & Processes"]},
];

const T=Q.length;
let I=0,A={},F={},started=false,done=false,ti=null,ts=0;
function nA(){return Object.keys(A).length}
function $(id){return document.getElementById(id)}

function R(){if(!started)return RW();if(done)return RR();RQ()}

function RW(){
$('hs').textContent='--';$('hp').textContent='--';$('ht').textContent='75:00';$('pb').style.width='0%';
$('app').innerHTML=`<div class="wl fi">
<h2>ITIL 4 x NPCI UPI Scenarios</h2>
<p class="sub">50 production-realistic scenarios from India's Unified Payments Interface -- the world's largest real-time payment system.</p>
<div class="ei">
<b>Assessment Format:</b><br>
&#8226; <b>${T} scenario-based questions</b> -- every question has a real UPI production context<br>
&#8226; <b>75-minute time limit</b><br>
&#8226; <b>70% pass mark</b> (${Math.ceil(T*0.7)} of ${T} correct)<br>
&#8226; Covers: Incidents, Changes, Releases, Problems, Knowledge, SLAs, CMDB, Governance, CSI<br>
&#8226; All scenarios based on NPCI/UPI operations patterns (14B+ transactions/month, 400+ banks)
</div>
<div class="sg">
<div class="s"><div class="n">${T}</div><div class="l">Scenarios</div></div>
<div class="s"><div class="n">5</div><div class="l">Sections</div></div>
<div class="s"><div class="n">75</div><div class="l">Minutes</div></div>
<div class="s"><div class="n">70%</div><div class="l">Pass Mark</div></div>
</div>
<h3 style="text-align:left;margin:1rem 0 .4rem;color:var(--p);font-size:.9rem">Sections:</h3>
<div style="text-align:left;font-size:.85rem">
<div style="padding:.4rem 0;border-bottom:1px solid var(--bd)"><b>1.</b> UPI Incident Management (10 Qs)</div>
<div style="padding:.4rem 0;border-bottom:1px solid var(--bd)"><b>2.</b> UPI Change & Release Management (10 Qs)</div>
<div style="padding:.4rem 0;border-bottom:1px solid var(--bd)"><b>3.</b> UPI Problem & Knowledge Management (10 Qs)</div>
<div style="padding:.4rem 0;border-bottom:1px solid var(--bd)"><b>4.</b> UPI SLA, CMDB & Service Catalog (10 Qs)</div>
<div style="padding:.4rem 0;border-bottom:1px solid var(--bd)"><b>5.</b> UPI Governance, Dimensions & CSI (10 Qs)</div>
</div>
<div style="display:flex;gap:.75rem;justify-content:center;margin-top:1.5rem">
<button class="btn bp" onclick="ST()" style="padding:.8rem 2.25rem;font-size:.95rem">Begin Assessment</button>
</div>
<p style="margin-top:.7rem;font-size:.68rem;color:var(--tx2)">Keyboard: A/B/C/D to answer, arrows to navigate, F to flag for review.</p>
</div>`}

function RQ(){
const q=Q[I],sel=A[I],dn=sel!==undefined,ok=sel===q.a,L=['A','B','C','D'];
$('hs').textContent=q.sec;$('hp').textContent='Q '+(I+1)+'/'+T;$('pb').style.width=(nA()/T*100)+'%';
const tl=Math.max(0,4500-ts);const tm=Math.floor(tl/60),tss=tl%60;
const te=$('ht');te.textContent=String(tm).padStart(2,'0')+':'+String(tss).padStart(2,'0');

const sc=q.s?'<div class="scn">'+q.s+'</div>':'';
const opts=q.o.map((o,i)=>{let c='op',ic='';if(dn){c+=' dis';if(i===q.a){c+=' ok';ic='<span class="oi">&#10004;</span>'}else if(i===sel&&i!==q.a){c+=' no';ic='<span class="oi">&#10008;</span>'}}return'<div class="'+c+'" onclick="PK('+i+')"><div class="ol">'+L[i]+'</div><div class="ot">'+o+'</div>'+ic+'</div>'}).join('');
let ex='';if(dn){const tags=q.t?'<div class="tags">'+q.t.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>':'';ex='<div class="exp '+(ok?'oe':'ne')+'"><b>'+(ok?'&#10004; Correct!':'&#10008; Incorrect')+'</b>'+(!ok?'Correct answer: <b>'+L[q.a]+'. '+q.o[q.a]+'</b><br><br>':'')+q.ex+tags+'</div>'}
const dots=Q.map((_,i)=>{let c='d';if(i===I)c+=' cur';else if(A[i]!==undefined)c+=A[i]===Q[i].a?' aok':' ano';if(F[i])c+=' fld';return'<div class="'+c+'" onclick="GO('+i+')" title="Q'+(i+1)+(F[i]?' [flagged]':'')+'"></div>'}).join('');
const fl=F[I];
$('app').innerHTML='<div class="qc fi"><div class="qm"><span class="qtag">'+q.sec+'</span><span class="qn">Q'+(I+1)+' of '+T+'</span></div>'+sc+'<div class="qt">'+q.q+'</div><div class="opts">'+opts+'</div>'+ex+'<div class="fb"><button class="fbtn'+(fl?' fl':'')+'" onclick="TF()">&#9873; '+(fl?'Flagged':'Flag')+'</button><span style="flex:1"></span><span style="font-size:.65rem;color:var(--tx2)">'+nA()+'/'+T+' answered'+(Object.keys(F).length>0?' &middot; '+Object.keys(F).length+' flagged':'')+'</span></div></div><div class="nv"><button class="btn bg" onclick="GO('+(I-1)+')" '+(I===0?'disabled':'')+'>&#8592;</button><div class="dots">'+dots+'</div>'+(dn&&I<T-1?'<button class="btn bp" onclick="GO('+(I+1)+')">Next &#8594;</button>':dn&&I===T-1?'<button class="btn ba" onclick="FN()">Submit</button>':'<button class="btn bg" onclick="GO('+(I+1)+')" '+(I>=T-1?'disabled':'')+'>&#8594;</button>')+'</div>'+(nA()===T?'<div style="text-align:center;margin-top:.5rem"><button class="btn ba" onclick="FN()" style="font-size:.78rem;padding:.4rem 1rem">Submit ('+nA()+'/'+T+')</button></div>':'')}

function RR(){
clearInterval(ti);let tc=0;Q.forEach((q,i)=>{if(A[i]===q.a)tc++});
const p=Math.round(tc/T*100),pass=p>=70;
let gc,gt;if(p>=90){gc='ge';gt='Outstanding -- UPI ITSM Expert'}else if(p>=70){gc='gg';gt='Pass -- Strong UPI Operations Knowledge'}else if(p>=50){gc='ga';gt='Below Pass -- Review Weak Sections'}else{gc='gp';gt='Needs Study -- Revisit ITSM Fundamentals'}
const m=Math.floor(ts/60),se=ts%60;$('hs').textContent='Complete';$('hp').textContent=tc+'/'+T;$('ht').textContent=m+'m '+se+'s';$('pb').style.width='100%';
const sm={};Q.forEach((q,i)=>{if(!sm[q.sec])sm[q.sec]={c:0,t:0};sm[q.sec].t++;if(A[i]===q.a)sm[q.sec].c++});
function bc(r){return r>=.9?'var(--ok)':r>=.7?'#1565c0':r>=.5?'var(--ac)':'var(--no)'}
$('app').innerHTML='<div class="res fi"><h2>Assessment Complete</h2><p style="color:var(--tx2);font-size:.88rem">'+gt+'</p><div class="sc '+gc+'"><div class="pn">'+p+'<span class="ps">%</span></div><div class="lb">'+tc+' of '+T+'</div></div><div style="display:flex;justify-content:center;gap:1.25rem;margin:.6rem 0;flex-wrap:wrap;font-size:.85rem"><div><b>Time:</b> '+m+'m '+se+'s</div><div><b>Correct:</b> '+tc+'</div><div><b>Wrong:</b> '+(T-tc)+'</div><div><b>Result:</b> <span style="color:'+(pass?'var(--ok)':'var(--no)')+';font-weight:700">'+(pass?'PASS':'FAIL')+'</span></div></div><h3 style="text-align:left;margin:.85rem 0 .35rem;color:var(--p);font-size:.9rem">Section Breakdown</h3><div class="ss">'+Object.entries(sm).map(([n,d])=>{const r=d.c/d.t;return'<div class="ssc"><h4>'+n+'</h4><div class="sv">'+d.c+'/'+d.t+' <span style="font-size:.75rem;color:var(--tx2)">('+Math.round(r*100)+'%)</span></div><div class="bb"><div class="bf" style="width:'+r*100+'%;background:'+bc(r)+'"></div></div></div>'}).join('')+'</div><h3 style="text-align:left;margin:.85rem 0 .35rem;color:var(--p);font-size:.9rem">Review</h3><div style="text-align:left;font-size:.85rem">'+Object.entries(sm).map(([n,d])=>{const r=d.c/d.t;return r<.7?'<p style="padding:.3rem 0;border-bottom:1px solid var(--bd)"><span style="color:var(--no);font-weight:600">Needs review:</span> '+n+' ('+Math.round(r*100)+'%)</p>':''}).join('')+'</div><div style="display:flex;gap:.65rem;justify-content:center;margin-top:1rem;flex-wrap:wrap"><button class="btn bo" onclick="RV()">Review Answers</button><button class="btn bp" onclick="RS()">Retake</button></div></div>'}

function ST(){started=true;ts=0;ti=setInterval(()=>{ts++;const l=Math.max(0,4500-ts);if(l<=0){clearInterval(ti);FN()}const m=Math.floor(l/60),s=l%60;const e=$('ht');e.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(l<=300)e.className='timer td';else if(l<=600)e.className='timer tw';else e.className='timer'},1000);R()}
function PK(i){if(A[I]!==undefined)return;A[I]=i;R()}
function GO(i){if(i>=0&&i<T){I=i;R();window.scrollTo({top:0,behavior:'smooth'})}}
function TF(){if(F[I])delete F[I];else F[I]=true;R()}
function FN(){done=true;R();window.scrollTo({top:0,behavior:'smooth'})}
function RV(){done=false;I=0;R();window.scrollTo({top:0,behavior:'smooth'})}
function RS(){A={};F={};I=0;started=false;done=false;ts=0;clearInterval(ti);R();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('keydown',e=>{if(!started||done)return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();GO(I+1)}if(e.key==='ArrowLeft'){e.preventDefault();GO(I-1)}if('1aA'.includes(e.key))PK(0);if('2bB'.includes(e.key))PK(1);if('3cC'.includes(e.key))PK(2);if('4dD'.includes(e.key))PK(3);if(e.key==='f'||e.key==='F')TF()});
R();
</script>
