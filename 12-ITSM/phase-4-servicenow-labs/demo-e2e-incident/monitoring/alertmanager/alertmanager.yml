global:
  resolve_timeout: 2m

route:
  receiver: 'snow-bridge'
  group_by: ['alertname', 'application']
  group_wait: 15s
  group_interval: 30s
  repeat_interval: 5m

  routes:
    # Critical alerts - send immediately
    - match:
        severity: critical
      receiver: 'snow-bridge'
      group_wait: 10s
      repeat_interval: 2m

    # Warning alerts
    - match:
        severity: warning
      receiver: 'snow-bridge'
      group_wait: 30s

receivers:
  - name: 'snow-bridge'
    webhook_configs:
      - url: 'http://snow-bridge:5005/webhook'
        send_resolved: true
