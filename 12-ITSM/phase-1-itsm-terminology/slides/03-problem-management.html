<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Problem Management · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Problem Management", "tag": "Prevent recurrence", "hook": "The payment is working again. Why did it fail?", "slides": [{"title": "12:22 PM · Payments work. Why did they fail?", "lead": "The Axis incident was restored in 19 minutes by routing traffic through a backup node. But the team finds three similar incidents from last month. The workaround has restored service; the underlying issue remains.", "items": [["INC-0047", "Customer impact ended at 12:22 PM."], ["PRB-0012", "Link this incident and three earlier incidents."], ["Next question", "What makes the primary node stop responding?"]], "kind": "story", "notes": "", "quote": "“We fixed the incident. Why does it keep happening?”", "source_heading": "UPI Example: Continuing from Section 2"}, {"title": "PRB-20260921-0012 · the investigation", "lead": "A problem is a cause or potential cause of incidents; this record tracks the unresolved investigation.", "items": [["Related incidents", "INC-20260921-0047 plus three similar incidents from last month."], ["Affected service", "UPI Transaction Processing."], ["Status & purpose", "Under Investigation · understand causes and reduce recurrence."]], "kind": "catalog", "notes": ""}, {"title": "Five whys: follow the Axis evidence", "lead": "Work backward from the failed payment to the technical and coordination gaps.", "items": [["Payments fail", "The Axis bank-facing node stops responding."], ["Node stalls", "The connection pool reaches zero available connections."], ["Pool fills", "Core banking responses take 8 s instead of the normal 200 ms."], ["Why slower?", "Axis deployed an upgrade at 11:45 AM."], ["Why no warning?", "No effective Axis–NPCI change-notification process exists."]], "kind": "flow", "notes": "Keep 11:45 AM, 12:03 PM and 12:22 PM in order: upgrade, detected impact, restoration. This is the fictional evidence chain in the notes; in real RCA each link needs validation.", "visual": "whys", "takeaway": "Validate every causal link. The final “why” is a hypothesis to test, not a reason to blame."}, {"title": "Look beyond the last person who touched it", "lead": "Separate technical failure mechanisms from process weaknesses.", "items": [["Technical contributor", "No effective protection against slow downstream responses."], ["Process contributor", "The upgrade was not coordinated across organizations."], ["Evidence", "Correlate deployment history, latency, pool usage and logs."]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "KE-20260921-0012 · capture the workaround", "lead": "The analysis is available, but permanent remediation is still pending.", "items": [["Known condition", "Axis primary responses slow down and exhaust the connection pool."], ["Workaround", "Use the backup node if primary latency exceeds 2 seconds."], ["Permanent fix proposed", "Inter-organization change-notification API plus an automatic circuit breaker."]], "kind": "catalog", "notes": ""}, {"title": "Reactive with Axis. Proactive with SBI.", "lead": "Both examples from the notes use patterns to choose an investigation.", "items": [["Reactive", "“Axis failed three times this month.” Investigate repeated incidents."], ["Proactive", "“SBI node latency is rising 5% weekly.” Investigate before an outage."]], "kind": "cards", "notes": ""}, {"title": "Close the loop with change and knowledge", "lead": "The investigation should lead to accountable action.", "items": [["Change", "Implement and validate remediation."], ["Knowledge", "Publish the workaround and diagnostic evidence."], ["Review", "Check whether recurrence or impact actually falls."]], "kind": "cards", "notes": ""}, {"title": "We know why. How do we introduce the fix?", "lead": "The Axis case has a known error, a workaround and proposed technical and coordination improvements.", "items": [["This chapter", "KE-20260921-0012 makes the current learning usable."], ["Next · Change", "Assess, authorize, implement and verify the remediation."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "Axis responds in 8 seconds instead of 200 ms after its 11:45 AM upgrade. Which technical and coordination gaps should the RCA examine?", "answer": "Examine how slow responses exhausted the connection pool, why failure isolation was insufficient, and why the change was not coordinated with NPCI. Validate each link with evidence; document the workaround and proposed fixes.", "next_file": "04-change-management.html", "next_title": "Change Management", "id": "03", "source": "03-problem-management.md", "original": "# Section 3: Problem Management\n\n## What is a Problem?\n\nThe **unknown root cause** of one or more incidents.\n\n**Incident** = the symptom. **Problem** = the disease.\n\n| | Incident | Problem |\n|---|---|---|\n| **Goal** | Restore service NOW | Prevent it from happening AGAIN |\n| **Timeframe** | Minutes to hours | Days to weeks |\n| **Question** | \"How do we fix it?\" | \"Why did it happen?\" |\n\n---\n\n## UPI Example: Continuing from Section 2\n\nRemember? Axis Bank transactions failed at 12:03 PM. The **incident** was resolved in 19 minutes by routing traffic to a backup node.\n\nBut **why** did it fail? That's a **Problem**.\n\n### Problem Record\n\n| Field | Value |\n|---|---|\n| Problem ID | PRB-20260921-0012 |\n| Related Incidents | INC-20260921-0047 (+ 3 similar from last month) |\n| Affected Service | UPI Transaction Processing |\n| Status | Under Investigation |\n\n---\n\n## Root Cause Analysis (RCA) -- 5 Whys\n\n```\nWhy did transactions fail?\n  --> Axis Bank PSP node stopped responding\n\nWhy did the node stop responding?\n  --> Connection pool was exhausted (0 available connections)\n\nWhy was the pool exhausted?\n  --> Axis Bank's core banking system started responding slowly (8s vs normal 200ms)\n\nWhy was it responding slowly?\n  --> Axis deployed a core banking upgrade at 11:45 AM without informing NPCI\n\nWhy wasn't NPCI informed?\n  --> No formal change notification process exists between Axis and NPCI\n```\n\n### Root Cause\n\n**Axis Bank deployed a change without coordinating with NPCI. No inter-org change communication protocol exists.**\n\n---\n\n## Known Error\n\nOnce root cause is identified but a permanent fix isn't ready yet, it becomes a **Known Error**:\n\n```\nProblem --> (RCA done) --> Known Error --> (fix deployed) --> Closed\n```\n\n| Field | Value |\n|---|---|\n| Known Error ID | KE-20260921-0012 |\n| Workaround | Route through backup node if Axis primary latency > 2s |\n| Permanent Fix | Implement inter-org change notification API + auto-circuit-breaker |\n\n---\n\n## Two Flavors of Problem Management\n\n| Type | Trigger | UPI Example |\n|---|---|---|\n| **Reactive** | After incidents happen | \"Axis failed 3 times this month -- investigate\" |\n| **Proactive** | Before incidents happen | \"SBI node latency trending up 5% weekly -- investigate before it breaks\" |\n\n---\n\n## Connection to Previous Sections\n\n```\n[Incident Occurs] ---> Incident Management (restore service)\n       |\n       +---> Problem Management (find root cause)\n                    |\n                    +---> Known Error (workaround documented)\n                    |\n                    +---> Change Management (permanent fix) <-- next section\n```\n\n---\n\n## Key Takeaway\n\n> Incident = **put out the fire**\n> Problem = **find out why fires keep starting in that building**\n> Known Error = **we know why, here's the workaround until we fix it permanently**\n", "filename": "03-problem-management.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
