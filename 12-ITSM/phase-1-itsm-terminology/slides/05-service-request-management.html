<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Service Request Management · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Service Request Management", "tag": "Fulfill a need", "hook": "“I need access” and “my access is broken” are different journeys.", "slides": [{"title": "HDFC asks for more transaction capacity", "lead": "The HDFC Bank Integration Team asks NPCI to increase its transactions-per-second limit from 500 to 2,000. Nothing is broken: the bank needs more capacity. The request should have an owner, approval and delivery target.", "items": [["Request", "HDFC needs a higher limit."], ["Fulfillment team", "NPCI Platform Engineering checks and implements it."], ["Expectation", "A tracked request with a 1-business-day target."]], "kind": "story", "notes": "", "quote": "“Increase our TPS limit from 500 to 2000.”", "source_heading": "Example: Bank Requests Higher TPS Limit"}, {"title": "A request asks for something to be provided", "lead": "Use a defined, trackable fulfillment process.", "items": [["Access", "Read access to a reporting system."], ["Information", "A settlement report for a specified period."], ["Provisioning", "A staging environment for testing."]], "kind": "cards", "notes": ""}, {"title": "Classify the user’s actual need", "lead": "Ask enough questions to understand the trigger.", "items": [["“Login returns error 500”", "Incident: an existing service is failing."], ["“I do not have an account”", "Request: provision new access."], ["“My password expired”", "Usually a routine reset request; follow local policy."]], "kind": "cards", "notes": "", "visual": "classify", "takeaway": "Classify the trigger: a failed existing service or a need for something to be provided."}, {"title": "Request to fulfillment", "lead": "The model specifies required information, approvals and ownership.", "items": [["Submit", "User selects an item and enters details."], ["Categorize", "Route to the right fulfillment team."], ["Approve", "Obtain authorization if required."], ["Fulfill", "Provide the item and verify it works."], ["Close", "Confirm delivery and update the record."]], "kind": "flow", "notes": ""}, {"title": "REQ-20260921-0031 · HDFC’s request record", "lead": "Requestor: HDFC Bank Integration Team. Fulfillment: NPCI Platform Engineering.", "items": [["Need", "Increase the TPS limit from 500 to 2,000."], ["Check", "Capacity Manager reviews headroom: the example cluster is at 40% utilization."], ["Decision", "Approve the request after capacity and impact review."], ["Target", "Fulfill within 1 business day."]], "kind": "catalog", "notes": ""}, {"title": "Four hours later: HDFC confirms the new limit", "lead": "The request closes only after the change and its result are verified.", "items": [["Configure", "Update HDFC’s rate-limiter configuration."], ["Deploy & test", "Use the applicable change model; run a load test."], ["Confirm & close", "HDFC confirms 2,000 TPS works. Four hours: within the example target."]], "kind": "flow", "notes": "The source treats this as a pre-approved standard change. That classification is valid only within an established standard-change model. Otherwise use the appropriate assessed and authorized change."}, {"title": "Request models remove repeated decisions", "lead": "Templates define the normal path and make exceptions visible.", "items": [["Password reset", "Identity checks and an approved reset procedure."], ["New employee", "An access and equipment checklist with ownership."], ["New bank integration", "Compliance, security and technical testing."], ["Report request", "Report type, date range and permitted data scope."]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "One request connects several practices", "lead": "Track the user’s need through the underlying work.", "items": [["Catalog", "Makes the request discoverable."], ["Change", "Controls modifications used to fulfill it."], ["CMDB", "Records the resulting environment or component."], ["Service levels", "Set fulfillment expectations."]], "kind": "cards", "notes": ""}, {"title": "Where did HDFC find the request?", "lead": "HDFC’s request was approved, implemented, tested and confirmed in four hours. Make that path easy for the next bank to discover.", "items": [["This chapter", "REQ-20260921-0031 tracks the bank’s need through fulfillment."], ["Next · Catalog", "A TPS Limit Change menu item explains how to ask and what to expect."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "HDFC’s 500 → 2,000 TPS request is approved while the cluster is at 40% utilization. What still needs to happen before REQ-0031 closes?", "answer": "Use the appropriate controlled change to update the rate limiter, test the new capacity, verify service health and obtain HDFC’s confirmation. Approval alone is not fulfillment.", "next_file": "06-service-catalog.html", "next_title": "Service Catalog", "id": "05", "source": "05-service-request-management.md", "original": "# Section 5: Service Request Management\n\n## What is a Service Request?\n\nA **formal request from a user** for something to be provided -- NOT a failure or break.\n\nKey distinction:\n\n| | Incident | Service Request |\n|---|---|---|\n| **Trigger** | Something is BROKEN | I NEED something |\n| **Example** | \"UPI payments failing\" | \"Give me access to production logs\" |\n| **Urgency** | Usually high | Usually planned |\n| **Goal** | Restore service | Fulfill a need |\n\n---\n\n## UPI Examples\n\n### Requests from Banks to NPCI\n\n| Request | Type | Approval needed? |\n|---|---|---|\n| \"Onboard our new UPI handle @kotak\" | New service setup | Yes -- compliance review |\n| \"Add 5 new API credentials for our team\" | Access provisioning | Yes -- security approval |\n| \"Share last month's settlement report\" | Information request | No -- standard |\n| \"Increase our TPS (transactions per second) limit from 500 to 2000\" | Capacity change | Yes -- infra team review |\n\n### Requests from NPCI Internal Teams\n\n| Request | Type | Approval needed? |\n|---|---|---|\n| \"I need read access to the settlement database\" | Access request | Yes -- manager + DBA approval |\n| \"Set up a new staging environment for v4.2 testing\" | Environment provisioning | Yes -- infra team |\n| \"Reset my VPN credentials\" | Password/credential reset | No -- auto-approved |\n| \"Order a new monitoring license for Grafana\" | Procurement | Yes -- budget approval |\n\n---\n\n## Service Request Lifecycle\n\n```\nSubmit --> Categorize --> Approve (if needed) --> Fulfill --> Close\n```\n\n### Example: Bank Requests Higher TPS Limit\n\n```\n1. SUBMIT\n   REQ-20260921-0031: \"Increase HDFC TPS limit 500 -> 2000\"\n   Requested by: HDFC Bank Integration Team\n\n2. CATEGORIZE\n   Category: Capacity Change\n   Fulfillment team: NPCI Platform Engineering\n\n3. APPROVE\n   Approver: NPCI Capacity Manager\n   Check: Do we have headroom? Yes -- current cluster at 40% utilization.\n   Decision: APPROVED\n\n4. FULFILL\n   - Update rate limiter config for HDFC\n   - Deploy config change (Standard Change -- pre-approved)\n   - Run load test to verify\n\n5. CLOSE\n   REQ closed. HDFC confirmed new limit working.\n   Fulfillment time: 4 hours (within 1-business-day SLA)\n```\n\n---\n\n## Request Fulfillment vs Incident Resolution\n\n```\nUser: \"I can't log into the UPI dashboard\"\n\nIs it an Incident or a Service Request?\n\n  --> \"I get an error 500 when I log in\"        = INCIDENT (something is broken)\n  --> \"I don't have an account yet, need access\" = SERVICE REQUEST (need something new)\n  --> \"My password expired, need a reset\"        = SERVICE REQUEST (routine fulfillment)\n```\n\nThis distinction matters because they follow **different processes, different SLAs, different teams**.\n\n---\n\n## Request Models\n\nFor frequently asked requests, ITSM defines **pre-built request models** (like templates):\n\n| Request Model | Pre-filled fields | Auto-approval? |\n|---|---|---|\n| Password Reset | Category, fulfillment team, SLA | Yes |\n| New Employee Onboarding | Checklist: laptop, email, VPN, access | Manager approval only |\n| New Bank Onboarding | Compliance docs, API credentials, testing | Multi-level approval |\n| Report Generation | Report type, date range, format | Yes |\n\nThese models speed up fulfillment and reduce errors.\n\n---\n\n## Connection to Previous Sections\n\n```\nService Request: \"I need a new staging environment\"\n        |\n        +--> If it's a routine setup --> Standard Change (pre-approved)\n        |\n        +--> If it needs new infra --> Normal Change (CAB approval)\n        |\n        +--> Environment details recorded in --> CMDB (Section 7)\n        |\n        +--> Available as a menu item in --> Service Catalog (Section 6, next)\n```\n\n---\n\n## Key Takeaway\n\n> Not everything is an incident. Users also need things -- access, info, environments, reports.\n> Service Request Management gives them a **structured, trackable, SLA-driven way** to ask for it.\n>\n> Rule of thumb:\n> - **Broken?** --> Incident\n> - **Need something?** --> Service Request\n", "filename": "05-service-request-management.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
