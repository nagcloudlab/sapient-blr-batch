<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Service &amp; IT Service · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Service & IT Service", "tag": "Start with customer value", "hook": "The customer wants the payment to work—not a tour of your servers.", "slides": [{"title": "You open GPay and send ₹500", "lead": "You want to send money to a friend. You do not choose NPCI’s servers, operate its data centers or manage the network between banks. You expect the payment to complete.", "items": [["You", "Ask for a useful outcome: your friend receives ₹500."], ["NPCI & partners", "Operate the technology behind the payment."], ["The service", "Hides that complexity while delivering value."]], "kind": "story", "notes": "", "quote": "“Money moved, instantly, reliably.”", "source_heading": "UPI Example"}, {"title": "A service delivers an outcome", "lead": "Customers gain value without managing all the underlying costs and risks themselves.", "items": [["Consumer need", "“Send ₹500 to my friend.”"], ["Provider work", "Operate applications, infrastructure and support."], ["Value experienced", "Speed, convenience and confidence."]], "kind": "cards", "notes": ""}, {"title": "Three layers of service", "lead": "Use this simplified stack to trace business impact.", "items": [["Business service", "UPI-style payments: send and receive money."], ["IT service", "Transaction processing and routing."], ["Infrastructure service", "Databases, messaging, compute and networks."]], "kind": "flow", "notes": "", "visual": "stack", "takeaway": "Manage the supporting technology so the customer’s payment outcome stays healthy."}, {"title": "Failure travels upward", "lead": "A technical fault matters because of the outcome it disrupts.", "items": [["Database unavailable", "Transactions cannot be persisted."], ["Processing impaired", "The payment engine cannot complete requests."], ["Customer affected", "A merchant cannot accept a payment."]], "kind": "flow", "notes": ""}, {"title": "Outcome is different from output", "lead": "Ask what the customer actually achieved.", "items": [["Output", "A transaction ID and a confirmation message."], ["Outcome", "The intended recipient receives the money."], ["Value", "The customer can complete the purchase with confidence."]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "Put names against the service roles", "lead": "For the UPI example, the role depends on which service relationship you examine.", "items": [["Provider · NPCI", "Delivers the platform service in the notes."], ["Consumers · banks & apps", "Banks and PhonePe use the platform; end users experience payments."], ["Customer outcome", "Your friend receives ₹500 without operating the payment infrastructure."]], "kind": "cards", "notes": ""}, {"title": "Name the service, then its purpose", "lead": "Illustrative services in a payments ecosystem.", "items": [["Transaction processing", "Routes and processes payments."], ["Registration", "Links a user to a payment identity."], ["Dispute support", "Handles reports of failed or disputed payments."], ["Settlement", "Supports obligations between participating institutions."]], "kind": "cards", "notes": ""}, {"title": "Lunchtime: imagine UPI is down for 30 minutes", "lead": "Translate the failure into consequences the business understands.", "items": [["Merchants", "Cannot accept UPI payments from waiting customers."], ["Customers", "Cannot complete purchases or transfers as expected."], ["Trust & accountability", "Banks and users need updates, recovery and an explanation."]], "kind": "cards", "notes": "This restores the original discussion context. Do not repeat the source’s unsupported estimate of eight million failed transactions or imply an automatic regulatory consequence."}, {"title": "Now the customer’s payment stops working", "lead": "We understand what UPI Payments delivers. At 12:03 PM, the Axis success-rate dashboard drops sharply.", "items": [["This chapter", "A database fault matters because users cannot complete payments."], ["Next · Incident", "Restore the service and coordinate the response to INC-0047."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "UPI is down for 30 minutes at lunchtime. What is the impact on merchants, customers and trust?", "answer": "Merchants cannot accept UPI payments, customers cannot complete purchases or transfers, and trust is affected. Describe the service outcome and affected users; estimate transaction impact only with explicit traffic assumptions.", "next_file": "02-incident-management.html", "next_title": "Incident Management", "id": "01", "source": "01-service-and-it-service.md", "original": "# Section 1: Service & IT Service\n\n## What is a Service?\n\nA way to deliver **value** to customers by helping them achieve outcomes they want, *without them owning the costs and risks*.\n\nSimple: **\"I give you something useful. You don't worry about how it works.\"**\n\n---\n\n## UPI Example\n\nWhen you open GPay and send Rs.500 to a friend:\n\n- You don't know which servers processed it\n- You don't care about NPCI's data centers\n- You don't manage the network between banks\n\n**You just want: money moved, instantly, reliably.** That's a **service**.\n\n---\n\n## IT Service vs Business Service\n\n| Type | Example | Who sees it? |\n|---|---|---|\n| **Business Service** | \"UPI Payments\" -- send/receive money | End users (you, merchants) |\n| **IT Service** | UPI Transaction Processing Engine | Internal NPCI teams |\n| **Infrastructure Service** | Database cluster, Kafka messaging, Load balancers | Ops/Platform teams |\n\nThey stack like a pyramid:\n\n```\n        End User sees:\n       +-------------------+\n       |  Business Service  |  <-- \"UPI Payments\"\n       +---------+---------+\n                 | depends on\n       +---------v---------+\n       |    IT Service      |  <-- Transaction Engine, Settlement Engine\n       +---------+---------+\n                 | depends on\n       +---------v---------+\n       |  Infrastructure    |  <-- Servers, DBs, Network, Kafka\n       +-------------------+\n```\n\n**When the DB goes down (infra) -> Transaction Engine breaks (IT service) -> Users can't pay (business service).**\n\nThat chain is why ITSM matters -- you manage bottom-up so the top stays healthy.\n\n---\n\n## Examples of IT Services at NPCI\n\n| IT Service | What it does |\n|---|---|\n| **UPI Transaction Processing** | Routes payment from sender bank -> receiver bank |\n| **UPI Registration Service** | Links mobile number -> bank account -> VPA (yourname@upi) |\n| **Dispute Resolution Service** | Handles failed/stuck transactions, refunds |\n| **Settlement Service** | End-of-day money movement between banks |\n| **Merchant Onboarding** | Registers PhonePe, GPay, Paytm as UPI apps |\n\n---\n\n## Key Terms\n\n| Term | Meaning | UPI Example |\n|---|---|---|\n| **Service** | Delivers value without exposing complexity | UPI Payments |\n| **Service Provider** | Org that delivers the service | NPCI |\n| **Service Consumer** | Org/person that uses the service | Banks, PhonePe, end users |\n| **Outcome** | What the consumer actually wants | \"Money transferred instantly\" |\n| **Output** | What the provider produces | Transaction ID, confirmation |\n| **Value** | Perceived benefit by consumer | Trust, speed, convenience |\n\n---\n\n## Discussion\n\n> If NPCI's UPI is down for 30 minutes during peak hours (lunch time), what's the business impact?\n> - ~8 million failed transactions\n> - Merchants can't accept payments\n> - Consumer trust drops\n> - RBI scrutiny\n>\n> This is why we don't just \"run servers\" -- we **manage services**.\n", "filename": "01-service-and-it-service.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
