<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configuration Management · CMDB · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Configuration Management · CMDB", "tag": "Map the dependencies", "hook": "If this component fails, what else is affected?", "slides": [{"title": "“UPI payments are slow.” Where do you look?", "lead": "Without a dependency map, five teams spend three hours checking components independently. In the notes’ CMDB example, the team instead follows UPI Payments → Transaction Engine → Kafka → Node-7.", "items": [["Locate", "The CMDB identifies the service’s dependencies."], ["Observe", "Monitoring reports Node-7 CPU at 98%."], ["Recover", "Scale Kafka and add Node-8; the example resolves in 12 minutes."]], "kind": "story", "notes": "The three-hour versus twelve-minute comparison is an illustrative outcome in the source, not a benchmark. A CMDB gives relationships; monitoring validates live conditions.", "quote": "“If this component breaks, what else breaks?”", "source_heading": "Why CMDB Matters: The Dependency Map"}, {"title": "A CMDB holds configuration context", "lead": "Configuration items and their relationships help teams understand services.", "items": [["CI · Configuration item", "A component managed to support service delivery."], ["Attributes", "Identity, type, version, owner, environment and status."], ["Relationships", "How components host, support or depend on each other."]], "kind": "cards", "notes": ""}, {"title": "CI-1001 · UPI Transaction Engine", "lead": "Read the identifiers that connect the application to its supporting components.", "items": [["Identity & owner", "Application v4.1 · production · Platform Engineering."], ["Hosted on", "CI-2045: K8s Cluster-A, Mumbai data center."], ["Depends on", "CI-3012: Oracle DB; CI-3018: Kafka; CI-4001: PSP gateway."], ["Supports", "CI-5001: UPI Payments · related example availability SLA: 99.95%."]], "kind": "catalog", "notes": ""}, {"title": "Read the dependency map", "lead": "For this exercise, both applications use a shared transaction database.", "items": [["UPI-style payments", "Supported by transaction and settlement applications."], ["Applications", "Transaction engine + settlement engine."], ["Shared dependencies", "Database; transaction engine also uses Kafka and gateway."], ["Infrastructure", "Database host, compute cluster and network."]], "kind": "flow", "notes": "The original notes show different database hosts but later imply a shared failure. This teaching map explicitly assumes a shared database so the impact example is consistent.", "visual": "dependencies", "takeaway": "A shared dependency can affect multiple applications. Validate the map with live evidence."}, {"title": "Describe the relationship precisely", "lead": "A relationship is more useful than a list of names.", "items": [["Runs on", "Transaction engine → Kubernetes cluster."], ["Depends on", "Transaction engine → database."], ["Supports", "Transaction engine → payments service."], ["Connected to", "Gateway → bank integration endpoint."]], "kind": "cards", "notes": ""}, {"title": "Three hours searching—or a 12-minute example?", "lead": "Return to the Node-7 incident: use the map to focus the investigation.", "items": [["Start with impact", "“UPI payments are slow.” Find the supported business service."], ["Follow the map", "UPI Payments → Txn Engine → Kafka → Node-7."], ["Validate evidence", "Monitoring shows Node-7 CPU at 98%."], ["Recover", "Scale Kafka and add Node-8; verify recovery in the 12-minute example."]], "kind": "flow", "notes": ""}, {"title": "Keep the map trustworthy", "lead": "Accuracy requires ongoing ownership and validation.", "items": [["Discovery", "Discover components and reconcile identities."], ["Delivery integration", "Update configuration records when deployments change them."], ["Change linkage", "Review affected items and relationships."], ["Audit", "Compare records with the running environment."]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "The map shows dependencies. Are they healthy enough?", "lead": "The team can now trace payments to the underlying components. Monitoring those components supplies evidence for service-quality decisions.", "items": [["This chapter", "The CMDB guides impact analysis and focused investigation."], ["Next · Service levels", "Use SLI, SLO and SLA to compare measured quality with targets and promises."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "A shared database is due for maintenance. How does the CMDB help before the change?", "answer": "Trace the services and applications that depend on it, identify owners, assess business impact, coordinate timing and validate the relationships against reality.", "next_file": "08-service-level-management.html", "next_title": "Service Level Management", "id": "07", "source": "07-configuration-management-cmdb.md", "original": "# Section 7: Configuration Management (CMDB)\n\n## What is CMDB?\n\n**Configuration Management Database** -- a **map of every IT asset and how they relate to each other**.\n\nThink of it as: **\"Google Maps for your IT infrastructure.\"** You don't just know what exists -- you know what connects to what, and what breaks if something goes down.\n\n---\n\n## The Core Concept: Configuration Item (CI)\n\nA **CI** is anything that needs to be managed to deliver an IT service.\n\n| CI Type | UPI Examples |\n|---|---|\n| **Hardware** | Server rack in Mumbai DC, Load balancer |\n| **Software** | UPI Txn Engine v4.1, Kafka 3.5, Oracle DB |\n| **Network** | VPN tunnel to HDFC, API gateway, Firewall rules |\n| **Documentation** | Runbook for settlement engine, API spec for banks |\n| **Service** | UPI Payments (business), Transaction Processing (IT) |\n| **People/Teams** | Platform Engineering team, NOC, DBA team |\n\n---\n\n## UPI Example: What's in NPCI's CMDB?\n\n```\nCI-1001: UPI Transaction Engine\n  |-- Type: Application\n  |-- Version: v4.1\n  |-- Environment: Production\n  |-- Owner: Platform Engineering\n  |-- Hosted on: CI-2045 (K8s Cluster-A, Mumbai DC)\n  |-- Depends on:\n  |     |-- CI-3012 (Oracle DB - transaction store)\n  |     |-- CI-3018 (Kafka cluster - event streaming)\n  |     +-- CI-4001 (PSP Gateway - connects to banks)\n  |-- Supports:\n  |     +-- CI-5001 (UPI Payments - business service)\n  +-- Related SLA: 99.95% uptime\n```\n\nEvery CI has: **identity, type, version, owner, relationships, and status.**\n\n---\n\n## Why CMDB Matters: The Dependency Map\n\nWithout CMDB:\n\n```\nIncident: \"UPI payments are slow\"\nTeam: \"No idea what's causing it. Let's check everything.\"\n(3 hours later, 5 teams investigating blindly)\n```\n\nWith CMDB:\n\n```\nIncident: \"UPI payments are slow\"\nCMDB lookup: UPI Payments --> Txn Engine --> Kafka --> Kafka runs on Node-7\nMonitoring: Node-7 CPU at 98%\nResolution: Scale Kafka, add Node-8\nTime: 12 minutes\n```\n\n---\n\n## CMDB Relationship Types\n\n| Relationship | Meaning | UPI Example |\n|---|---|---|\n| **Runs on** | Software on hardware | Txn Engine *runs on* K8s Cluster-A |\n| **Depends on** | Needs this to work | Txn Engine *depends on* Oracle DB |\n| **Used by** | Consumed by another CI | Oracle DB *used by* Txn Engine, Settlement Engine |\n| **Supports** | Enables a business service | Txn Engine *supports* UPI Payments |\n| **Connected to** | Network/integration link | NPCI Gateway *connected to* HDFC Bank API |\n\n---\n\n## Visualizing Dependencies\n\n```\n                    UPI Payments (Business Service)\n                          |\n              +-----------+-----------+\n              |                       |\n     Txn Engine (App)        Settlement Engine (App)\n         |                           |\n    +----+----+                 +----+----+\n    |         |                 |         |\n Kafka     Oracle DB       Oracle DB   SFTP Server\n    |         |                 |\n K8s       DB Server        DB Server\n Cluster-A  (Mumbai)        (Chennai - DR)\n```\n\n**Impact analysis:** If Oracle DB (Mumbai) goes down --> Txn Engine AND Settlement Engine are affected --> UPI Payments degraded. CMDB tells you this **instantly** without guessing.\n\n---\n\n## CMDB in Action: Connecting to Other Sections\n\n| When this happens... | CMDB helps by... |\n|---|---|\n| **Incident** (Sec 2) | \"What depends on the failed component?\" --> Impact scope |\n| **Problem** (Sec 3) | \"Which CIs were involved?\" --> Narrow RCA scope |\n| **Change** (Sec 4) | \"If I upgrade this, what else is affected?\" --> Risk assessment |\n| **Service Request** (Sec 5) | \"Does this environment already exist?\" --> Avoid duplicates |\n| **Service Catalog** (Sec 6) | \"What infrastructure backs this service?\" --> Technical view |\n\n---\n\n## Keeping CMDB Accurate\n\nA stale CMDB is worse than no CMDB -- it gives false confidence.\n\n| Method | How |\n|---|---|\n| **Discovery tools** | Auto-scan network to find servers, apps, connections |\n| **CI/CD integration** | Every deployment updates CMDB automatically |\n| **Change Management link** | Every CHG must update affected CIs in CMDB |\n| **Periodic audits** | Quarterly check: does CMDB match reality? |\n\n---\n\n## Key Takeaway\n\n> CMDB is not a spreadsheet of servers. It's a **living map of relationships**.\n>\n> The question it answers is not \"what do we have?\" but **\"if this breaks, what else breaks?\"**\n> That's the difference between 12-minute resolution and 3-hour chaos.\n", "filename": "07-configuration-management-cmdb.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
