<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Service Level Management · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Service Level Management", "tag": "Measure · target · agree", "hook": "What did we promise—and can we show that we delivered?", "slides": [{"title": "The bank asks: did NPCI keep its promise?", "lead": "The service is running again, but a bank needs more than “it is fixed.” In the notes, NPCI and banks agree service-quality expectations. Engineers need measurements that show whether those expectations were met.", "items": [["Measure · SLI", "Observe transaction success over the agreed window."], ["Target · SLO", "Aim for 99.9% in the example."], ["Agree · SLA", "The example customer agreement specifies 99.5%."]], "kind": "story", "notes": "All targets and agreements here come from fictional training examples. They are not statements about NPCI contracts. A 19-minute incident alone cannot establish a monthly success-rate breach.", "quote": "“What did we promise? Are we keeping it? Can we prove it?”", "source_heading": "What is Service Level Management?"}, {"title": "Three concepts, three jobs", "lead": "Use the same metric definition and measurement window when comparing them.", "items": [["SLI · Indicator", "Observed service quality: example success rate 99.94%."], ["SLO · Objective", "Target quality: example success rate at least 99.9%."], ["SLA · Agreement", "Customer agreement: example 99.5%, with defined consequences."]], "kind": "cards", "notes": "An internal SLO often provides margin above an SLA, but “always stricter” is not a universal definition. Source: https://sre.google/sre-book/service-level-objectives/", "visual": "levels", "takeaway": "Compare the same metric over the same window. This example’s SLO provides margin above its SLA."}, {"title": "Define the measurement before the target", "lead": "A number is useful only when everyone knows what it includes.", "items": [["Success rate", "Successful eligible requests ÷ all eligible requests."], ["Latency", "Example: 95% of eligible requests complete within 800 ms."], ["Window & exclusions", "Specify the reporting period, eligible traffic and data source."]], "kind": "cards", "notes": ""}, {"title": "Availability: every decimal matters", "lead": "Calculated for a fixed 30-day month: 43,200 minutes.", "items": [["99%", "7 hours 12 minutes of downtime."], ["99.5%", "3 hours 36 minutes."], ["99.9%", "43 minutes 12 seconds."], ["99.95%", "21 minutes 36 seconds."], ["99.99%", "4 minutes 19.2 seconds."]], "kind": "bars", "notes": "Time-based downtime allowance = 43,200 × (1 − target). Do not convert it into failed transactions without traffic assumptions. These replace inconsistent month lengths in the source.", "visual": "downtime", "takeaway": "Time-based allowance = 43,200 minutes × (1 − availability target)."}, {"title": "External promises need internal support", "lead": "Align the commitments across the delivery chain.", "items": [["SLA", "Agreement between provider and customer."], ["OLA", "Operational agreement between internal teams."], ["Underpinning contract", "Agreement with an external supplier supporting delivery."]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "Who must help NPCI keep the promise?", "lead": "The notes make service levels concrete through internal and supplier commitments.", "items": [["NOC → platform", "Escalate P1 within 2 min; platform acknowledges within 5 min."], ["DBA & infrastructure", "Example DB restore within 30 min; new environment within 2 business days."], ["Supplier contracts", "Example cloud compute uptime 99.99%; inter-DC network latency below 10 ms."], ["Bank dependency", "Example Axis API response below 500 ms for 95% of requests."]], "kind": "cards", "notes": "These are separate illustrative agreement examples, not a validated end-to-end budget or actual vendor commitments."}, {"title": "Make the response timeline add up", "lead": "Illustrative 30-minute restoration target.", "items": [["2 min", "Detect and escalate."], ["5 min", "Acknowledge and take ownership."], ["18 min", "Investigate and restore."], ["5 min", "Verify recovery and communicate."]], "kind": "flow", "notes": "This is a simplified sequential allocation, not a guarantee. Activities may overlap; incident closure may follow later."}, {"title": "Error budget = the allowed unreliability", "lead": "Request-based example: 1,000,000 eligible requests in the reporting window.", "items": [["99.9% SLO", "0.1% error budget."], ["1,000 failures", "1,000,000 × 0.001."], ["600 failures used", "400 remain · 40% of the budget."]], "kind": "cards", "notes": "Source: https://sre.google/workbook/error-budget-policy/ . The original 430,000 figure lacked a consistent denominator; this example makes the denominator explicit.", "visual": "budget", "takeaway": "An error budget is the allowed unreliability for a defined SLO and reporting window."}, {"title": "Use evidence to choose the next action", "lead": "Agree an error-budget policy before the pressure of an outage.", "items": [["Healthy budget", "Continue planned delivery within the agreed controls."], ["Budget exhausted", "Prioritize reliability and apply agreed release restrictions."], ["SLA breached", "Validate the measure, communicate, and follow contractual remedies."]], "kind": "cards", "notes": "An error-budget policy may exempt urgent reliability or security fixes. It is not a universal freeze on every change. https://sre.google/workbook/error-budget-policy/"}, {"title": "August 2026: the example SLA is breached", "lead": "Monthly transaction success is 99.3% against an agreed 99.5%. The shortfall is 0.2 percentage points.", "items": [["Explain", "Validate the metric and communicate the breach to affected banks."], ["Follow the agreement", "Apply the reporting and remedies defined in the example SLA."], ["Improve", "Raise a problem record, hold an executive review and assign an improvement plan."]], "kind": "cards", "notes": "This restores the source’s monthly breach scenario. It is separate from the September Axis incident. Penalties and regulatory responses depend on actual agreements and rules; do not present them as verified NPCI consequences."}, {"title": "Keeping promises depends on people finding the fix", "lead": "A restoration target is harder to meet when the engineer who knows the procedure is unavailable.", "items": [["This chapter", "Agreements and measurements make expectations explicit."], ["Next · Knowledge", "Ravi, Priya and Amit face the same settlement alert with different levels of context."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "Your SLO is 99.9% over two million eligible requests. How many failed requests consume the full budget?", "answer": "2,000 failures: 2,000,000 × 0.1%. The numerator, denominator and measurement window must use the agreed SLI definition.", "next_file": "09-knowledge-management.html", "next_title": "Knowledge Management", "id": "08", "source": "08-service-level-management.md", "original": "# Section 8: Service Level Management (SLA / SLO / SLI)\n\n## What is Service Level Management?\n\nDefining, agreeing, monitoring, and reporting on **promises about service quality**.\n\nThink of it as: **\"What did we promise? Are we keeping that promise? Can we prove it?\"**\n\n---\n\n## The Three Pillars: SLI -> SLO -> SLA\n\n```\nSLI  =  What you MEASURE        (the thermometer)\nSLO  =  What you TARGET          (the internal goal)\nSLA  =  What you PROMISE          (the contract with penalties)\n```\n\n| | Full Form | Who cares | UPI Example |\n|---|---|---|---|\n| **SLI** | Service Level Indicator | Engineers | Transaction success rate = 99.4% right now |\n| **SLO** | Service Level Objective | Engineering + Management | We target 99.9% success rate |\n| **SLA** | Service Level Agreement | Business + Legal + Customer | We promise banks 99.5% -- breach = financial penalty |\n\n**SLO is always stricter than SLA.** You aim higher internally so you never breach the external promise.\n\n```\nSLA: 99.5%  <-- breach this, you pay penalty\nSLO: 99.9%  <-- breach this, internal alert, teams mobilize\nSLI: 99.94% <-- actual current measurement\n\n        99.0%     99.5%      99.9%   99.94%   100%\n         |         |          |        |        |\n         |    SLA--+     SLO--+   SLI--+        |\n         |   (promise)  (target)  (actual)      |\n```\n\n---\n\n## UPI Example: SLAs Between NPCI and Banks\n\n### NPCI -> Banks (External SLA)\n\n| Service | SLI (Metric) | SLO (Target) | SLA (Contractual) | Breach Penalty |\n|---|---|---|---|---|\n| Transaction Processing | Success rate | 99.9% | 99.5% | Financial penalty per 0.1% below |\n| Transaction Latency | P95 response time | < 800ms | < 1500ms | Penalty if monthly avg exceeds |\n| Settlement | On-time delivery | 100% by 6 AM | By 8 AM | Late settlement = escalation to RBI |\n| Dispute Resolution | Acknowledgment time | < 30 min | < 1 hour | Regulatory non-compliance |\n| Platform Availability | Uptime % | 99.99% | 99.9% | Per-minute credit for downtime |\n\n### What does 99.9% uptime actually mean?\n\n| Uptime | Allowed downtime/month | UPI Impact |\n|---|---|---|\n| 99% | 7 hours 18 min | ~150 crore failed transactions |\n| 99.5% | 3 hours 39 min | ~75 crore failed transactions |\n| 99.9% | 43 min 50 sec | ~15 crore failed transactions |\n| 99.95% | 21 min 55 sec | ~7 crore failed transactions |\n| 99.99% | 4 min 23 sec | ~1.5 crore failed transactions |\n\nEvery decimal point matters at NPCI scale.\n\n---\n\n## Internal SLAs: OLA (Operational Level Agreement)\n\nSLA between **internal teams** that together fulfill the external SLA.\n\n| From Team | To Team | Promise |\n|---|---|---|\n| NOC | Platform Engineering | Escalate P1 incidents within 2 min |\n| Platform Engineering | NOC | Acknowledge escalation within 5 min |\n| DBA Team | Platform Engineering | Database restore within 30 min |\n| Infra Team | All teams | New environment provisioned within 2 business days |\n\nOLAs are the **internal gears** that make external SLAs achievable.\n\n```\nExternal SLA: \"Resolve P1 in 30 min\"\n\nThat 30 min is split across internal OLAs:\n  NOC detects + escalates:     2 min  (OLA)\n  Platform acknowledges:       5 min  (OLA)\n  Investigation + fix:        18 min  (team effort)\n  Verify + close:              5 min  (OLA)\n                              --------\n  Total:                      30 min  = SLA met\n```\n\n---\n\n## Underpinning Contracts (UC)\n\nAgreements with **external vendors/partners**.\n\n| Vendor | Promise to NPCI |\n|---|---|\n| Cloud Provider (AWS/Azure) | 99.99% compute uptime |\n| Telecom (MPLS provider) | Network latency < 10ms between DCs |\n| Axis Bank | API response time < 500ms for 95% of requests |\n\n```\nSLA (NPCI -> Banks) depends on:\n    |-- OLA (internal teams)\n    +-- UC (external vendors)\n```\n\n---\n\n## Error Budget (Connecting SRE to ITSM)\n\nError budget is the flip side of SLO:\n\n```\nSLO: 99.9% success rate\nError budget: 0.1% = ~430,000 failed transactions/month allowed\n\nBudget remaining:  0.06% used -> 0.04% left -> safe to deploy changes\nBudget exhausted:  0.1% used -> FREEZE all changes, focus on reliability\n```\n\nThis directly connects to **Change Management (Section 4)**: when error budget is low, CAB rejects non-critical changes.\n\n---\n\n## SLA Breach: What Happens?\n\n```\nMonth: August 2026\nSLA: 99.5% transaction success rate\nActual SLI: 99.3% (breached by 0.2%)\n\nConsequences:\n  1. Financial penalty to affected banks\n  2. RBI scrutiny and possible audit\n  3. Major Problem record raised (PRB)\n  4. Executive review + improvement plan\n  5. SLA breach report published to all banks\n```\n\n---\n\n## Connection to Previous Sections\n\n```\nSLA defines promises for --> Services (Sec 1) listed in --> Service Catalog (Sec 6)\n\nSLA breach triggers --> Incident (Sec 2) -> Problem (Sec 3)\n\nError budget controls --> Change approval (Sec 4)\n\nSLA fulfillment tracked for --> Service Requests (Sec 5)\n\nSLI data comes from --> Monitoring of CIs in CMDB (Sec 7)\n```\n\n---\n\n## Key Takeaway\n\n> **SLI** = the number on the dashboard\n> **SLO** = the target you aim for internally\n> **SLA** = the promise you can't break without consequences\n>\n> SLO is ALWAYS stricter than SLA. If your SLO and SLA are the same number, you have no safety margin -- you're driving at the edge of a cliff.\n", "filename": "08-service-level-management.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
