<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change Management · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Change Management", "tag": "Make change controlled", "hook": "A useful improvement can still create an outage.", "slides": [{"title": "The Axis investigation changes the next release", "lead": "The RCA found that Axis deployed a core banking upgrade without coordinating with NPCI. Slow responses exhausted the connection pool. Now teams need a controlled way to introduce changes and the permanent fix.", "items": [["What happened", "An uncoordinated upgrade contributed to the outage."], ["What must change", "Review dependencies, notify partners and prepare recovery."], ["Next example", "Use a planned v4.1 → v4.2 engine upgrade to learn the workflow."]], "kind": "story", "notes": "The v4.2 upgrade is a separate planned-change example in the notes, not explicitly the same release as the Axis remediation. Preserve that distinction while connecting both to controlled change.", "quote": "“Who needs to know before we change production?”", "source_heading": "UPI Example: The Root Cause from Section 3"}, {"title": "A change can add, modify or remove", "lead": "Manage the risk of anything that could affect an IT service.", "items": [["Understand impact", "Which services and users depend on the change?"], ["Authorize appropriately", "Use the change authority defined by policy."], ["Verify the result", "Confirm service health and learn from the outcome."]], "kind": "cards", "notes": ""}, {"title": "Three change models", "lead": "Approval effort should reflect risk and the agreed model.", "items": [["Standard", "Low-risk, repeatable and pre-authorized within defined conditions."], ["Normal", "Assessed and authorized through the applicable change process."], ["Emergency", "Expedited assessment and authorization, with follow-up review."]], "kind": "cards", "notes": ""}, {"title": "From request to review", "lead": "Plan enough detail before authorization to support an informed decision.", "items": [["Request", "Describe purpose, scope and affected CIs."], ["Assess & plan", "Risk, tests, timing, recovery and communication."], ["Authorize", "The designated change authority decides."], ["Implement", "Execute and monitor the approved plan."], ["Review & close", "Validate outcomes and update records."]], "kind": "flow", "notes": ""}, {"title": "CHG-20260925-0008 · plan the v4.2 upgrade", "lead": "The engineering team submits a planned transaction-engine upgrade: v4.1 → v4.2.", "items": [["Assess", "Medium risk; broad impact across participating banks. Rolling deployment aims for no downtime."], ["Review", "In this example, Ops Lead, Architect and QA review through CAB."], ["Window", "Sunday, 2–4 AM, with monitoring and partner communication prepared."], ["Recovery", "Return traffic to v4.1 containers if the agreed triggers fire."]], "kind": "catalog", "notes": ""}, {"title": "Sunday deployment: expand in stages", "lead": "The example rollout takes 90 minutes inside the agreed 2–4 AM window.", "items": [["10% → 50%", "Observe the canary; increase traffic if the agreed checks pass."], ["50% → 100%", "Complete the rolling deployment while watching service health."], ["Review & close", "Example result: success stable at 99.4%, no new deployment errors; close CHG."]], "kind": "flow", "notes": "The 99.4% example is a deployment observation, not proof of compliance with the separate monthly SLA exercise.", "visual": "rollout", "takeaway": "Each traffic increase is a decision: continue only when the agreed health checks pass."}, {"title": "Know your recovery route", "lead": "Example triggers and actions must be tailored to the service.", "items": [["Trigger", "Success rate below 98%, error rate above 0.5%, or a linked P1."], ["Recover", "Stop rollout; return traffic to the previous healthy version."], ["Verify & notify", "Confirm recovery and inform affected teams."]], "kind": "cards", "notes": "Plan rollback where feasible. Irreversible data changes may require roll-forward, backups or other recovery plans. These thresholds are illustrative."}, {"title": "CAB advises on change risk", "lead": "The Change Advisory Board provides cross-functional review where appropriate.", "items": [["Expertise", "Operations, architecture, security and quality."], ["Coordination", "Include affected partner teams when needed."], ["Authority", "Approval responsibility follows organizational policy."]], "kind": "cards", "notes": "Normal changes do not universally require a meeting or approval by CAB. A change authority may be a person, team or automated control. The unsupported “80% of incidents” claim in the source is omitted.", "illustrated": true}, {"title": "A production change can also fulfill a request", "lead": "The v4.2 upgrade shows controlled delivery. The next example starts with a bank asking for something new.", "items": [["This chapter", "CHG-20260925-0008 records a planned engine upgrade."], ["Next · Request", "HDFC asks to increase its capacity limit from 500 to 2,000 TPS."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "An urgent fix is ready during a live outage. Can the engineer skip change control?", "answer": "Use the emergency change process: rapid risk assessment and the designated authorization, monitoring and a recovery plan, followed by review.", "next_file": "05-service-request-management.html", "next_title": "Service Request Management", "id": "04", "source": "04-change-management.md", "original": "# Section 4: Change Management\n\n## What is a Change?\n\nThe **addition, modification, or removal** of anything that could affect IT services.\n\nGoal: **Ensure changes are done in a controlled way -- minimizing risk, maximizing success.**\n\n---\n\n## UPI Example: The Root Cause from Section 3\n\nRemember the root cause? **Axis Bank deployed a core banking upgrade without telling NPCI.** That uncontrolled change caused a P1 incident.\n\nChange Management exists so this never happens again.\n\n---\n\n## Types of Changes\n\n| Type | What | Approval | UPI Example |\n|---|---|---|---|\n| **Standard** | Pre-approved, low risk, routine | No CAB needed | Adding a new merchant to UPI |\n| **Normal** | Planned, needs review | CAB approval | Upgrading NPCI's transaction engine to v4.2 |\n| **Emergency** | Urgent fix for a live incident | Fast-track approval (post-review) | Hotfix for transactions failing at midnight |\n\n---\n\n## The Change Lifecycle\n\n```\nRequest --> Assess --> Approve --> Plan --> Implement --> Review --> Close\n```\n\n### UPI Example: Upgrading Transaction Engine to v4.2\n\n| Step | What happens |\n|---|---|\n| **Request** | Engineering team submits CHG-20260925-0008: \"Upgrade txn engine v4.1 -> v4.2\" |\n| **Assess** | Risk: Medium. Impact: All 400+ banks. Downtime: 0 (rolling deployment) |\n| **Approve** | Goes to CAB (Change Advisory Board) -- reviewed by Ops Lead, Architect, QA |\n| **Plan** | Deploy window: Sunday 2 AM - 4 AM. Rollback plan: revert to v4.1 containers |\n| **Implement** | Rolling deployment: 10% traffic -> 50% -> 100% over 90 minutes |\n| **Review** | Post-Implementation Review: success rate stable at 99.4%, no errors |\n| **Close** | CHG closed as successful |\n\n---\n\n## CAB (Change Advisory Board)\n\nA group that **reviews and approves** non-standard changes.\n\n| Role | Who at NPCI |\n|---|---|\n| CAB Chair | VP of Engineering |\n| Members | Platform Lead, Security Lead, QA Lead, Ops Lead |\n| Invitees (as needed) | Bank representatives (for high-impact changes) |\n\n**CAB doesn't do the work** -- they evaluate risk and say yes/no/defer.\n\n---\n\n## The Rollback Plan\n\nEvery change MUST have a rollback plan. No exceptions.\n\n```\nChange: Upgrade transaction engine v4.1 --> v4.2\n\nRollback trigger:\n  - Success rate drops below 98% within 30 min of deployment\n  - Error rate exceeds 0.5%\n  - Any P1 incident linked to this change\n\nRollback steps:\n  1. Stop rolling deployment\n  2. Route traffic back to v4.1 containers\n  3. Verify success rate recovers to baseline\n  4. Notify all PSPs (PhonePe, GPay, etc.)\n\nRollback time: < 10 minutes\n```\n\n---\n\n## What Happens Without Change Management?\n\nThat's exactly what Axis Bank did in Section 3:\n\n```\nWithout Change Management:\n  Axis deploys upgrade --> NPCI not informed --> connection pool exhausted\n  --> 2.8 crore users affected --> 19 min outage --> trust damaged\n\nWith Change Management:\n  Axis submits change request --> NPCI reviews impact --> deploy window agreed\n  --> monitoring in place --> rollback ready --> zero user impact\n```\n\n---\n\n## Connection to Previous Sections\n\n```\nProblem Management finds root cause\n        |\n        +--> \"We need to deploy a fix\"\n                    |\n                    +--> Change Management (controlled deployment)\n                              |\n                              +--> If change causes issues --> new Incident\n                              |\n                              +--> If successful --> Problem closed\n```\n\n---\n\n## Key Takeaway\n\n> **80% of incidents are caused by changes.**\n> Change Management doesn't slow you down -- it keeps you from breaking things.\n> Every change needs: **risk assessment, approval, plan, rollback, and review.**\n", "filename": "04-change-management.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
