<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Incident Management · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Incident Management", "tag": "Restore service", "hook": "At 12:03, payment success drops from 99.2% to 34%.", "slides": [{"title": "12:03 PM · Axis payments are failing", "lead": "NPCI’s monitoring dashboard shows Axis Bank’s transaction success rate dropping from 99.2% to 34%. People trying to send or receive through Axis are affected. The service desk must organize the response.", "items": [["Signal", "A monitoring alert creates an incident."], ["Impact", "UPI Transaction Processing is degraded for Axis users."], ["Mission", "Restore payments quickly and keep affected teams informed."]], "kind": "story", "notes": "Retain NPCI and Axis as names in the source’s fictional teaching scenario. The architecture and routing behavior are simplified. Explain impact through failed payments rather than presenting the source’s unverified user count as fact.", "quote": "“Transactions are failing on Axis Bank.”", "source_heading": "UPI Example: \"Transactions are failing on Axis Bank\""}, {"title": "An incident is a service interruption", "lead": "An unplanned outage or a reduction in service quality requires coordinated restoration.", "items": [["Detect", "Monitoring or a user identifies the issue."], ["Restore", "Recover the service as quickly as practical."], ["Communicate", "Keep affected users and teams informed."]], "kind": "cards", "notes": ""}, {"title": "INC-20260921-0047 · the incident record", "lead": "NPCI’s monitoring alert becomes a trackable P1 response in this scenario.", "items": [["Service & entity", "UPI Transaction Processing · Axis bank-facing node."], ["Source & time", "Automatically created from the monitoring alert at 12:03 PM."], ["Impact & urgency", "Axis users cannot reliably pay; impact and urgency assessed as high."], ["Owner & status", "Service desk coordinates the response while technical teams investigate."]], "kind": "catalog", "notes": ""}, {"title": "Priority = impact × urgency", "lead": "Use the organization’s agreed priority matrix.", "items": [["High impact + high urgency", "P1 · Critical"], ["High impact + low urgency", "P2 · High"], ["Low impact + high urgency", "P3 · Medium"], ["Low impact + low urgency", "P4 · Low"]], "kind": "matrix", "notes": "This reproduces the simplified matrix in the notes. Priority labels and thresholds vary; one affected bank is not automatically P1 or P3.", "visual": "priority", "takeaway": "Assess business impact and urgency together; use the organization’s agreed matrix."}, {"title": "Listen to the escalation conversation", "lead": "The notes show the evidence becoming more specific at each support level.", "items": [["L1 · NOC operator", "“Axis node not responding.” Try the approved restart; escalate if unresolved in 5 min."], ["L2 · Platform engineer", "“Connection pool exhausted.” Investigate stale connections; escalate if still unresolved."], ["L3 · Architect + Axis", "Investigate the partner upgrade and its effect on the integration."]], "kind": "flow", "notes": "The source uses a 15-minute escalation threshold for L3; the elapsed-time basis is not explicit. Do not add 5 + 15 minutes and imply the 19-minute incident lasted longer. Its API-contract hypothesis is explored as latency and coordination in the next section.", "illustrated": true}, {"title": "12:22 PM · the backup route restores payments", "lead": "The incident lasted 19 minutes. The customer can pay again, but the primary failure still needs explanation.", "items": [["Workaround", "NPCI routes Axis traffic through a backup node in the example."], ["Verify & close", "Confirm service recovery and obtain user confirmation."], ["Unanswered question", "Why did the primary node fail—and will it happen again?"]], "kind": "cards", "notes": ""}, {"title": "Measure response quality", "lead": "These are example training targets, not universal commitments.", "items": [["MTTA", "Mean Time to Acknowledge · example P1 target under 2 min."], ["MTTR", "Mean Time to Resolve · example P1 target under 30 min."], ["First contact resolution", "Share resolved by the initial support team."], ["Reopen rate", "Share reopened after being marked resolved."]], "kind": "cards", "notes": ""}, {"title": "The incident ends. The investigation continues.", "lead": "Axis payments recovered at 12:22 PM through a workaround. The incident record preserves what happened.", "items": [["This chapter", "INC-20260921-0047: 19 minutes to restore."], ["Next · Problem", "PRB-20260921-0012 asks why this incident and three earlier ones happened."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "It is 12:22 PM. Axis payments work through the backup node. What must be recorded before the incident is closed?", "answer": "Record the workaround, recovery time and verification; confirm with users and preserve the timeline in INC-20260921-0047. Link the remaining investigation to the problem record.", "next_file": "03-problem-management.html", "next_title": "Problem Management", "id": "02", "source": "02-incident-management.md", "original": "# Section 2: Incident Management\n\n## What is an Incident?\n\nAn **unplanned interruption** to a service, or a **reduction in quality** of a service.\n\nGoal: **Restore service ASAP.** Not find root cause -- just get it working again.\n\n---\n\n## UPI Example: \"Transactions are failing on Axis Bank\"\n\n**12:03 PM** -- NPCI's monitoring dashboard shows transaction success rate for Axis Bank drops from 99.2% -> 34%.\n\n---\n\n## Incident Lifecycle\n\n### Step 1: Detection & Logging\n\n| Field | Value |\n|---|---|\n| Incident ID | INC-20260921-0047 |\n| Source | Monitoring alert (auto-created) |\n| Affected Service | UPI Transaction Processing |\n| Affected Entity | Axis Bank PSP node |\n| Impact | ~2.8 crore users can't send/receive via Axis |\n| Urgency | High |\n\n### Step 2: Classification & Priority\n\nITSM uses a simple matrix:\n\n```\n                    High Urgency    Low Urgency\nHigh Impact    -->    P1 (Critical)   P2 (High)\nLow Impact     -->    P3 (Medium)     P4 (Low)\n```\n\nAxis Bank down = **High Impact + High Urgency = P1 (Critical)**\n\n### Step 3: Escalation Path\n\n```\nL1 (NOC Operator)      --> \"Axis node not responding, restarting service\"\n        |  (not resolved in 5 min)\nL2 (Platform Engineer)  --> \"Connection pool exhausted, clearing stale connections\"\n        |  (not resolved in 15 min)\nL3 (Architect + Axis)   --> \"Axis core banking upgrade broke API contract\"\n```\n\n### Step 4: Resolution & Closure\n\n- **Workaround applied:** NPCI routes Axis traffic through backup PSP node\n- **Service restored:** 12:22 PM (19 min outage)\n- **Incident closed** after user confirmation\n\n---\n\n## Key Metrics\n\n| Metric | What it measures | Target Example |\n|---|---|---|\n| **MTTA** (Mean Time to Acknowledge) | How fast we respond | P1: < 2 min |\n| **MTTR** (Mean Time to Resolve) | How fast we fix | P1: < 30 min |\n| **First Call Resolution** | Fixed at L1 itself? | > 60% |\n| **Reopen Rate** | Came back after closing? | < 5% |\n\n---\n\n## The Service Desk\n\nThe **Service Desk** is the single point of contact (SPOC) for all incidents and requests.\n\n```\nBanks / UPI Apps (PhonePe, GPay)\n        |\n   NPCI Service Desk  <-->  Monitoring Tools (auto-tickets)\n        |\n   L1 --> L2 --> L3 teams\n```\n\nIt's NOT just a helpdesk. It **owns the incident lifecycle** -- even when L3 is fixing it, the Service Desk tracks and communicates status.\n\n---\n\n## Types of Incidents at NPCI\n\n| Type | Example | Priority |\n|---|---|---|\n| Service outage | UPI completely down | P1 |\n| Degradation | Success rate drops to 85% | P2 |\n| Partial failure | One bank's transactions failing | P2/P3 |\n| User-reported | \"My VPA not working\" | P3/P4 |\n\n---\n\n## Key Takeaway\n\n> Incident Management = **firefighting with discipline**.\n> You don't investigate why the fire started. You put it out first, then investigate (that's Problem Management -- next section).\n", "filename": "02-incident-management.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
