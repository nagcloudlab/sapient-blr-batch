<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Service Catalog · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Service Catalog", "tag": "Make services discoverable", "hook": "A clear menu turns “who do I ask?” into a usable service.", "slides": [{"title": "Before HDFC can request, it must find the service", "lead": "The previous section followed HDFC’s capacity request. A service catalog makes that request discoverable: the bank can see a TPS Limit Change item, the required capacity review and the 1-business-day target.", "items": [["Find", "Browse the external catalog for TPS Limit Change."], ["Understand", "Read the required information and delivery expectation."], ["Order", "Submit the portal form to create a service request."]], "kind": "story", "notes": "Use the restaurant-menu analogy from the notes: the catalog is the menu, the request is the order. This links the HDFC example in Section 5 to its catalog item in Section 6.", "quote": "“What can I get, how do I get it, and how long will it take?”", "source_heading": "UPI Example: NPCI’s Service Catalog"}, {"title": "What can I get? How? When?", "lead": "The catalog provides structured information about available service offerings.", "items": [["Offer", "Describe the service in language users understand."], ["Request", "Explain eligibility and required information."], ["Expect", "Show ownership, approvals and delivery targets."]], "kind": "cards", "notes": ""}, {"title": "NPCI’s external catalog: what banks can request", "lead": "The catalog sets expectations before a request is submitted.", "items": [["Bank onboarding", "Compliance documents + integration form · 30 days."], ["TPS limit change", "Portal request + capacity review · 1 business day."], ["Settlement reports", "Daily/monthly data · portal download, example delivery by 6 AM."], ["Dispute filing", "API or portal submission · acknowledgment in 1 hour."], ["PSP app registration", "Compliance, security audit and sandbox testing · 45 days."]], "kind": "cards", "notes": ""}, {"title": "NPCI’s internal catalog: what engineers can request", "lead": "The same menu principle supports everyday engineering needs.", "items": [["Production access", "Manager + Security Lead · 4 hours."], ["New environment", "Infra Lead · 2 business days."], ["Monitoring dashboard", "Self-service template · 1 business day."], ["VPN credential reset", "Approved reset workflow · 30 minutes."], ["Software license", "Manager + Procurement · 3 business days."]], "kind": "cards", "notes": ""}, {"title": "Catalog item: production database read access", "lead": "Read-only access to the UPI transaction database for debugging.", "items": [["Owner & eligibility", "DBA team · example eligibility: NPCI engineers at L2 or above."], ["Required inputs", "Database name, justification and requested duration."], ["Approval & delivery", "Manager + DBA Lead · 4-hour target."], ["Category & cost", "Access Management · internal, no charge in this example."]], "kind": "catalog", "notes": ""}, {"title": "The same UPI service, two views", "lead": "The business sees an offering. The support team sees what keeps it working.", "items": [["Business view", "“UPI Payments: send money instantly; 99.9% uptime.”"], ["Technical view", "“Txn Engine v4.1 on K8s Cluster-A; Kafka, Oracle DB and PSP gateway; platform-team on call.”"]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "From a menu item to managed delivery", "lead": "A catalog entry connects the user to the operating model.", "items": [["Catalog item", "The user discovers an offering."], ["Request", "The form creates a tracked record."], ["Fulfillment", "Teams and automation deliver it."], ["Supporting records", "Service levels and CMDB give context."]], "kind": "flow", "notes": "A visible item may still have eligibility, capacity or approval restrictions. A catalog is not a guarantee of unconditional access."}, {"title": "Behind the menu is a dependency map", "lead": "The technical catalog names the transaction engine, Kafka, Oracle DB and the gateway. Support teams need their relationships too.", "items": [["This chapter", "The catalog explains the offering, owner and request path."], ["Next · CMDB", "CI-1001 and its linked items show what supports UPI Payments."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "An NPCI L2 engineer wants read-only production database access. What should the catalog show before they submit?", "answer": "The database-access item should state purpose, eligibility, DBA ownership, database name / justification / duration inputs, Manager + DBA Lead approval, and the example four-hour target.", "next_file": "07-configuration-management-cmdb.html", "next_title": "Configuration Management · CMDB", "id": "06", "source": "06-service-catalog.md", "original": "# Section 6: Service Catalog\n\n## What is a Service Catalog?\n\nA structured list of **all IT services available** to users, with details on what they get, how to request it, and what to expect.\n\nThink of it as: **\"The menu at a restaurant.\"** You don't walk into the kitchen and ask the chef -- you look at the menu, pick what you want, and place an order.\n\n---\n\n## Without vs With a Service Catalog\n\n| Without | With |\n|---|---|\n| \"Who do I email for prod access?\" | Click \"Production Access\" in the catalog -> auto-routed |\n| \"How long will it take?\" | Catalog says: \"SLA: 4 hours\" |\n| \"What do I need to provide?\" | Form asks: environment, role, justification, manager |\n| \"Is this even available?\" | If it's in the catalog, it's available |\n\n---\n\n## UPI Example: NPCI's Service Catalog\n\n### For Banks (External Catalog)\n\n| Service | Description | SLA | How to Request |\n|---|---|---|---|\n| **Bank Onboarding** | Connect your bank to UPI network | 30 days | Submit compliance docs + API integration form |\n| **TPS Limit Change** | Increase/decrease your transaction rate limit | 1 business day | Portal request + capacity review |\n| **Settlement Reports** | Daily/monthly settlement data | Auto-generated by 6 AM | Self-service download from portal |\n| **Dispute Filing** | Raise a dispute for a failed transaction | Acknowledgment: 1 hour | API call or portal submission |\n| **PSP App Registration** | Register a new UPI app (like PhonePe) | 45 days | Compliance + security audit + sandbox testing |\n\n### For Internal Teams (Internal Catalog)\n\n| Service | Description | SLA | Approval |\n|---|---|---|---|\n| **Production Access** | Read/write access to prod systems | 4 hours | Manager + Security Lead |\n| **New Environment** | Staging/QA environment setup | 2 business days | Infra Lead |\n| **Monitoring Dashboard** | Custom Grafana dashboard for your service | 1 business day | Self-service template |\n| **VPN Credential Reset** | Reset your VPN access | 30 minutes | Auto-approved |\n| **License Request** | New software license (IDE, monitoring tool) | 3 business days | Manager + Procurement |\n\n---\n\n## Anatomy of a Catalog Item\n\nEvery item in the catalog has:\n\n```\n+--------------------------------------------------+\n| Service: Production Database Access               |\n|--------------------------------------------------|\n| Description: Read-only access to UPI transaction |\n|              database for debugging               |\n|                                                   |\n| Category:    Access Management                    |\n| Owner:       Database Administration Team         |\n|                                                   |\n| Who can request: Any NPCI engineer (L2+)          |\n|                                                   |\n| What you need to provide:                         |\n|   - Database name                                 |\n|   - Justification                                 |\n|   - Duration (temporary/permanent)                |\n|                                                   |\n| Approval: Manager + DBA Lead                      |\n| SLA: 4 hours                                      |\n| Cost: Internal (no charge)                        |\n+--------------------------------------------------+\n```\n\n---\n\n## Two Views of the Catalog\n\n| View | Audience | Shows |\n|---|---|---|\n| **Business Service Catalog** | End users, banks, partners | What services are available, SLAs, how to request |\n| **Technical Service Catalog** | IT teams internally | Dependencies, infrastructure details, support teams, runbooks |\n\nSame service, different depth:\n\n```\nBusiness view:\n  \"UPI Payments -- send money instantly, 99.9% uptime\"\n\nTechnical view:\n  \"UPI Txn Engine v4.1 -- runs on K8s cluster-A, depends on\n   Kafka, Oracle DB, and PSP gateway. On-call: platform-team.\n   Runbook: wiki/upi-txn-engine\"\n```\n\n---\n\n## Connection to Previous Sections\n\n```\nService Catalog\n    |\n    +--> User picks an item --> Service Request (Section 5) is created\n    |\n    +--> Each item links to --> a Service (Section 1)\n    |\n    +--> SLA for each item defined by --> Service Level Management (Section 8)\n    |\n    +--> Infrastructure behind each item tracked in --> CMDB (Section 7, next)\n```\n\n---\n\n## Key Takeaway\n\n> The Service Catalog is the **single source of truth** for \"what can I get, how do I get it, and how long will it take?\"\n>\n> Without it, users send random emails and Slack messages. With it, every request is **standardized, trackable, and SLA-bound**.\n", "filename": "06-service-catalog.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
