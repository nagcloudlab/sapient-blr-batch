<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Knowledge Management · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Knowledge Management", "tag": "Make learning reusable", "hook": "The next engineer on call should not have to start from zero.", "slides": [{"title": "Ravi knows the fix. Ravi is on vacation.", "lead": "Monday, 2 AM: the settlement engine is stuck. Ravi has seen it before and fixes it in 10 minutes. Thursday, 3 AM: the same alert fires while Ravi is away. Priya has to investigate from scratch.", "items": [["Ravi · Monday", "10 minutes to restore a familiar issue."], ["Priya · Thursday", "2 hours rediscovering the same fix."], ["Amit · Next month", "Calls four people at 4 AM; resolution takes 3 hours."]], "kind": "story", "notes": "Include the missing third character, Amit, and the example SLA breach. Ask whether this team is dependent on one person. These timings are the source’s narrative, not predicted outcomes.", "quote": "“The knowledge was in Ravi’s head—not in the system.”", "source_heading": "The Problem Without Knowledge Management"}, {"title": "Write down what Ravi did", "lead": "The same settlement incident should leave the next engineer better prepared.", "items": [["Create", "Ravi documents the recovery steps after resolving the incident."], ["Validate", "A tech lead checks that the procedure is accurate and usable."], ["Reuse", "Priya finds the runbook at 3 AM; in the example, recovery takes 10 minutes."]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "Choose the right knowledge format", "lead": "Different questions need different kinds of guidance.", "items": [["Runbook", "How do I carry out a defined operational procedure?"], ["Known error article", "What is understood, and what workaround is available?"], ["Troubleshooting guide", "Which evidence should I inspect next?"], ["How-to / FAQ", "How do I fulfill a common need or answer a common question?"]], "kind": "cards", "notes": ""}, {"title": "KB-0042 · Restarting UPI Settlement Engine", "lead": "The concrete knowledge article from the notes gives the next on-call engineer a starting point.", "items": [["Owner & revision", "Platform Engineering · updated 15 September 2026."], ["Related CIs", "CI-1005: Settlement Engine; CI-3012: Oracle DB."], ["When to use", "Batch stuck for more than 30 min; BATCH_TIMEOUT_EXCEEDED in logs."], ["Pre-checks", "Check batch state, active work and database connectivity before recovery."]], "kind": "catalog", "notes": "The source command sample is internally inconsistent. Preserve the article identity, trigger and structure; teach verified procedures rather than reproducing those commands."}, {"title": "Walk Priya through the runbook", "lead": "Explain the recovery sequence and expected checks without relying on Ravi’s memory.", "items": [["Prepare", "Confirm the trigger and safe state; drain work using the validated procedure."], ["Recover", "Clear the stuck batch and restart through approved operations."], ["Verify", "Check health, queue state and that processing resumes."], ["Escalate", "If recovery fails, involve L3 / DBA; rerun missed work only after validation."]], "kind": "flow", "notes": "Teaching adaptation of KB-0042, not an executable runbook. The source says to scale the service to zero, then call its API; it also mixes Oracle with psql. These commands are not copied into the slides."}, {"title": "Knowledge has a lifecycle", "lead": "Publishing is one step, not the end.", "items": [["Create", "Capture useful evidence and actions."], ["Review", "Validate accuracy with a peer."], ["Publish & use", "Make it searchable and link it to work."], ["Update", "Revise when behavior or dependencies change."], ["Retire", "Archive obsolete guidance."]], "kind": "flow", "notes": ""}, {"title": "Document as you solve", "lead": "Knowledge-Centered Service makes learning part of the support workflow.", "items": [["Search first", "Reuse existing knowledge before creating a duplicate."], ["Improve in context", "Correct gaps while working on the issue."], ["Capture what helped", "Link the article to the incident and affected service."]], "kind": "cards", "notes": ""}, {"title": "Measure usefulness, not just volume", "lead": "Look for evidence that people find and trust the knowledge.", "items": [["Reuse", "How often articles help with real support work."], ["Freshness", "Whether important guidance is reviewed and current."], ["Resolution time", "Compare similar cases with and without useful guidance."], ["Contribution", "Whether teams capture and improve learning."]], "kind": "cards", "notes": ""}, {"title": "A shared fix becomes an improvement opportunity", "lead": "KB-0042 helps the next engineer respond. Across incidents, the team can also spot opportunities to make recovery faster and failures less frequent.", "items": [["This chapter", "Create, review, reuse and update knowledge as part of support."], ["Next · Improvement", "Use a measured PDCA experiment and the CSI register to act on recurring evidence."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "Priya gets the settlement alert at 3 AM while Ravi is away. How should KB-0042 help her, and what should she do if it is outdated?", "answer": "The article should provide the trigger, pre-checks, validated recovery steps, expected results and escalation path. If the steps no longer match the service, stop and involve the owner; validate and update the article rather than improvising from stale commands.", "next_file": "10-continual-improvement.html", "next_title": "Continual Improvement", "id": "09", "source": "09-knowledge-management.md", "original": "# Section 9: Knowledge Management\n\n## What is Knowledge Management?\n\nCapturing, organizing, and sharing knowledge so that **people don't solve the same problem twice**.\n\nThink of it as: **\"If the engineer who fixed it at 3 AM quits tomorrow, can someone else fix it next time?\"**\n\n---\n\n## The Problem Without Knowledge Management\n\n```\nMonday 2 AM:\n  Alert: Settlement engine stuck\n  Ravi (senior engineer) fixes it in 10 min -- he's seen this before\n\nThursday 3 AM:\n  Same alert. Ravi is on vacation.\n  Priya spends 2 hours figuring it out from scratch.\n\nNext month:\n  Same alert. New joiner Amit has no idea. Calls 4 people at 4 AM.\n  Takes 3 hours. SLA breached.\n```\n\n**The knowledge was in Ravi's head -- not in the system.**\n\n---\n\n## UPI Example: NPCI's Knowledge Base\n\n### Knowledge Article Types\n\n| Type | Purpose | UPI Example |\n|---|---|---|\n| **Runbook** | Step-by-step procedure for operations | \"How to restart the settlement engine\" |\n| **Known Error Article** | Workaround for a known issue | \"Axis Bank timeout -- switch to backup node\" |\n| **Troubleshooting Guide** | Decision tree for diagnosing issues | \"Transaction failing? Check: PSP -> Gateway -> Bank -> DB\" |\n| **How-To** | Instructions for common requests | \"How to onboard a new bank to UPI\" |\n| **FAQ** | Common questions answered | \"What happens if settlement misses the 6 AM window?\" |\n\n### Sample Runbook\n\n```\nKB-0042: Restarting UPI Settlement Engine\n=========================================\nLast updated: Sep 15, 2026\nAuthor: Platform Engineering\nRelated CIs: CI-1005 (Settlement Engine), CI-3012 (Oracle DB)\n\nWHEN TO USE:\n  - Settlement batch job stuck for > 30 min\n  - Error: \"BATCH_TIMEOUT_EXCEEDED\" in logs\n\nPRE-CHECKS:\n  1. Confirm no active settlement in progress\n     $ curl http://settlement-engine:8080/api/status\n     Expected: {\"state\": \"IDLE\"} or {\"state\": \"STUCK\"}\n\n  2. Verify DB connectivity\n     $ psql -h settlement-db -c \"SELECT 1\"\n\nSTEPS:\n  1. Drain in-flight requests\n     $ kubectl scale deployment settlement-engine --replicas=0\n     Wait 60 seconds\n\n  2. Clear stuck batch\n     $ curl -X POST http://settlement-engine:8080/api/batch/clear\n\n  3. Restart\n     $ kubectl scale deployment settlement-engine --replicas=3\n     Wait for all pods READY\n\n  4. Verify\n     $ curl http://settlement-engine:8080/api/health\n     Expected: {\"status\": \"UP\", \"batchQueue\": 0}\n\n  5. Trigger missed settlement\n     $ curl -X POST http://settlement-engine:8080/api/batch/run\n\nROLLBACK:\n  If step 3 fails, escalate to L3 (DBA team) -- possible DB lock issue.\n\nRELATED INCIDENTS:\n  INC-20260801-0023, INC-20260815-0091, INC-20260902-0017\n```\n\n**This runbook turns a 2-hour struggle into a 10-minute procedure for anyone.**\n\n---\n\n## Knowledge Lifecycle\n\n```\nCreate --> Review --> Publish --> Use --> Update --> Retire\n```\n\n| Stage | What happens | UPI Example |\n|---|---|---|\n| **Create** | Engineer writes article after resolving an incident | Ravi documents settlement restart steps |\n| **Review** | Peer or lead validates accuracy | Tech lead verifies the commands work |\n| **Publish** | Made available in knowledge base | Added to NPCI internal wiki |\n| **Use** | L1/L2 follows it during next incident | Priya uses runbook at 3 AM -- fixes it in 10 min |\n| **Update** | Article revised when service changes | Engine upgraded to v4.2 -- new health check endpoint |\n| **Retire** | Article removed when no longer relevant | Old v3.x runbook archived |\n\n---\n\n## Knowledge-Centered Service (KCS)\n\nA practice where **solving and documenting happen at the same time**:\n\n```\nTraditional:\n  Fix incident --> close ticket --> maybe document later (usually never)\n\nKCS:\n  Fix incident --> document while fixing --> attach article to ticket --> close\n```\n\n| KCS Rule | Meaning |\n|---|---|\n| **Solve and document together** | Write the KB article AS you fix the issue |\n| **Reuse before create** | Search KB first -- don't duplicate |\n| **Improve what exists** | Found a KB article but it's outdated? Update it now |\n| **Everyone contributes** | Not just seniors -- L1 engineers add articles too |\n\n---\n\n## How Knowledge Connects to Incidents\n\n```\nNew Incident arrives\n       |\n       v\nSearch Knowledge Base\n       |\n  +----+----+\n  |         |\nFound     Not found\n  |         |\n  v         v\nFollow    Investigate\nrunbook   manually\n  |         |\n  v         v\nResolved  Resolved\n  |         |\n  |         +--> CREATE new KB article\n  |\n  +--> Was article accurate?\n         |          |\n        Yes        No\n         |          |\n       Close     UPDATE article, then close\n```\n\n---\n\n## Measuring Knowledge Management\n\n| Metric | What it measures | Target |\n|---|---|---|\n| **KB usage rate** | % of incidents where KB article was used | > 50% |\n| **First call resolution** | Solved at L1 using KB? | > 60% |\n| **Article freshness** | % of articles reviewed in last 6 months | > 80% |\n| **Time to resolve (KB vs no KB)** | Faster when KB exists? | KB incidents 3x faster |\n| **Contribution rate** | New articles created per month | Every P1/P2 -> mandatory article |\n\n---\n\n## Connection to Previous Sections\n\n```\nKnowledge Management captures learnings from:\n  |\n  +-- Incident (Sec 2): Runbooks for recurring issues\n  +-- Problem (Sec 3): RCA findings documented as Known Error articles\n  +-- Change (Sec 4): Post-implementation reviews -> lessons learned\n  +-- Service Request (Sec 5): How-to guides for common requests\n  +-- CMDB (Sec 7): KB articles linked to specific CIs\n  +-- SLA (Sec 8): KB usage improves MTTR -> protects SLA\n```\n\n---\n\n## Key Takeaway\n\n> Knowledge in one person's head is a **risk**. Knowledge in a shared system is an **asset**.\n>\n> The goal: **any L1 engineer at 3 AM should be able to resolve what your best L3 engineer solved last month** -- because it's documented, searchable, and current.\n", "filename": "09-knowledge-management.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
