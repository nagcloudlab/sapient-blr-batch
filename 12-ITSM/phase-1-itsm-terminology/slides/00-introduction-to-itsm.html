<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Introduction to ITSM · ITSM classroom</title><link rel="stylesheet" href="assets/deck.css"></head><body><main id="viewport"><div id="stage"></div></main><nav class="controls" aria-label="Presentation controls"><a href="index.html" title="All topics">All topics</a><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview">Overview</button><button id="notes">Notes</button><button id="fullscreen">Fullscreen</button><button id="print">Print / PDF</button></nav><dialog id="panel"><button class="close">Close ×</button><div id="panelbody"></div></dialog><script id="data" type="application/json">{"title": "Introduction to ITSM", "tag": "A system for running IT", "hook": "Reliable payments start with reliable ways of working.", "slides": [{"title": "Imagine you are on the NPCI team", "lead": "It is 2 PM. A developer pushes a configuration change. UPI transactions start failing, but nobody knows who changed what. A bank reports that payments have been stuck since morning.", "items": [["Now", "Teams duplicate the investigation and users wait."], ["Tonight", "The on-call engineer has no runbook or escalation path."], ["Next month", "The same issue returns and is treated as brand new."]], "kind": "story", "notes": "Open with the actual imagined situation in the notes. Ask the class who should own the response. This 2 PM introduction is a separate hypothetical scene from the 12:03 Axis incident used in Sections 2–4. Do not combine their timelines.", "quote": "“Three teams are investigating. Who is coordinating the response?”", "source_heading": "The Problem: IT Without Structure"}, {"title": "Give each unanswered question an owner", "lead": "Return to the 2 PM configuration failure. Which practice answers each question?", "items": [["“Who is fixing it?”", "Incident Management assigns and tracks restoration."], ["“Why again?”", "Problem Management investigates repeated failures."], ["“Who changed it?”", "Change records reveal scope, timing and authorization."], ["“Who knows the fix?”", "Knowledge Management preserves a usable runbook."]], "kind": "cards", "notes": ""}, {"title": "ITSM makes the work repeatable", "lead": "IT Service Management organizes how we plan, deliver, operate and improve IT services.", "items": [["Predictability", "A clear process for the next incident or request."], ["Accountability", "An owner, a record and an escalation path."], ["Learning", "Use evidence to improve the next response."]], "kind": "cards", "notes": "", "illustrated": true}, {"title": "Why this matters for your training", "lead": "As engineers joining Publicis Sapient client teams, these notes prepare you to participate in production operations.", "items": [["Support", "Raise and resolve incidents using the client’s service-management tools."], ["Delivery", "Submit production changes through the agreed process."], ["Learning", "Join RCA / post-incident reviews and follow service-level commitments."]], "kind": "cards", "notes": ""}, {"title": "Our running example: NPCI UPI", "lead": "Follow the same people, apps, platform and banks throughout the course.", "items": [["You & merchants", "Need to send and receive money."], ["UPI apps", "PhonePe, Google Pay, Paytm, BHIM and bank apps."], ["NPCI platform", "Transaction, settlement, registration and dispute services."], ["Banks", "SBI, HDFC, ICICI and Axis participate in the payment."]], "kind": "flow", "notes": ""}, {"title": "Learn the ticket language", "lead": "The record tells you what kind of work is happening.", "items": [["INC · Incident", "Restore an interrupted or degraded service."], ["PRB · Problem", "Investigate causes and reduce recurrence."], ["CHG · Change", "Control a modification that affects a service."], ["REQ · Request", "Fulfill a user’s need."], ["KE · Known error", "An analyzed problem that remains unresolved."]], "kind": "cards", "notes": ""}, {"title": "How the practices fit together", "lead": "Follow one issue from detection to lasting improvement.", "items": [["Incident", "Restore payments."], ["Problem", "Understand the cause."], ["Change", "Introduce the fix safely."], ["Knowledge", "Make the learning reusable."], ["Improvement", "Measure results and choose the next opportunity."]], "kind": "flow", "notes": ""}, {"title": "Your supporting toolkit", "lead": "These practices provide the context for everyday decisions.", "items": [["Service & catalog", "What value do we deliver, and what can users request?"], ["CMDB", "Which components and relationships support the service?"], ["Service levels", "What do we measure, target and agree?"], ["Service desk", "A contact point that coordinates support and communication."]], "kind": "cards", "notes": ""}, {"title": "The language you will hear", "lead": "Expand the acronym before using it in a conversation.", "items": [["NOC · Network Operations Center", "Monitors operations and responds to alerts."], ["RCA · Root Cause Analysis", "Investigates how and why a failure happened."], ["PIR · Post-Incident Review", "Captures lessons and follow-up actions."], ["ITIL", "A framework of service management guidance."]], "kind": "cards", "notes": ""}, {"title": "Names in our payment story", "lead": "Decode the terms before following the incident.", "items": [["NPCI", "National Payments Corporation of India: the platform operator in our story."], ["UPI", "Unified Payments Interface: the payment service we follow."], ["PSP", "Payment Service Provider: a participant in delivering payments."], ["VPA", "Virtual Payment Address: a UPI ID such as yourname@upi."]], "kind": "cards", "notes": ""}, {"title": "Our first question: what is the service?", "lead": "We have met NPCI, the payment apps, the banks and the support teams. Start with the outcome that brings them together.", "items": [["This chapter", "ITSM gives teams repeatable ownership, response and learning."], ["Next · Service", "Follow a ₹500 payment and separate customer value from underlying technology."]], "kind": "bridge", "notes": "", "source_heading": "Connection to Previous Sections / Key Takeaway"}], "question": "Payments fail after a deployment. Which practice restores service, and which investigates recurrence?", "answer": "Incident Management coordinates restoration. Problem Management investigates causes. Change Management controls the resulting fix.", "next_file": "01-service-and-it-service.html", "next_title": "Service & IT Service", "id": "00", "source": "00-introduction-to-itsm.md", "original": "# Section 0: Introduction to ITSM\n\n## The Problem: IT Without Structure\n\nImagine NPCI runs UPI -- 14+ billion transactions/month, 400+ banks connected, 300+ million daily users.\n\nNow imagine:\n\n- A developer pushes a config change at 2 PM. Transactions start failing. Nobody knows who changed what.\n- A bank reports \"payments stuck since morning.\" Three teams investigate the same issue independently. No one talks to each other.\n- An outage happens at night. The on-call engineer has no runbook, no escalation path, no idea who to call.\n- Same issue happens every month. Each time it's treated as brand new.\n\n**This is IT without ITSM -- reactive, chaotic, and expensive.**\n\n---\n\n## What is ITSM?\n\n**IT Service Management (ITSM)** = a set of policies, processes, and procedures to plan, deliver, operate, and improve IT services.\n\nIn one line: **\"How do we run IT like a well-managed business, not a fire station?\"**\n\n### Without ITSM vs With ITSM\n\n| Without ITSM | With ITSM |\n|---|---|\n| \"Server is down, someone fix it\" | Incident logged, prioritized, assigned, tracked |\n| \"Why does this keep happening?\" | Problem record tracks root cause, prevents recurrence |\n| \"Who changed the firewall rules?\" | Every change is reviewed, approved, and recorded |\n| \"Can I get access to prod?\" | Service request with approval workflow |\n| \"What are we even responsible for?\" | Service catalog lists every service with owners |\n| \"Did we meet our uptime promise?\" | SLAs measured and reported automatically |\n\n---\n\n## Why Should You Care?\n\nAs engineers joining a large enterprise like Publicis Sapient, you will:\n\n1. **Work on client systems** that follow ITSM processes -- you need to speak the language\n2. **Raise and resolve incidents** through tools like ServiceNow, Jira Service Management\n3. **Submit change requests** before deploying to production\n4. **Participate in problem reviews** (RCA/PIR) after major outages\n5. **Operate within SLAs** that your team is measured against\n\nITSM is not theory -- it's **how production IT actually works** in banks, telecom, healthcare, and every large org.\n\n---\n\n## Our Running Example: NPCI UPI\n\nThroughout these sections, we'll use **NPCI's UPI platform** as our example because:\n\n- It's a **real, critical national infrastructure** you use daily\n- It involves **multiple organizations** (NPCI, banks, payment apps)\n- It has **extreme scale** (14B+ txns/month) and **zero tolerance for downtime**\n- It requires every ITSM practice we'll learn\n\n### NPCI's IT Landscape (Simplified)\n\n```\n+---------------------------------------------------------------+\n|                        End Users                               |\n|  (You, merchants, businesses -- 300M+ daily active)           |\n+-------------------------------+-------------------------------+\n                                |\n+-------------------------------v-------------------------------+\n|                     UPI Apps (PSPs)                            |\n|  PhonePe | Google Pay | Paytm | BHIM | Bank Apps              |\n+-------------------------------+-------------------------------+\n                                |\n+-------------------------------v-------------------------------+\n|                     NPCI UPI Platform                          |\n|  +-------------+ +-------------+ +-------------+             |\n|  | Transaction | | Settlement  | | Dispute     |             |\n|  | Engine      | | Engine      | | Resolution  |             |\n|  +-------------+ +-------------+ +-------------+             |\n|  +-------------+ +-------------+ +-------------+             |\n|  | Registration| | Merchant    | | Monitoring  |             |\n|  | Service     | | Onboarding  | | & Alerts    |             |\n|  +-------------+ +-------------+ +-------------+             |\n+-------------------------------+-------------------------------+\n                                |\n+-------------------------------v-------------------------------+\n|                     Banks (Issuers & Acquirers)               |\n|  SBI | HDFC | ICICI | Axis | 400+ banks                      |\n+---------------------------------------------------------------+\n```\n\n---\n\n## Glossary of Abbreviations\n\nThese abbreviations appear throughout ITSM and in tools like ServiceNow:\n\n### ITSM Ticket Prefixes\n\n| Prefix | Full Form | Meaning |\n|---|---|---|\n| **INC** | Incident | Something broke, restore it |\n| **PRB** | Problem | Root cause investigation |\n| **CHG** | Change Request | Planned modification to a service |\n| **REQ** | Service Request | User needs something (access, info, setup) |\n| **KE** | Known Error | Root cause found, permanent fix pending |\n\n### Domain & Infrastructure Terms\n\n| Term | Full Form | What it means |\n|---|---|---|\n| **NPCI** | National Payments Corporation of India | Operates UPI, IMPS, RuPay, etc. |\n| **UPI** | Unified Payments Interface | Real-time inter-bank payment system |\n| **PSP** | Payment Service Provider | Apps authorized to offer UPI (PhonePe, GPay, Paytm) |\n| **VPA** | Virtual Payment Address | Your UPI ID (e.g., yourname@upi) |\n| **NOC** | Network Operations Center | 24/7 monitoring team watching dashboards |\n| **CAB** | Change Advisory Board | Group that reviews and approves changes |\n| **CMDB** | Configuration Management Database | Map of all IT assets and relationships |\n| **SLA** | Service Level Agreement | Formal promise between provider and consumer |\n| **SLO** | Service Level Objective | Internal target (stricter than SLA) |\n| **SLI** | Service Level Indicator | The actual measured metric |\n| **MTTA** | Mean Time to Acknowledge | How fast we respond to an incident |\n| **MTTR** | Mean Time to Resolve | How fast we fix an incident |\n| **MTBF** | Mean Time Between Failures | How often things break |\n| **RCA** | Root Cause Analysis | Investigation into why something failed |\n| **PIR** | Post-Incident Review | Meeting after a major incident to learn |\n| **SPOC** | Single Point of Contact | One team/person as the entry point (Service Desk) |\n| **ITIL** | Information Technology Infrastructure Library | The framework behind ITSM best practices |\n\n---\n\n## ITSM Sections Roadmap\n\nWe'll build ITSM understanding one concept at a time, each with a UPI example:\n\n| # | Topic | One-line Summary |\n|---|---|---|\n| 01 | Service & IT Service | What are we managing? |\n| 02 | Incident Management | Something broke -- restore it NOW |\n| 03 | Problem Management | WHY did it break? Prevent recurrence |\n| 04 | Change Management | Control changes so they don't cause incidents |\n| 05 | Service Request Management | \"I need access / a new environment\" |\n| 06 | Service Catalog | Menu of all services you can request |\n| 07 | Configuration Management (CMDB) | Map of all IT assets and their relationships |\n| 08 | Service Level Management | SLA, SLO, SLI -- promises and measurement |\n| 09 | Knowledge Management | Document what you know so others don't reinvent |\n| 10 | Continual Improvement | Never stop getting better |\n\nEach section builds on the previous. By the end, you'll see how these practices connect into a **complete system** for managing IT.\n\n---\n\n## Key Insight Before We Begin\n\n> ITSM is not about bureaucracy or slowing things down.\n> It's about **predictability, accountability, and learning from mistakes**.\n>\n> When UPI goes down for 30 minutes, NPCI doesn't want heroes who magically fix things.\n> They want a **system** that detects, responds, resolves, and prevents -- every single time.\n", "filename": "00-introduction-to-itsm.html"}</script><script src="assets/visuals.js"></script><script src="assets/deck.js"></script></body></html>
