<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodExpress - Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation (same as index) -->
  <nav class="navbar navbar-dark" style="background-color: #2c3e50;">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">FoodExpress</a>
      <span class="navbar-text">
        <a href="index.html" class="text-white text-decoration-none">← Back to Restaurants</a>
      </span>
    </div>
  </nav>

  <!-- Checkout Form -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4">Checkout</h2>

        <form id="checkout-form">
          <!-- Delivery Address -->
          <h4>Delivery Address</h4>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="phone">
              <!-- Note: validation bug is Module 03 task (JS) -->
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-8">
              <label class="form-label">Street Address</label>
              <input type="text" class="form-control" id="address" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">City</label>
              <input type="text" class="form-control" id="city" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Delivery Instructions (optional)</label>
            <textarea class="form-control" id="instructions" rows="2" placeholder="e.g., Ring doorbell, leave at door"></textarea>
          </div>

          <!-- Payment Info -->
          <h4 class="mt-4">Payment</h4>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Card Number</label>
              <input type="text" class="form-control" id="card-number" placeholder="1234 5678 9012 3456">
            </div>
            <div class="col-md-3">
              <label class="form-label">Expiry</label>
              <input type="text" class="form-control" id="expiry" placeholder="MM/YY">
            </div>
            <div class="col-md-3">
              <label class="form-label">CVV</label>
              <input type="text" class="form-control" id="cvv" placeholder="123">
            </div>
          </div>

          <!-- Order Summary -->
          <div class="card mt-4 mb-4">
            <div class="card-body">
              <h5>Order Summary</h5>
              <div id="checkout-items">
                <!-- Items populated by JS in Module 03 -->
                <p class="text-muted">No items yet</p>
              </div>
              <hr>
              <div class="d-flex justify-content-between">
                <span>Subtotal:</span>
                <span>$0.00</span>
              </div>
              <div class="d-flex justify-content-between text-muted">
                <span>Delivery Fee:</span>
                <span>$2.99</span>
              </div>
              <hr>
              <div id="checkout-total" class="fw-bold fs-5 d-flex justify-content-between">
                <span>Total:</span>
                <span class="text-danger">$2.99</span>
              </div>
            </div>
          </div>

          <!-- BUG #8: These buttons misalign on Safari and small screens -->
          <div class="checkout-actions">
            <h5>Total: <span id="final-total" class="text-danger">$2.99</span></h5>
            <button type="submit" class="btn btn-lg btn-success">Place Order</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
