<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodExpress - Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-dark" style="background-color: #2c3e50;">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-bicycle text-danger"></i> FoodExpress
      </a>
      <a href="index.html" class="text-white text-decoration-none">
        <i class="bi bi-arrow-left"></i> Back to Restaurants
      </a>
    </div>
  </nav>

  <!-- Checkout Form -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4"><i class="bi bi-bag-check"></i> Checkout</h2>

        <form id="checkout-form">
          <!-- Delivery Address -->
          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0"><i class="bi bi-geo-alt"></i> Delivery Address</h5>
            </div>
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone Number</label>
                  <input type="tel" class="form-control" id="phone" required>
                </div>
              </div>
              <div class="row mb-3">
                <div class="col-md-8">
                  <label class="form-label">Street Address</label>
                  <input type="text" class="form-control" id="address" placeholder="123 Main St, Apt 4B" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">City</label>
                  <input type="text" class="form-control" id="city" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Delivery Instructions (optional)</label>
                <textarea class="form-control" id="instructions" rows="2" placeholder="e.g., Ring doorbell, leave at door"></textarea>
              </div>
            </div>
          </div>

          <!-- Payment -->
          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0"><i class="bi bi-credit-card"></i> Payment</h5>
            </div>
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Card Number</label>
                  <input type="text" class="form-control" id="card-number" placeholder="1234 5678 9012 3456">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Expiry</label>
                  <input type="text" class="form-control" id="expiry" placeholder="MM/YY">
                </div>
                <div class="col-md-3">
                  <label class="form-label">CVV</label>
                  <input type="text" class="form-control" id="cvv" placeholder="123">
                </div>
              </div>
            </div>
          </div>

          <!-- Order Summary -->
          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0"><i class="bi bi-receipt"></i> Order Summary</h5>
            </div>
            <div class="card-body">
              <div id="checkout-items">
                <p class="text-muted">No items in cart</p>
              </div>
              <hr>
              <div class="d-flex justify-content-between">
                <span>Subtotal:</span>
                <span id="checkout-subtotal">$0.00</span>
              </div>
              <div class="d-flex justify-content-between">
                <span>Delivery Fee:</span>
                <span id="checkout-delivery">$2.99</span>
              </div>
              <hr>
              <div class="d-flex justify-content-between fw-bold fs-5">
                <span>Total:</span>
                <span id="checkout-total" class="text-danger">$2.99</span>
              </div>
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-danger btn-lg">
              <i class="bi bi-bag-check"></i> Place Order
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
