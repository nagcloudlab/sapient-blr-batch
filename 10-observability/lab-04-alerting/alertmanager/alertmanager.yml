global:
  resolve_timeout: 1m

route:
  receiver: "default"
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    - match:
        severity: critical
      receiver: "critical-alerts"
      continue: true
    - match:
        severity: warning
      receiver: "warning-alerts"

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://webhook-logger:9095/alerts"

  - name: "critical-alerts"
    webhook_configs:
      - url: "http://webhook-logger:9095/alerts"
        send_resolved: true

  # To use Slack, uncomment and add your webhook URL:
  # - name: "slack-alerts"
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  #       channel: "#alerts"
  #       title: '{{ .CommonAnnotations.summary }}'
  #       text: '{{ .CommonAnnotations.description }}'
  #       send_resolved: true

  - name: "warning-alerts"
    webhook_configs:
      - url: "http://webhook-logger:9095/alerts"
        send_resolved: true

  # To use email, uncomment:
  # - name: "email-alerts"
  #   email_configs:
  #     - to: "team@example.com"
  #       from: "alerts@example.com"
  #       smarthost: "smtp.gmail.com:587"
  #       auth_username: "alerts@example.com"
  #       auth_password: "app-password"
