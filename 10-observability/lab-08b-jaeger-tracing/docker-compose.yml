version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - observability

  order-service:
    build: .
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      - PAYMENT_HOST=payment-service
      - NOTIFY_HOST=notification-service
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    command: ["node", "--require", "./tracing.js", "order-service-v3.js"]
    networks:
      - observability
    depends_on:
      - jaeger

  payment-service:
    build: .
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      - OTEL_SERVICE_NAME=payment-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    command: ["node", "--require", "./tracing.js", "payment-service.js"]
    networks:
      - observability
    depends_on:
      - jaeger

  notification-service:
    build: .
    container_name: notification-service
    ports:
      - "8082:8082"
    environment:
      - OTEL_SERVICE_NAME=notification-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    command: ["node", "--require", "./tracing.js", "notification-service.js"]
    networks:
      - observability
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - observability

networks:
  observability:
    driver: bridge
