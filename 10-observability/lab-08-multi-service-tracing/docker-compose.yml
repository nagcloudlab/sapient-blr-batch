version: '3.8'

services:
  order-service:
    build: .
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      - PAYMENT_HOST=payment-service
      - NOTIFY_HOST=notification-service
    command: ["node", "order-service-v3.js"]
    networks:
      - observability

  payment-service:
    build: .
    container_name: payment-service
    ports:
      - "8081:8081"
    command: ["node", "payment-service.js"]
    networks:
      - observability

  notification-service:
    build: .
    container_name: notification-service
    ports:
      - "8082:8082"
    command: ["node", "notification-service.js"]
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning
    networks:
      - observability

networks:
  observability:
    driver: bridge
