input {
  beats {
    port => 5000
  }
}

filter {
  # Parse the JSON message from the container log
  if [message] {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  # Drop non-JSON / binary garbage
  if "_jsonparsefailure" in [tags] {
    drop {}
  }

  # Extract service name
  if [app][service] {
    mutate {
      add_field => { "service_name" => "%{[app][service]}" }
    }
  } else if [app][logger_name] {
    mutate {
      add_field => { "service_name" => "payment-service" }
    }
  }

  # Extract log level
  if [app][level] {
    mutate {
      add_field => { "log_level" => "%{[app][level]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "services-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
