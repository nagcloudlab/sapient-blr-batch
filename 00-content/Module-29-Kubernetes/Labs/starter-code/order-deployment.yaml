apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foodexpress-prod
  labels:
    app: order-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: foodexpress/order-service:1.2.0
          # BUG 2: Container port is 3000 but the Spring Boot app listens on 8080
          ports:
            - containerPort: 3000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: foodexpress-config
                  key: DATABASE_HOST
          # BUG 3: No resource requests or limits defined
          # Missing: resources.requests and resources.limits
          livenessProbe:
            httpGet:
              # BUG 1: Wrong health endpoint path -- app exposes /actuator/health, not /health
              path: /health
              port: 8080
            # BUG 4: initialDelaySeconds too short -- Spring Boot needs 20-30s to start
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
