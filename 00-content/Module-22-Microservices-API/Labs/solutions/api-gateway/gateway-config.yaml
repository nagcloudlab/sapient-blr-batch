# FoodExpress API Gateway Configuration (FIXED)
#
# ALL BUGS FIXED:
# FIX 1: Route prefixes corrected to /api/restaurants, /api/orders, etc.
# FIX 2: Rate limiting added with RequestRateLimiter filter
# FIX 3: JWT validation filter added for protected endpoints

server:
  port: 8000

spring:
  application:
    name: foodexpress-gateway
  cloud:
    gateway:
      routes:
        # Restaurant Service
        # FIX 1: Corrected route prefix to /api/restaurants
        - id: restaurant-service
          uri: http://restaurant-service:8081
          predicates:
            - Path=/api/restaurants/**
          filters:
            - StripPrefix=1
            # FIX 2: Added rate limiting per route
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Order Service
        # FIX 1: Corrected route prefix
        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
            # FIX 2: Rate limiting
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"
            # FIX 3: JWT validation for order endpoints
            - name: JwtAuthentication

        # Delivery Service
        - id: delivery-service
          uri: http://delivery-service:8083
          predicates:
            - Path=/api/deliveries/**
          filters:
            - StripPrefix=1
            - name: JwtAuthentication

        # Payment Service
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
            # FIX 3: JWT validation is critical for payment endpoints
            - name: JwtAuthentication
            # FIX 2: Stricter rate limiting for payment endpoints
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@userKeyResolver}"

      # Default filters (applied to all routes)
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY

      # CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

  # FIX 2: Redis configuration for rate limiting
  redis:
    host: redis
    port: 6379

# FIX 3: JWT configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 3600

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
