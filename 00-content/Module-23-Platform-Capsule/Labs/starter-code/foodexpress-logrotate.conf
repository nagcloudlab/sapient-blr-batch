# FoodExpress Log Rotation Configuration
# Place in /etc/logrotate.d/foodexpress

# BUG: Wrong log path -- /var/logs/ should be /var/log/
/var/logs/foodexpress/*.log {
    daily
    rotate 7
    missingok
    notifempty
    # BUG: Missing 'compress' and 'delaycompress' directives
    # Old rotated logs stay uncompressed, wasting disk space
    copytruncate
    dateext
    dateformat -%Y%m%d
    create 0644 foodexpress foodexpress
    postrotate
        # Notify application to reopen log files
        systemctl reload order-service 2>/dev/null || true
        systemctl reload payment-service 2>/dev/null || true
    endscript
}
