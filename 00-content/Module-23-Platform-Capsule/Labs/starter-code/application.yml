# FoodExpress Order Service Configuration
# BUG: Port 8082 conflicts with Payment Service (should be 8081)
server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    # BUG: Host 'db-server' is wrong; should be 'localhost' or 'mysql-host'
    url: jdbc:mysql://db-server:3306/foodexpress_orders?useSSL=false&serverTimezone=UTC
    username: foodexpress_app
    password: FE_db_2026!
    hikari:
      # BUG: Pool size of 2 is too small for production (should be 10-20)
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# BUG: Log level set to DEBUG in production (should be INFO or WARN)
logging:
  level:
    root: DEBUG
    com.foodexpress: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: /var/log/foodexpress/order-service.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Rest client settings for inter-service calls
foodexpress:
  services:
    restaurant-service:
      url: http://localhost:3000
      # BUG: No timeout configured -- threads will block indefinitely
      # Should have: timeout: 5000
    payment-service:
      url: http://localhost:8082

# BUG: No circuit breaker configuration
# Should have resilience4j config:
# resilience4j:
#   circuitbreaker:
#     instances:
#       restaurantService:
#         slidingWindowSize: 10
#         failureRateThreshold: 50
#         waitDurationInOpenState: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
