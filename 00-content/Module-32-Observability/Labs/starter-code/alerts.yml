groups:
  - name: foodexpress-alerts
    rules:
      - alert: HighErrorRate
        # BUG 1: Threshold 0.001 (0.1%) is too low -- normal error rate is ~0.2%
        # This causes constant alerting (alert fatigue)
        expr: >
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.001
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: >
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1.0
        # BUG 2: 'for: 0m' fires immediately on any single spike
        # Should be 'for: 5m' to buffer transient spikes
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency on {{ $labels.service }}"
          description: "p99 latency is {{ $value }}s"

      - alert: HighCPU
        # BUG 3: Threshold of 50% is too low -- CPU at 60% is normal during lunch rush
        # Should be 90% to indicate real saturation
        expr: >
          100 - (avg by(instance)
            (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100
          ) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      - alert: PodCrashLooping
        expr: >
          rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes"
