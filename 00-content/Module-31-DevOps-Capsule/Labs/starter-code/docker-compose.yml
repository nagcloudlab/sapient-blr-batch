# FoodExpress Local Development Environment
# BUG: version '2' is outdated; use '3.8' or omit for modern Docker Compose
version: '2'

services:
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/foodexpress_orders
      # BUG: Hardcoded password in compose file
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    # BUG: No depends_on -- service may start before MySQL is ready
    # BUG: No healthcheck defined

  menu-service:
    build:
      context: ./menu-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/foodexpress_menu
      - SPRING_DATASOURCE_PASSWORD=rootpassword

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3306:3306"
    # BUG: No volume for data persistence -- data lost on container restart
