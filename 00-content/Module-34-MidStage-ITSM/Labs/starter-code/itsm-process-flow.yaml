# FoodExpress ITSM Process Flow Configuration
# THIS FILE CONTAINS 5 BUGS -- Find and fix them all!

service_categories:
  - name: Application
    subcategories:
      - Order
      - Menu
      - Delivery
      - Notification
  - name: Infrastructure
    subcategories:
      - Network
      - Server
      - Database
      - Payment            # Bug 1: Payment is an Application, not Infrastructure
      - Storage

# Bug 2: Impact High + Urgency High should be P1, not P3
priority_matrix:
  high_high: P3            # Should be P1
  high_medium: P2
  high_low: P3
  medium_high: P2
  medium_medium: P3
  medium_low: P4
  low_high: P3
  low_medium: P4
  low_low: P5

# Bug 3: P1 escalation is 24 hours (far too long for critical)
escalation_timers:
  P1:
    first_escalation: 24h  # Should be 15 minutes
    management_notification: 48h  # Should be 30 minutes
  P2:
    first_escalation: 4h
    management_notification: 8h
  P3:
    first_escalation: 8h
    management_notification: 24h

# Bug 4: P1 resolution is 120h, P5 resolution is 4h (swapped)
sla_targets:
  P1:
    response_time: 15m
    resolution_time: 120h  # Should be 4h
  P2:
    response_time: 30m
    resolution_time: 8h
  P3:
    response_time: 2h
    resolution_time: 24h
  P4:
    response_time: 4h
    resolution_time: 48h
  P5:
    response_time: 1d
    resolution_time: 4h    # Should be 120h (5 business days)

# Bug 5: Critical incidents only use email notification
notification_rules:
  P1:
    channels:
      - email              # Missing: pagerduty, phone, slack
    frequency: every_4h
  P2:
    channels:
      - email
      - slack
    frequency: every_2h
  P3:
    channels:
      - email
    frequency: every_8h
