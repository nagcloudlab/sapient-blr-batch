# FoodExpress Incident Record Template -- FIXED VERSION

incident:
  number: INC-2026-0460
  title: "Order Service returning HTTP 500 errors"
  description: "Multiple customers reporting order failures since 14:00"

  # Fix 1: High Impact + High Urgency = P1
  impact: High
  urgency: High
  priority: P1

  # Fix 2: Correct category path
  category: "Application > Order > API"

  # Fix 3: P1 response time is 15 minutes
  sla:
    response_time: "15 minutes"
    resolution_time: "4 hours"

  # Fix 4: Assigned to Platform Engineering team
  assignment:
    group: "Platform Engineering"
    assigned_to: "Ravi Kumar (On-call)"

  # Fix 5: Complete status flow
  status_flow:
    - "New"
    - "In Progress"
    - "Pending"
    - "Resolved"
    - "Closed"

  # Fix 6: Correct related CI
  related_ci: "order-service-v2.3.1"

  affected_service: "Order Platform"
  affected_users: "~2,000 customers"

  # Fix 7: Complete communication plan
  communication:
    stakeholder_notifications:
      - recipient: "VP Engineering"
        method: "Phone"
        frequency: "Every 30 minutes until resolved"
      - recipient: "Operations Director"
        method: "Email + Slack"
        frequency: "Every 30 minutes"
      - recipient: "Customer Support Lead"
        method: "Slack (#inc-0460)"
        frequency: "Every 15 minutes"
    status_page_update: true
    customer_message: "We are aware of issues with order placement and are actively working to resolve them. We apologize for the inconvenience."

  timeline:
    - time: "14:00"
      event: "First customer complaint received"
    - time: "14:05"
      event: "Prometheus alert fired: HighErrorRate on order-service"
    - time: "14:10"
      event: "On-call engineer investigating"
