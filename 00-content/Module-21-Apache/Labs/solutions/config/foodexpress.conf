# FoodExpress Apache Virtual Host Configuration (FIXED)
#
# ALL BUGS FIXED:
# FIX 1: VirtualHost port corrected to *:80 (matches Listen 80)
# FIX 2: DocumentRoot corrected to /var/www/foodexpress/public
# FIX 3: ProxyPass corrected to port 8080 (Java/Spring backend)

# Apache listens on port 80
Listen 80

# FIX 1: VirtualHost now uses *:80 to match Listen directive
<VirtualHost *:80>
    ServerName foodexpress.local
    ServerAlias www.foodexpress.local
    ServerAdmin admin@foodexpress.local

    # FIX 2: Corrected DocumentRoot path
    DocumentRoot /var/www/foodexpress/public

    <Directory /var/www/foodexpress/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # FIX 3: ProxyPass corrected to port 8080 (Java/Spring backend)
    ProxyPreserveHost On
    ProxyPass /api http://localhost:8080/api
    ProxyPassReverse /api http://localhost:8080/api

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/foodexpress-error.log
    CustomLog ${APACHE_LOG_DIR}/foodexpress-access.log combined

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>

    # Cache static assets
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>
</VirtualHost>
